<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f2b">
<meta name="description" content="THẮM SHOP – Thông tin sản phẩm đa ngôn ngữ">
<title>THẮM SHOP · Product Information</title>
<style>
:root{--green:#173f2b;--green2:#2d6547;--gold:#b08a45;--ink:#202522;--muted:#6c756f;--line:#e3e8e4;--soft:#f5f8f5;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#edf3ee 0,#fff 52%);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
main{width:min(760px,calc(100% - 28px));margin:22px auto 42px;background:var(--white);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 55px rgba(23,63,43,.11);overflow:hidden}
.head{padding:24px 24px 18px;text-align:center;border-bottom:1px solid var(--line)}.brand{font-size:13px;letter-spacing:3.5px;font-weight:800;color:var(--green)}.sub{margin-top:7px;color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.hero{padding:25px 25px 18px;text-align:center;background:linear-gradient(180deg,#fff 0,#fafcf9 100%)}.product-image{display:block;width:auto;max-width:78%;height:240px;object-fit:contain;margin:0 auto 16px}.title{font-size:23px;line-height:1.35;font-weight:800;color:var(--green);margin:0 auto;max-width:670px}
.choices{padding:15px 25px 30px}.lang{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--green);font-size:17px;font-weight:800;text-align:left;cursor:pointer;transition:.18s;box-shadow:0 3px 12px rgba(23,63,43,.035)}.lang:hover{border-color:#c6d4c9;background:var(--soft);transform:translateY(-1px);box-shadow:0 7px 18px rgba(23,63,43,.08)}.flag{font-size:23px;line-height:1}.lang small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:4px}
.content{padding:0 29px 31px;line-height:1.75}.selected{text-align:center;color:var(--green);font-weight:800;font-size:13px;letter-spacing:1px;padding:19px 0 16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.source-body{font-size:15.5px}.source-body h2,.source-body h3{color:var(--green);line-height:1.35;margin:25px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}.source-body h2{font-size:18px}.source-body h3{font-size:16px}.source-body p{margin:9px 0}.source-body ul,.source-body ol{margin:8px 0 15px;padding-left:24px}.source-body li{margin:5px 0}.source-body strong{color:#253f30}.back{display:block;text-align:center;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--green);font-weight:800;text-decoration:none}.error{text-align:center;color:#9a3434;padding:28px 10px}.hidden{display:none!important}
@media(max-width:520px){main{margin-top:9px;border-radius:19px}.head{padding:20px}.hero{padding:18px 18px 12px}.choices{padding:8px 18px 23px}.content{padding:0 18px 24px}.product-image{height:205px;max-width:88%}.title{font-size:20px}.source-body{font-size:15px}.lang{font-size:16px;padding:16px}.flag{font-size:21px}}
</style>
</head>
<body>
<main>
<header class="head"><div class="brand">THẮM SHOP</div><div class="sub">Product Information</div></header>
<section class="hero"><img id="productImage" class="product-image" alt="Product image" loading="eager"><h1 id="title" class="title">Đang tải thông tin sản phẩm…</h1></section>
<section id="choices" class="choices">
<button class="lang" onclick="showLanguage('vi')"><span class="flag">🇻🇳</span><span>Tiếng Việt<small>Thông tin sản phẩm bằng tiếng Việt</small></span></button>
<button class="lang" onclick="showLanguage('en')"><span class="flag">🇬🇧</span><span>English<small>Product information in English</small></span></button>
<button class="lang" onclick="showLanguage('ru')"><span class="flag">🇷🇺</span><span>Русский<small>Информация о продукте на русском языке</small></span></button>
<button class="lang" onclick="showLanguage('zh')"><span class="flag">🇨🇳</span><span>中文<small>产品信息（中文）</small></span></button>
</section>
<section id="result" class="content hidden"></section>
</main>
<script>
let product=null,source=null,languageSources={};
const images={'01':'https://www.lottemart.vn/media/catalog/product/cache/75x75/0/0/0079656603248-1.jpg.webp','02':'https://medias.watsons.vn/publishing/WTCVN-218425-side-zoom.jpg?version=1778085125','03':'https://cdn.taw9eel.com/media/catalog/product/cache/1/image/519x/9df78eab33525d08d6e5fb8d27136e95/m/h/mhjr1681_1.jpg','04':'https://www.guardian.com.vn/media/catalog/product/cache/30b2b44eba57cd45fd3ef9287600968e/3/0/3020168.png','05':'https://www.herbiflix.com/cdn/shop/files/71p1rp0m4YL._AC_SL1500.jpg?v=1761847295&width=1200','06':'https://favo.id/cdn/shop/files/BANTUB1012_Banana-Boat-After-Sun-Care-Aloe-Gel---90-mL.jpg?v=1772778753','07':'https://media.home.bargains/product-images/b/9/3/9/b9391251b3da3df966135f6d92ed855c4edf39a1.png?fit=cover&x=676&y=676','08':'https://i5.walmartimages.com/seo/Banana-Boat-Sport-Ultra-SPF-65-Sunscreen-Spray-6oz_909f1ffd-d0c8-47f4-8aee-afd6369b5692.0247d3f44b739b2bf27d74ea6b1460.jpeg','09':'https://www.static-src.com/wcsstore/Indraprastha/images/catalog/full/109/MTA-68439565/banana_boat_banana_boat_ultra_protect_spf50_90ml_full01_dxnk58wk.jpg','10':'https://www.static-src.com/wcsstore/Indraprastha/images/catalog/full/109/MTA-68439565/banana_boat_banana_boat_ultra_protect_spf50_90ml_full01_dxnk58wk.jpg','11':'https://f.nooncdn.com/p/pzsku/Z925D97444CF0D3CC0A67Z/45/_/1771586667/7bddb801-9520-45b9-a6a4-607b07906dd3.jpg','12':'https://down-vn.img.susercontent.com/file/vn-11134207-7r98o-luxa8c3ttmhee6','13':'https://assets.beiersdorf.com/-/media/images/8/a/9/b/9c873ab9c46f4562909404cc005503c3-web_1010x1180_transparent_png.png?ctx=in&hash=f555756b9fc53623b3b2e365d4f654b85&mw=768','14':'https://mcgrocer.com/cdn/shop/files/nivea-sun-protect-dry-touch-sun-cream-spray-spf50-200ml-41391391768814.jpg?v=1744439833','15':'https://rokbucket.rokomari.io/ProductNew20190903/260X372/Nivea_Sun_Protect_Moisture_Pump_Spray_SP-Nivea-33d8c-493293.png','16':'https://f.nooncdn.com/p/pzsku/ZAE09F60C5B37B807439Z/45/1765750701/4dbab885-f373-419b-8b23-22fa9f4fc70b.jpg?width=800','17':'https://www.bbassets.com/media/uploads/p/l/40008021_5-nivea-sun-lotion-spf-30-with-uva-uvb-protection-water-resistant-sunscreen-for-men-women.jpg','18':'https://media.farmaciatei.ro/gallery/48266/ulei-spray-pentru-plaja-cu-spf-6-tropical-bronze-200-ml-nivea-sun-9115.jpg'};
const ui={vi:{label:'🇻🇳 TIẾNG VIỆT',back:'← Chọn ngôn ngữ khác'},en:{label:'🇬🇧 ENGLISH',back:'← Choose another language'},ru:{label:'🇷🇺 РУССКИЙ',back:'← Выбрать другой язык'},zh:{label:'🇨🇳 中文',back:'← 选择其他语言'}};
function esc(s){return String(s??'').replace(/[&<>\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function md(s){let x=esc(s);x=x.replace(/^#### (.+)$/gm,'<h3>$1</h3>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>');x=x.replace(/^\\- (.+)$/gm,'<li>$1</li>').replace(/^- (.+)$/gm,'<li>$1</li>');x=x.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g,'<ul>$1</ul>');x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');x=x.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');x=x.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+x+'</p>'}
function getLanguageRaw(k){return languageSources.a?.products?.[product.id]?.[k]||languageSources.b?.products?.[product.id]?.[k]||languageSources.c?.products?.[product.id]?.[k]||null}
function render(k){const raw=getLanguageRaw(k);if(raw)return '<div class="selected">'+ui[k].label+'</div><div class="source-body">'+md(raw)+'</div><a class="back" href="javascript:location.reload()">'+ui[k].back+'</a>';return '<div class="error">Không tìm thấy nội dung ngôn ngữ này.</div>'}
async function init(){let raw=new URLSearchParams(location.search).get('product')||'';raw=raw.padStart(2,'0');if(!/^\d{2}$/.test(raw)||+raw<1||+raw>18){document.getElementById('title').textContent='Không tìm thấy sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Mã sản phẩm không hợp lệ.</div>';document.getElementById('productImage').classList.add('hidden');return}try{const urls=['./products-master.json','./products-detail-source.json','./products-language-source.json','./products-language-source-05-09.json','./products-language-source-10-14.json','./products-language-source-15-18.json'];const r=await Promise.all(urls.map(u=>fetch(u+'?'+Date.now(),{cache:'no-store'})));if(r.some(x=>!x.ok))throw Error('Cannot load product data');const master=await r[0].json();source=await r[1].json();const lang04=await r[2].json();const lang0509=await r[3].json();const lang1014=await r[4].json();const lang1518=await r[5].json();languageSources={a:lang04,b:{products:lang0509.products},c:{products:{...lang1014.products,...lang1518.products}}};product=master.products.find(x=>x.id===raw);if(!product)throw Error('Product not found');document.getElementById('productImage').src=images[raw]||'';document.getElementById('productImage').alt=product.vi?.name||'';document.getElementById('title').textContent=product.vi?.name||source.products[raw]?.name||''}catch(e){document.getElementById('title').textContent='Không thể tải thông tin sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Vui lòng tải lại trang và thử lại.</div>';console.error(e)}}
function showLanguage(k){if(!product)return;const result=document.getElementById('result');result.innerHTML=render(k);document.getElementById('choices').classList.add('hidden');document.getElementById('title').classList.add('hidden');document.getElementById('productImage').classList.add('hidden');result.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
init();
</script>
</body>
</html>
