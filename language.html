methyl Ionone, Citronellol, Coumarin, Geraniol, Methyl Benzoate, Hexyl Cinnamal, Fragrance.\n\n**Способ применения:**\nРавномерно наносить на кожу за 20–30 минут до пребывания на солнце и дать средству полностью впитаться перед одеванием. Не распылять на лицо и в глаза. Регулярно повторять нанесение, особенно после плавания и вытирания тела. Избегать чрезмерного пребывания на солнце в период сильной солнечной активности.\n\nПодходит для всех типов кожи","zh":"**NIVEA SUN Protection & Lightness SPF50 清爽干触感防晒喷雾**\n\n试试 NIVEA Sun Protection & Lightness SPF 50 清爽干触感防晒喷雾：\n- NIVEA 系列中的高效 UVA/UVB 防护\n- 出色的防水能力，即使长时间游泳也能帮助保护肌肤\n- 清新、轻盈、不油腻的配方，快速吸收且不黏腻\n- 给肌肤带来轻微清凉感\n- 透明配方，不在肌肤上留下白色痕迹\n- 喷雾形式便于从不同姿势和角度使用\n- 对海洋友好：配方不含 Octinoxate、Oxybenzone 紫外线过滤剂\n- 相信 NIVEA 的防晒保护\n\n**成分：**\nAlcohol denat.（体积29.27%）、Butane、Isobutane、Propane、C12-15 Alkyl Benzoate、Homosalate、Octocrylene、Butyl Methoxydibenzoylmethane、Ethylhexyl Salicylate、Dibutyl Adipate、Propylheptyl Caprylate、Glycerin、Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine、Acrylates/Octylacrylamide Copolymer、Diethylamino Hydroxybenzoyl Hexyl Benzoate、Ethylhexyl Triazone、Tocopherol、Water、Linalool、Limonene、Benzyl Alcohol、Benzyl Salicylate、Alpha-Isomethyl Ionone、Citronellol、Coumarin、Geraniol、Methyl Benzoate、Hexyl Cinnamal、Fragrance。\n\n**使用方法：**\n在接触阳光前20–30分钟均匀涂抹于肌肤，并在穿衣前等待产品完全吸收。不要喷于面部或眼睛。定期重新涂抹，尤其是在游泳和擦干身体后。强烈日照时避免过度暴露于阳光下。\n\n适合所有肤质"},{"id":"15","name":"Xịt chống nắng NIVEA SPF 30+, 200 ml","price":null,"raw_vi":"Xịt chống nắng NIVEA SPF 30+, 200 ml\n\nHãy thử kem chống nắng dạng xịt dưỡng ẩm NIVEA Sun với SPF 30: • Dạng xịt tiện lợi • Bảo vệ hiệu quả khỏi tia UVA/UVB và cháy nắng, giảm nguy cơ dị ứng ánh nắng mặt trời • Chống thấm nước - bảo vệ da ngay cả khi ở dưới nước • Dưỡng ẩm da • Công thức nhẹ, thẩm thấu nhanh và không gây cảm giác bết dính trên da • Công thức phân hủy sinh học - không gây hại cho đại dương*. *Vì sự quan tâm đến đại dương: công thức không chứa vi nhựa và các chất lọc tia UV Octinoxate, Oxybenzone, Octocrylene. Đã được kiểm nghiệm da liễu. Hãy tin tưởng vào khả năng chống nắng của thương hiệu NIVEA.\n\nHợp chất:\nNước, Cồn biến tính (8,44% thể tích), Isopropyl Palmitate, Glycerin, Ethylhexyl Salicylate, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, Dibutyl Adipate, Butylene Glycol Dicaprylate/Dicaprate, Ethylhexyl Triazone, Glyceryl Stearate, Axit Phenylbenzimidazole Sulfonic, Tocopheryl Acetate, Dầu hạt cải hydro hóa, Sáp ong (Copernicia Cerifera Cera), Cetyl Palmitate, Sodium Stearoyl Glutamate, Cellulose vi tinh thể, Xanthan Gum, Cellulose Gum, Caprylyl Glycol, Phenoxyethanol, Trisodium EDTA, Natri Hydroxide, Natri Clorua, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Cồn hồi, Hương liệu.\n\nHướng dẫn:\nThoa đều lên da 20-30 phút trước khi tiếp xúc với ánh nắng mặt trời và để sản phẩm thẩm thấu hoàn toàn trước khi mặc quần áo. Không thoa trực tiếp lên mặt. Thoa lại thường xuyên, đặc biệt sau khi bơi và lau khô người. Tránh tiếp xúc quá nhiều với ánh nắng mặt trời trong thời gian nắng gắt.\n\nphù hợp cho mọi loại da","en":"**NIVEA Sunscreen Spray SPF30+, 200ml**\n\nTry NIVEA Sun moisturizing sunscreen spray with SPF 30:\n• Convenient spray format\n• Effective protection against UVA/UVB and sunburn, helping reduce the risk of sun allergy\n• Water-resistant – protects skin even while in water\n• Moisturizes skin\n• Lightweight formula that absorbs quickly without a sticky feeling\n• Biodegradable formula – does not harm the ocean*. *For concern for the ocean: the formula contains no microplastics and no UV filters Octinoxate, Oxybenzone or Octocrylene. Dermatologically tested. Trust NIVEA sun protection.\n\n**Compound:**\nWater, Alcohol denat. (8.44% by volume), Isopropyl Palmitate, Glycerin, Ethylhexyl Salicylate, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, Dibutyl Adipate, Butylene Glycol Dicaprylate/Dicaprate, Ethylhexyl Triazone, Glyceryl Stearate, Phenylbenzimidazole Sulfonic Acid, Tocopheryl Acetate, Hydrogenated Rapeseed Oil, Beeswax (Copernicia Cerifera Cera), Cetyl Palmitate, Sodium Stearoyl Glutamate, Microcrystalline Cellulose, Xanthan Gum, Cellulose Gum, Caprylyl Glycol, Phenoxyethanol, Trisodium EDTA, Sodium Hydroxide, Sodium Chloride, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Anise Alcohol, Fragrance.\n\n**Directions:**\nApply evenly to the skin 20–30 minutes before exposure to sunlight and allow the product to absorb completely before dressing. Do not apply directly to the face. Reapply regularly, especially after swimming and drying the body. Avoid excessive exposure to sunlight during periods of strong sunshine.\n\nSuitable for all skin types","ru":"**Солнцезащитный спрей NIVEA SPF30+, 200 мл**\n\nПопробуйте увлажняющий солнцезащитный спрей NIVEA Sun SPF 30:\n• Удобный формат спрея\n• Эффективная защита от UVA/UVB и солнечных ожогов, помогает снизить риск аллергии на солнце\n• Водостойкость — защищает кожу даже в воде\n• Увлажняет кожу\n• Лёгкая формула быстро впитывается и не оставляет липкости\n• Биоразлагаемая формула — не вредит океану*. *Забота об океане: формула не содержит микропластика и УФ-фильтров Octinoxate, Oxybenzone, Octocrylene. Дерматологически протестировано. Доверяйте защите NIVEA от солнца.\n\n**Состав:**\nWater, Alcohol denat. (8,44% по объёму), Isopropyl Palmitate, Glycerin, Ethylhexyl Salicylate, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, Dibutyl Adipate, Butylene Glycol Dicaprylate/Dicaprate, Ethylhexyl Triazone, Glyceryl Stearate, Phenylbenzimidazole Sulfonic Acid, Tocopheryl Acetate, Hydrogenated Rapeseed Oil, Beeswax (Copernicia Cerifera Cera), Cetyl Palmitate, Sodium Stearoyl Glutamate, Microcrystalline Cellulose, Xanthan Gum, Cellulose Gum, Caprylyl Glycol, Phenoxyethanol, Trisodium EDTA, Sodium Hydroxide, Sodium Chloride, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Anise Alcohol, Fragrance.\n\n**Способ применения:**\nРавномерно наносить на кожу за 20–30 минут до пребывания на солнце и дать средству полностью впитаться перед одеванием. Не наносить непосредственно на лицо. Регулярно повторять нанесение, особенно после плавания и вытирания тела. Избегать чрезмерного пребывания на солнце при сильной солнечной активности.\n\nПодходит для всех типов кожи","zh":"**NIVEA SPF30+ 防晒喷雾，200ml**\n\n试试 NIVEA Sun SPF 30 保湿防晒喷雾：\n• 方便的喷雾形式\n• 有效抵御 UVA/UVB 和晒伤，帮助降低日光过敏风险\n• 防水——即使在水中也能帮助保护肌肤\n• 滋润肌肤\n• 轻盈配方快速吸收，不产生黏腻感\n• 可生物降解配方——减少对海洋的影响*。*关注海洋：配方不含微塑料及 Octinoxate、Oxybenzone、Octocrylene 紫外线过滤剂。经过皮肤科测试。相信 NIVEA 的防晒保护。\n\n**成分：**\nWater、Alcohol denat.（体积8.44%）、Isopropyl Palmitate、Glycerin、Ethylhexyl Salicylate、Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine、Butyl Methoxydibenzoylmethane、Dibutyl Adipate、Butylene Glycol Dicaprylate/Dicaprate、Ethylhexyl Triazone、Glyceryl Stearate、Phenylbenzimidazole Sulfonic Acid、Tocopheryl Acetate、Hydrogenated Rapeseed Oil、Beeswax (Copernicia Cerifera Cera)、Cetyl Palmitate、Sodium Stearoyl Glutamate、Microcrystalline Cellulose、Xanthan Gum、Cellulose Gum、Caprylyl Glycol、Phenoxyethanol、Trisodium EDTA、Sodium Hydroxide、Sodium Chloride、Linalool、Benzyl Alcohol、Alpha-Isomethyl Ionone、Citronellol、Anise Alcohol、Fragrance。\n\n**使用方法：**\n在接触阳光前20–30分钟均匀涂抹于肌肤，并在穿衣前等待产品完全吸收。不要直接涂抹于面部。定期重新涂抹，尤其是在游泳和擦干身体后。强烈日照时避免过度暴露于阳光下。\n\n适合所有肤质"},{"id":"16","name":"Kem chống nắng dưỡng ẩm và bảo vệ da Nivea SPF 50+, 200 ml","price":null,"raw_vi":"Kem chống nắng dưỡng ẩm và bảo vệ da Nivea SPF 50+, 200 ml\n\n**THÔNG TIN SẢN PHẨM**\n- **Bảo vệ & chăm sóc – Kem chống nắng bảo vệ da 2 lần: Hệ thống lọc tia UVA/UVB bảo vệ tức thì hiệu quả cao đồng thời kem còn chăm sóc da.**\n- **Cân bằng vi sinh vật – Công thức nuôi dưỡng của kem chống nắng NIVEA SUN cung cấp độ ẩm trong 48 giờ và hoạt động cân bằng với hệ vi sinh vật của da.**\n- **Da & Môi trường – Không tính đến đại dương, công thức này có khả năng phân hủy sinh học 75%, không chứa hạt vi nhựa và bộ lọc tia cực tím octocrylene, octinoxate và oxybenzone.**\n- **Công thức chống thấm nước* – Sữa chống nắng NIVEA SUN ấn tượng với công thức chống thấm nước*. Khả năng chịu đựng của da đã được kiểm nghiệm da liễu. (*Sau khi ở trong nước 2 x 20 phút, vẫn còn ít nhất 50% chỉ số chống nắng.)**\n\nCho làn da mềm mại và dẻo dai trong mùa hè\n- Sản phẩm chống nắng NIVEA SUN Protection & Care bảo vệ da theo hai cách: Hệ thống lọc tia UVA/UVB hiệu quả cao bảo vệ da khỏi lão hóa da sớm và cháy nắng. Ngoài ra, công thức dưỡng ẩm chống lại hiện tượng khô da do ánh nắng mặt trời. Nó hoạt động cân bằng với hệ vi sinh vật của da, hệ thống bảo vệ tự nhiên của da. Điều này củng cố làn da từ bên trong.\n\nThành phần: Aqua, Glycerin, Isopropyl Palmitate, Alcohol Denat., Butyl Methoxydibenzoylmethane, Cocoglycerides, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Ethylhexyl Salicylate, Titanium Dioxide (nano), Butylene Glycol Dicaprylate/Dicaprate, C12-15 Alkyl Benzoate, Dầu hạt cải hydro hóa, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Ethylhexyl Triazone, Silica Dimethyl Silylate, Phenylbenzimidazole Sulfonic Acid, Tocopheryl Acetate, Cellulose vi tinh thể, Cellulose Gum, Rượu Behenyl, Stearyl Alcohol, Phenoxyethanol, Xanthan Gum, Hydroxyacetophenone, Silica, Trinatri EDTA, Natri Stearoyl Glutamate, Dimethicone, Natri Hydroxide , Natri Clorua, Linalool, Rượu Benzyl, Alpha-Isomethyl Ionone, Citronellol, Parfum","en":"**Nivea Moisturizing & Protective Sunscreen SPF50+, 200ml**\n\n**PRODUCT INFORMATION**\n- **Protection & care – sunscreen protects skin twice:** The UVA/UVB filter system provides immediate effective protection while the cream also cares for the skin.\n- **Microbiome balance:** The nourishing formula of NIVEA SUN sunscreen provides 48-hour moisture and works in balance with the skin microbiome.\n- **Skin & environment:** Excluding the ocean, the formula is 75% biodegradable, contains no microplastic particles and no UV filters octocrylene, octinoxate and oxybenzone.\n- **Water-resistant formula*:** NIVEA SUN sunscreen lotion has a water-resistant formula*. Skin tolerance has been dermatologically tested. (*After being in water 2 × 20 minutes, at least 50% of the sun protection factor remains.)\n\n**For soft and supple skin in summer**\n- NIVEA SUN Protection & Care sunscreen protects skin in two ways: the effective UVA/UVB filter system protects against premature skin aging and sunburn. The moisturizing formula also helps prevent sun-induced dryness. It works in balance with the skin microbiome, the skin's natural protective system, helping strengthen the skin from within.\n\n**Ingredients:** Aqua, Glycerin, Isopropyl Palmitate, Alcohol Denat., Butyl Methoxydibenzoylmethane, Cocoglycerides, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Ethylhexyl Salicylate, Titanium Dioxide (nano), Butylene Glycol Dicaprylate/Dicaprate, C12-15 Alkyl Benzoate, Hydrogenated Rapeseed Oil, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Ethylhexyl Triazone, Silica Dimethyl Silylate, Phenylbenzimidazole Sulfonic Acid, Tocopheryl Acetate, Microcrystalline Cellulose, Cellulose Gum, Behenyl Alcohol, Stearyl Alcohol, Phenoxyethanol, Xanthan Gum, Hydroxyacetophenone, Silica, Trisodium EDTA, Sodium Stearoyl Glutamate, Dimethicone, Sodium Hydroxide, Sodium Chloride, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Parfum","ru":"**Увлажняющее и защищающее солнцезащитное средство Nivea SPF50+, 200 мл**\n\n**ИНФОРМАЦИЯ О ПРОДУКТЕ**\n- **Защита и уход — двойная защита кожи:** система фильтров UVA/UVB обеспечивает эффективную мгновенную защиту, а крем одновременно ухаживает за кожей.\n- **Баланс микробиома:** питательная формула NIVEA SUN обеспечивает увлажнение в течение 48 часов и работает в балансе с микробиомом кожи.\n- **Кожа и окружающая среда:** без учёта океана формула биоразлагаема на 75%, не содержит частиц микропластика и УФ-фильтров octocrylene, octinoxate и oxybenzone.\n- **Водостойкая формула*:** солнцезащитное средство NIVEA SUN отличается водостойкой формулой*. Переносимость кожей проверена дерматологически. (*После пребывания в воде 2 × 20 минут сохраняется не менее 50% солнцезащитного фактора.)\n\n**Для мягкой и эластичной кожи летом**\n- NIVEA SUN Protection & Care защищает кожу двумя способами: эффективная система фильтров UVA/UVB защищает от преждевременного старения и солнечных ожогов. Увлажняющая формула также помогает противостоять сухости, вызванной солнцем. Она работает в балансе с микробиомом кожи и её естественной защитной системой, помогая укреплять кожу изнутри.\n\n**Состав:** Aqua, Glycerin, Isopropyl Palmitate, Alcohol Denat., Butyl Methoxydibenzoylmethane, Cocoglycerides, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Ethylhexyl Salicylate, Titanium Dioxide (nano), Butylene Glycol Dicaprylate/Dicaprate, C12-15 Alkyl Benzoate, Hydrogenated Rapeseed Oil, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Ethylhexyl Triazone, Silica Dimethyl Silylate, Phenylbenzimidazole Sulfonic Acid, Tocopheryl Acetate, Microcrystalline Cellulose, Cellulose Gum, Behenyl Alcohol, Stearyl Alcohol, Phenoxyethanol, Xanthan Gum, Hydroxyacetophenone, Silica, Trisodium EDTA, Sodium Stearoyl Glutamate, Dimethicone, Sodium Hydroxide, Sodium Chloride, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Parfum","zh":"**Nivea SPF50+ 保湿防护防晒霜，200ml**\n\n**产品信息**\n- **保护与护理——双重防护肌肤：** UVA/UVB过滤系统即时提供高效保护，同时护理肌肤。\n- **微生物组平衡：** NIVEA SUN 防晒霜的滋养配方提供48小时保湿，并与肌肤微生物组保持平衡。\n- **肌肤与环境：** 除海洋相关因素外，该配方可生物降解75%，不含微塑料颗粒以及 octocrylene、octinoxate 和 oxybenzone 紫外线过滤剂。\n- **防水配方*：** NIVEA SUN 防晒乳采用防水配方*，皮肤耐受性经过皮肤科测试。（*在水中2×20分钟后，仍至少保留50%的防晒指数。）\n\n**让肌肤在夏季保持柔软有弹性**\n- NIVEA SUN Protection & Care 通过两种方式保护肌肤：高效 UVA/UVB 过滤系统帮助防止肌肤过早老化和晒伤；保湿配方帮助抵御阳光造成的干燥。它与肌肤微生物组及天然保护系统保持平衡，从内部帮助强化肌肤。\n\n**成分：** Aqua, Glycerin, Isopropyl Palmitate, Alcohol Denat., Butyl Methoxydibenzoylmethane, Cocoglycerides, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Ethylhexyl Salicylate, Titanium Dioxide (nano), Butylene Glycol Dicaprylate/Dicaprate, C12-15 Alkyl Benzoate, Hydrogenated Rapeseed Oil, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Ethylhexyl Triazone, Silica Dimethyl Silylate, Phenylbenzimidazole Sulfonic Acid, Tocopheryl Acetate, Microcrystalline Cellulose, Cellulose Gum, Behenyl Alcohol, Stearyl Alcohol, Phenoxyethanol, Xanthan Gum, Hydroxyacetophenone, Silica, Trisodium EDTA, Sodium Stearoyl Glutamate, Dimethicone, Sodium Hydroxide, Sodium Chloride, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Parfum"},{"id":"17","name":"Kem chống nắng dưỡng ẩm mỏng nhẹ Nivea SPF30 75ML","price":null,"raw_vi":"Kem chống nắng dưỡng ẩm mỏng nhẹ Nivea SPF30 75ML\n\n**Sữa Chống Nắng Bảo Vệ Da Chuyên Sâu NIVEA SPF30 PA+ (75ml)** giúp bảo vệ da khỏi tia UVA1, UVA2 và UVB đồng thời giúp dưỡng ẩm và nuôi dưỡng da.\n\nNgoài ra, hệ thống chắn tia UVA & UVB cải tiến và cơ chế chống nắng linh hoạt Collagen Protect giúp chống nắng tức thì ngay khi sử dụng.\n\nSPF 30 bảo vệ da không sạm đen và cháy nắng ngay cả dưới điều kiện tiếp xúc trực tiếp dưới nắng. Sữa chống nắng vẫn có tác dụng khi bạn xuống nước.\n\n**Công dụng**\n- Hệ thống chắn tia UVA & UVB cải tiến và cơ chế chống nắng linh hoạt Collagen Protect giúp chống nắng tức thì ngay khi sử dụng.\n- SPF 30 bảo vệ da không sạm đen và cháy nắng ngay cả dưới điều kiện tiếp xúc trực tiếp dưới nắng.\n- Sữa chống nắng vẫn có tác dụng khi bạn xuống nước.\n\n**Loại da phù hợp**: Dùng được cho mọi loại da\n\n**Hướng dẫn sử dụng**\n- Thoa sữa chống nắng lên da trước khi ra nắng.\n- Sau khi xuống nước và lau người khô nên thoa lại.\n- Thoa lại sau 2 tiếng nếu tiếp xúc nhiều với nắng.\n- Thoa trước khi ra nắng 20 phút\n- xuất xứ :Đức","en":"**Nivea Lightweight Moisturizing Sunscreen SPF30 75ML**\n\n**NIVEA SPF30 PA+ Deep Skin Protection Sunscreen Milk (75ml)** helps protect skin from UVA1, UVA2 and UVB rays while moisturizing and nourishing the skin.\n\nThe improved UVA & UVB blocking system and Collagen Protect flexible sun-protection mechanism provide immediate sun protection upon use.\n\nSPF30 helps protect skin from darkening and sunburn even under direct sun exposure. The sunscreen milk remains effective when you go into water.\n\n**Benefits**\n- The improved UVA & UVB blocking system and Collagen Protect mechanism provide immediate protection upon use.\n- SPF30 protects against darkening and sunburn under direct sunlight.\n- The sunscreen milk remains effective when you enter water.\n\n**Suitable skin type:** Suitable for all skin types\n\n**Directions for use**\n- Apply sunscreen milk to the skin before sun exposure.\n- Reapply after going into water and drying the body.\n- Reapply after 2 hours if exposed to sunlight for a long time.\n- Apply 20 minutes before sun exposure.\n- Origin: Germany","ru":"**Лёгкое увлажняющее солнцезащитное средство Nivea SPF30 75 мл**\n\n**Солнцезащитное молочко NIVEA SPF30 PA+ для глубокой защиты кожи (75 мл)** помогает защищать кожу от лучей UVA1, UVA2 и UVB, одновременно увлажняя и питая кожу.\n\nУлучшенная система защиты от UVA и UVB и гибкий механизм защиты Collagen Protect обеспечивают защиту от солнца сразу после нанесения.\n\nSPF30 помогает защищать кожу от потемнения и солнечных ожогов даже при прямом воздействии солнца. Солнцезащитное молочко продолжает действовать при контакте с водой.\n\n**Свойства**\n- Улучшенная система блокировки UVA/UVB и механизм Collagen Protect обеспечивают мгновенную защиту после нанесения.\n- SPF30 помогает защищать от потемнения и солнечных ожогов при прямом солнечном свете.\n- Солнцезащитное молочко сохраняет действие при контакте с водой.\n\n**Подходящий тип кожи:** Подходит для всех типов кожи\n\n**Способ применения**\n- Наносить солнцезащитное молочко на кожу перед выходом на солнце.\n- Повторно наносить после контакта с водой и вытирания кожи.\n- Повторять нанесение через 2 часа при длительном пребывании на солнце.\n- Наносить за 20 минут до выхода на солнце.\n- Происхождение: Германия","zh":"**Nivea SPF30 轻盈保湿防晒乳 75ML**\n\n**NIVEA SPF30 PA+ 深层肌肤保护防晒乳（75ml）** 有助于保护肌肤免受 UVA1、UVA2 和 UVB 射线影响，同时帮助滋润和滋养肌肤。\n\n改进的 UVA & UVB 防护系统和 Collagen Protect 灵活防晒机制，在使用后即可提供即时防晒保护。\n\nSPF30 即使在直接阳光照射下也有助于防止肌肤变黑和晒伤。进入水中后防晒乳仍可发挥作用。\n\n**功效**\n- 改进的 UVA & UVB 防护系统及 Collagen Protect 机制，使用后即可提供即时防护。\n- SPF30 有助于在直接阳光下保护肌肤免受变黑和晒伤。\n- 进入水中后防晒乳仍可保持作用。\n\n**适用肤质：** 所有肤质均可使用\n\n**使用方法**\n- 日晒前将防晒乳涂抹于肌肤。\n- 下水并擦干身体后重新涂抹。\n- 长时间接触阳光时，每2小时重新涂抹。\n- 日晒前20分钟涂抹。\n- 原产地：德国"},{"id":"18","name":"Dầu chống nắng dạng xịt Nivea SPF6 \"Tropical Bronze\" 200ml","price":null,"raw_vi":"Dầu chống nắng dạng xịt Nivea/SPF6 \"Tropical Bronze\" 200ml\n\nXịt khoáng tạo màu da nâu Tropical Bronze với chỉ số chống nắng SPF 6 bảo vệ da khỏi tia UVA và UVB cũng như cháy nắng, giúp da có được làn da rám nắng vàng óng, rạng rỡ và lâu trôi mà không cần dùng kem làm nâu da.\n\nNgoài ra, xịt chống nắng chứa chiết xuất caroten và vitamin E giúp dưỡng ẩm da, mang lại cảm giác mềm mại và mịn màng.\n\nKhông chứa các chất lọc tia cực tím gây hại cho môi trường như octinoxate và oxybenzone.\n\nCông thức này có khả năng phân hủy sinh học lên đến 94%.\n\nCung cấp khả năng bảo vệ tức thì chống lại tia UVA và UVB cũng như cháy nắng.\n\nLàn da rám nắng vàng óng, đậm màu và bền lâu.\n\nMang lại cảm giác mềm mượt cho da nhờ chiết xuất caroten và vitamin E.\n\nChiếc chai được làm từ 94% nhựa tái chế.\n\nĐã được kiểm nghiệm da liễu về khả năng tương thích với da.\n\nDung tích: 200ml\n\nThành phần: Isopropyl Palmitate, Alcohol Denat., Caprylic/Capric Triglyceride, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, C12-15 Alkyl Benzoate, Aqua, Coco-Caprylate/Caprate, Ethylhexyl Triazone, Polyglyceryl-4 Diisostearate/Polyhydroxystearate/Sebacate, Simmondsia Chinensis Seed Oil, Tocopheryl Acetate, Tocopherol, Zea Mays Oil, Limonene, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Geraniol, Parfum, CI 40800\n\nNhà sản xuất/Người chịu trách nhiệm tại EU","en":"**Nivea Tropical Bronze SPF6 Sunscreen Spray Oil 200ml**\n\nTropical Bronze tanning spray with SPF6 helps protect skin from UVA and UVB rays and sunburn while helping create a golden, radiant and long-lasting tan without using a tanning cream.\n\nThe sunscreen spray contains carotene extract and vitamin E to moisturize skin and leave it feeling soft and smooth.\n\nIt does not contain environmentally harmful UV filters such as octinoxate and oxybenzone.\n\nThe formula is up to 94% biodegradable.\n\nProvides immediate protection against UVA and UVB rays and sunburn.\n\nCreates a golden, deep and long-lasting tan.\n\nLeaves skin feeling soft and smooth thanks to carotene extract and vitamin E.\n\nThe bottle is made from 94% recycled plastic.\n\nDermatologically tested for skin compatibility.\n\nVolume: 200ml\n\n**Ingredients:** Isopropyl Palmitate, Alcohol Denat., Caprylic/Capric Triglyceride, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, C12-15 Alkyl Benzoate, Aqua, Coco-Caprylate/Caprate, Ethylhexyl Triazone, Polyglyceryl-4 Diisostearate/Polyhydroxystearate/Sebacate, Simmondsia Chinensis Seed Oil, Tocopheryl Acetate, Tocopherol, Zea Mays Oil, Limonene, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Geraniol, Parfum, CI 40800\n\nManufacturer/Responsible person in the EU","ru":"**Солнцезащитное масло-спрей Nivea SPF6 “Tropical Bronze” 200 мл**\n\nСпрей для загара Tropical Bronze с SPF6 помогает защищать кожу от UVA и UVB и солнечных ожогов, одновременно помогая получить золотистый, сияющий и стойкий загар без использования крема для искусственного загара.\n\nСпрей содержит экстракт каротина и витамин E, которые помогают увлажнять кожу и делают её мягкой и гладкой.\n\nНе содержит вредных для окружающей среды УФ-фильтров, таких как octinoxate и oxybenzone.\n\nФормула биоразлагаема до 94%.\n\nОбеспечивает мгновенную защиту от UVA/UVB и солнечных ожогов.\n\nСоздаёт золотистый, насыщенный и стойкий загар.\n\nБлагодаря экстракту каротина и витамину E кожа становится мягкой и гладкой.\n\nФлакон изготовлен из 94% переработанного пластика.\n\nДерматологически протестировано на совместимость с кожей.\n\nОбъём: 200 мл\n\n**Состав:** Isopropyl Palmitate, Alcohol Denat., Caprylic/Capric Triglyceride, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, C12-15 Alkyl Benzoate, Aqua, Coco-Caprylate/Caprate, Ethylhexyl Triazone, Polyglyceryl-4 Diisostearate/Polyhydroxystearate/Sebacate, Simmondsia Chinensis Seed Oil, Tocopheryl Acetate, Tocopherol, Zea Mays Oil, Limonene, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Geraniol, Parfum, CI 40800\n\nПроизводитель/ответственное лицо в ЕС","zh":"**Nivea SPF6 “Tropical Bronze” 防晒喷雾油 200ml**\n\nTropical Bronze SPF6 美黑喷雾有助于保护肌肤免受 UVA、UVB 和晒伤影响，同时帮助形成金色、明亮且持久的棕褐色肤色，无需使用美黑霜。\n\n防晒喷雾含有胡萝卜素提取物和维生素E，有助于滋润肌肤，使肌肤柔软光滑。\n\n不含 octinoxate 和 oxybenzone 等对环境有害的紫外线过滤剂。\n\n该配方最高可达94%生物降解。\n\n即时提供 UVA、UVB 和晒伤防护。\n\n形成金色、深色且持久的棕褐色肤色。\n\n胡萝卜素提取物和维生素E帮助肌肤保持柔软顺滑。\n\n瓶身由94%再生塑料制成。\n\n经过皮肤科测试，验证肌肤相容性。\n\n容量：200ml\n\n**成分：** Isopropyl Palmitate, Alcohol Denat., Caprylic/Capric Triglyceride, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, C12-15 Alkyl Benzoate, Aqua, Coco-Caprylate/Caprate, Ethylhexyl Triazone, Polyglyceryl-4 Diisostearate/Polyhydroxystearate/Sebacate, Simmondsia Chinensis Seed Oil, Tocopheryl Acetate, Tocopherol, Zea Mays Oil, Limonene, Linalool, Benzyl Alcohol, Alpha-Isomethyl Ionone, Citronellol, Geraniol, Parfum, CI 40800\n\n欧盟制造商/责任人"},{"id":"19","name":"Ống hít sao vàng 1.5g","price":15000,"raw_vi":"- **19.      Ống hít sao vàng 1.5g**\n\n·        \n**Thành phần**\n\n·        \nThành phần chính là menthol,\ncamphor, tinh dầu đinh hương, tinh dầu quế, tinh dầu tràm.\n\n·        \n**Chỉ định**\n\n·        \nỐng hít sao vàng được chỉ định dùng\ntrong các trường hợp nghẹt mũi, sổ mũi, ho, cảm lạnh, làm thông mũi và sát\ntrùng đường hô hấp.\n\n·        \n**Tác dụng phụ**\n\n·        \nMenthol có thể gây phản ứng quá mẫn\nbao gồm viêm da tiếp xúc. Đã có báo cáo về chứng ngưng thở và ngưng thở ngay ở\ntrẻ sơ sinh sau khi dùng menthol d \n\nCHỈ ĐỊNH: Khu phong,\nhoạt lạc, tiêu viêm, chỉ thống.\n\nTrị các chứng đau lưng cấp,\nmãn, đau thần kinh tọa. Viêm khớp chân tay co duỗi khó khăn. Té ngã do lao động\nhoặc khi chơi thể thao. Nhức mỏi cơ bắp, trẹo cổ, mỏi gáy, đau đầu. Côn trùng cắn.\n\nLIỀU DÙNG VÀ CÁCH\nDÙNG: Chỉ dùng xoa hoặc bóp ngoài da. Nên rửa sạch và lau khô vùng da trước\nkhi bôi xoa cao lên chỗ bị đau. Ngày 3 đến 4 lần, dùng Bạch Hổ hoạt lạc cao bôi\nlên chỗ, vùng bị đau hoặc bôi lên các huyệt vị. Sau đó lấy sống bàn tay chà xát\n(vừa phải đừng mạnh tay quá) hoặc day đối với các huyệt vị. *(Xem BẢNG\nHƯỚNG DẪN cách bôi và day ấn các huyệt vị, tiết đoạn vùng thần kinh bằng hình vẽ)*.\n\nĐọc kỹ hướng dẫn sử dụng\ntrước khi dùng. Nếu cần thêm thông tin xin hỏi ý kiến bác sỹ.\n\nCHỐNG CHỈ ĐỊNH:\n\n– Không dùng cho người mẫn\ncảm với bất kỳ thành phần nào của thuốc.\n\n– Không bôi vào vết\nthương hở, mắt, các vùng niêm mạc.\n\n– Không bôi vào vùng vú\nnếu đang nuôi con bú.\n\n– Không dùng cho trẻ em\ndưới 30 tháng tuổi, trẻ em có tiền sử động kinh hoặc co giật do sốt cao.\n\nTÁC DỤNG KHÔNG MONG MUỐN: Có\nthể xảy ra tình trạng mẫn cảm với tinh dầu với 1 số người có cơ địa nhạy cảm.\nChưa ghi nhận được báo cáo về phản ứng có hại của thuốc. Thông báo ngay\ncho bác sỹ hoặc dược sỹ những phản ứng có hại gặp phải khi sử dụng\nthuốc.\n\nTƯƠNG TÁC, TƯƠNG KỴ CỦA\nTHUỐC: Do không có các nghiên cứu về tính tương kỵ của thuốc, không trộn lẫn\nthuốc này với các thuốc khác. Cần thông báo cho bác sĩ hay dược sĩ của bạn tất\ncả các thuốc mà bạn đang sử dụng. Nếu cần thêm thông tin xin hỏi ý kiến bác sỹ\nhoặc dược sỹ.\n\nBẢO QUẢN: Để nơi khô\nmát, tránh ánh sáng, nhiệt độ dưới 30oC. Để xa tầm tay trẻ em.\n\nQUÁ LIỀU VÀ XỬ\nTRÍ: Không có dữ liệu về sử dụng thuốc quá liều, không dùng quá liều chỉ\nđịnh của thuốc.\n\nTHẬN TRỌNG KHI SỬ DỤNG\nTHUỐC: Thông báo cho bác sĩ nếu đang bị bệnh khác, bị dị ứng hoặc đang sử\ndụng các loại thuốc khác (kể cả các loại thuốc không kê toa).\n\nKhông có dữ liệu về sử dụng\nthuốc trên phụ nữ có thai, chỉ nên dùng thuốc nếu lợi ích vượt trội so với nguy\ncơ\n\nChưa có bằng chứng về\nảnh hưởng của thuốc lên khả năng lái xe, vận hành máy móc.\n\nHẠN DÙNG: 30\ntháng kể từ ngày sản xuất.\n\nKHUYẾN CÁO: Không\nđược sử dụng thuốc quá hạn (có ghi cụ thể trên bao bì) hoặc có nghi ngờ về chất\nlượng như: bị biến màu, chảy nhão…\n\nSẢN XUẤT THEO TIÊU CHUẨN: TCCS.\n\nSản xuất tại: Công ty\nTNHH Đông Nam Dược Bảo Linh\n\nGiá: 30.000","en":null,"ru":null,"zh":null},{"id":"45","name":"Dầu Lăn Sâm Thảo Dược Bảo Linh","price":50000,"raw_vi":"45.**Dầu Lăn Sâm Thảo Dược Bảo Linh\n10ml**\n\n**Mục đích sử dụng**\n\n- **Dùng để massage ngoài da, cho da cảm giác dịu nhẹ,      thoải mái.**\n- **Thích hợp sử dụng ở vùng da đầu, ngực, bụng,      lưng, cổ, mũi, lòng bàn tay, lòng bàn chân.**\n\n---\n\n**Thành phần**\n\n- **Paraffin**\n- ***Mentha Piperita***** (*****Peppermint*****)      oil**\n- **Menthol**\n- ***Syzygium aromaticum***** oil**\n- **Camphor**\n- **Eucalyptol**\n- ***Kaempferia galanga***** root oil**\n- ***Panax ginseng***** root extract**\n- **Neelicert Oil Brown 10101**\n\n---\n\n**Cách dùng**\n\n- **Thoa một lớp mỏng lên da và massage nhẹ.**\n- **Dùng được nhiều lần trong ngày.**\n\n---\n\n**Bảo quản**\n\n- **Để nơi khô ráo, tránh tiếp xúc với ánh nắng trực      tiếp.**\n\n---\n\n**Lưu ý**\n\n- **Không bôi lên vết thương hở, không tiếp xúc với      mắt.**\n- **Tránh xa tầm tay trẻ em.**\n- **Đọc kỹ hướng dẫn sử dụng trước khi dùng.**\n\n---\n\n**Sản xuất và chịu trách\nnhiệm đưa sản phẩm ra thị trường bởi:**\n**\nCÔNG TY TNHH ĐÔNG NAM DƯỢC BẢO LINH**\n\n**Giá: 50.000**","en":null,"ru":null,"zh":null},{"id":"46","name":"Dầu Lăn Gừng Thảo Dược Bảo","price":50000,"raw_vi":"**46. Dầu Lăn Gừng Thảo Dược Bảo\nLinh 10ml**\n\n**Mục đích sử dụng**\n\n- **Dùng để massage ngoài da, cho da cảm giác dịu nhẹ, thoải      mái.**\n- **Thích hợp sử dụng ở vùng da đầu, ngực, bụng, lưng, cổ,      lòng bàn tay, lòng bàn chân.**\n\n---\n\n**Thành phầ ẩm ra thị trường bởi:**\n**\nCÔNG TY TNHH ĐÔNG NAM DƯỢC BẢO LINH**\n\n**Giá:50.000**","en":null,"ru":null,"zh":null},{"id":"48","name":"Kem Xoa Bóp Tigre Blanc Bảo","price":150000,"raw_vi":"**48. Kem Xoa Bóp Tigre Blanc Bảo\nLinh**\n\n**Dùng để massage ngoài\nda, giúp dưỡng ẩm mềm da và săn chắc da, thích hợp sử dụng vùng da bụng, ngực,\nlưng, cổ, vai, gáy, lòng bàn tay, lòng bàn chân da nhạy cảm theo thời tiết lạnh.\nGiúp da dễ chịu, thoải mái, mang lại cảm giác dễ chịu cho người sử dụng.**\n\n**THÀNH PHẦN /\nINGREDIENTS**\n**\nWater, Camphor, Menthol, Mentha Piperita (Peppermint) oil, Glyceryl Stearate,\nCeteareth-20, Cetyl Palmitate, Glycerin, Ceteareth-12, Polyquaternium-37,\nEucalyptol, Lavandula Angustifolia (Lavender) oil, Cetearyl Alcohol, Syzygium\naromaticum oil, Mentha Viridis (Spearmint) oil.**\n\n**CÁCH DÙNG / DIRECTIONS**\n**\nLấy một lượng kem thích hợp, massage tại vùng cần tác động cho tới khi kem khô\nthấm thấu hết. Có thể dùng nhiều lần trong ngày.**\n**\nGently massage a sufficient quantity of the cream onto the affected 2 to 5\ntimes a day.**\n\n**LƯU Ý / CAUTION**\n**\nChỉ dùng ngoài da. Tránh để dính vào mắt. Không bôi lên vết thương hở. Bảo quản\nnơi khô ráo thoáng mát dưới 25°C.**\n**\nFor external use only. Keep out of reach of children. Avoid wounds and eyes.\nStore below 25°C**\n\n**ĐỌC KỸ HƯỚNG DẪN SỬ DỤNG\nTRƯỚC KHI DÙNG**\n**\nTRÁNH XA TẦM TAY TRẺ EM.**\n\n**Số CBMP:\n805/24/CBMP-ĐNa**\n\n---\n\n**Sản xuất và chịu trách\nnhiệm đưa sản phẩm ra thị trường bởi:**\n**\nCÔNG TY TNHH ĐÔNG NAM DƯỢC BẢO LINH**\n\n**Giá: 150.000**","en":null,"ru":null,"zh":null},{"id":"49","name":"Dầu Tràm Tinh Chế Bạch Thảo","price":90000,"raw_vi":"**49. Dầu Tràm Tinh Chế Bạch Thảo**\n\n**Mục đích sử dụng:**\n\n- **Dùng mát xa hoặc pha với nước tắm giúp thư giãn      làn da.**\n- **Thích hợp sử dụng ở vùng da bụng, ngực, lưng, cổ,      vai, gáy, lòng bàn tay, lòng bàn chân đặc biệt trong thời tiết lạnh.**\n- **Hương thơm tinh dầu giúp tạo cảm giác dễ chịu,      thoải mái.**\n- **Phù hợp dùng cho trẻ sơ sinh, trẻ nhỏ, phụ nữ      trước hoặc sau sinh và người lớn.**\n\n**Thành phần:**\n\n- Tinh dầu      Tràm tinh chế (Melaleuca leucadendron L. oil), Paraffin, Tinh dầu Oải      Hương (Lavandula Spica Oil), Camphor\n\n---\n\n**Bảo Quản & Chú Ý**\n**\nNơi khô thoáng, tránh ánh nắng mặt trời. Không bôi lên vết thương hở, không tiếp\nxúc với mắt. Tránh xa tầm tay trẻ em.**\n\n**ĐỌC KỸ HƯỚNG DẪN TRƯỚC\nKHI SỬ DỤNG.**\n\n**Các thông tin khác:**\n**\nXem trên tờ hướng dẫn.**\n\n**Số CBMP:\n886/25/CBMP-ĐNa**\n\n---\n\n**Sản xuất và chịu trách\nnhiệm đưa sản phẩm ra thị trường bởi:**\n\n**CÔNG TY TNHH ĐÔNG NAM\nDƯỢC BẢO LINH** \n\n**Giá: 90.000**","en":null,"ru":null,"zh":null},{"id":"50","name":"HỒNG LINH CỐT 20g","price":50000,"raw_vi":"**50. HỒNG LINH CỐT 20g**\n\n**Mỡ bôi ngoài da Hồng\nLinh Cốt là sản phẩm đầu tiên được bào chế dưới dạng mỡ có chứa Nọc rắn hổ mang\nkhô, kết hợp với các loại tinh dầu thiên nhiên và Methyl salicylat giúp GIẢM\nĐAU – CHỐNG VIÊM- TAN BẦM TÍM dùng cho người bị đau nhức xương khớp, đau mỏi\nvai gáy, bầm tím do té ngã.**\n**\nTÁC DỤNG DƯỢC LÝ:**\n**\n– Nọc rắn có tác dụng khu phong, trừ thấp, tiêu viêm chỉ thống.**\n**\n– Methyl salicylat dẫn huyết lưu thông, làm giảm hoặc mất lượng acid lactic\ntích tụ ở cơ, khớp nên có tác dụng giảm đau trong các trường hợp đau lưng, đau\nnhức thần kinh tọa và những bệnh đau nhức gốc phong thấp.**\n**\n– Menthol, tinh dầu bạc hà làm giãn mạch, tạo cảm giác mát lạnh bằng sự kích\nthích đặc hiệu trên các receptor tạo cảm giác mát ở đầu tận cùng của dây thần\nkinh cơ và da (là bộ phận dẫn truyền cảm giác đau), nên làm giảm đau và gây tê\ntại chỗ.**\n**\n– Camphor: có tác dụng giãn mạch và kích thích thần kinh ngoại biên của da, gây\ngiảm đau nhẹ khi sử dụng tại chỗ nên được dùng trong plaster để kích thích giảm\nđau trong đau cơ, đau dây thần kinh và các tình trạng tương tự. Camphor được\ndùng phối hợp với menthol để làm giảm ngứa da.**\n**\nCHỈ ĐỊNH:**\n**\n– Mỡ bôi ngoài da Hồng Linh Cốt dùng điều trị các bệnh thấp khớp, viêm đau khớp,\nviêm cơ.**\n**\n– Các trường hợp đau mỏi cơ bắp, bong gân, bầm tím do té ngã.**\n**\n– Các chứng đau thần kinh tọa, tê mỏi lưng vai gáy.**\n**\nCHỐNG CHỈ ĐỊNH:**\n**\n– Người mẫn cảm với các thành phần của thuốc**\n**\n– Trẻ em dưới 30 tháng tuổi, trẻ em có tiền sử động kinh hoặc co giật do sốt\ncao.**\n**\n– Không bôi xoa thuốc vào niêm mạc mắt, vùng dễ kích ứng, vết thương hở.**\n**\nTHẬN TRỌNG:**\n**\n– Thuốc có thể gây kích ứng ngoài da với những người mẫn cảm với các thành phần\ncủa thuốc, khi thấy các hiện tượng lạ phải ngừng dùng thuốc. Không nên dùng thuốc\nquá hạn hoặc có sự nghi ngờ về chất lượng của thuốc. Để biết thêm thông tin về\nthuốc xin hỏi ý kiến của bác sỹ hoặc dược sỹ.**\n**\nTÁC DỤNG KHÔNG MONG MUỐN:**\n**\n– Các tác dụng phụ của thuốc thường hiếm xảy ra, nếu có thường là kích ứng hoặc\ndị ứng ngoài da với người mẫn cảm với các thành phần của thuốc. Ngưng sử dụng\nthuốc và thông báo cho bác sỹ những tác dụng không mong muốn gặp phải khi sử dụng\nthuốc.**\n**\nBẢO QUẢN:**\n**\n– Nơi khô mát, tránh ánh sáng trực tiếp, nhiệt độ dưới 30 độ C**\n**\nHẠN DÙNG:**\n**\n– 60 tháng từ ngày sản xuất. Ngày sản xuất, hạn sử dụng ghi trên bao bì**\n**\nQUY CÁCH: Lọ 20g, hộp thiếc 10g**\n**\nSẢN XUẤT BỞI: Công ty CPDP Quảng Bình**\n**\nSản phẩm hiện có bán tại các nhà thuốc trên toàn quốc**\n\n**Giá: 50.000**","en":null,"ru":null,"zh":null},{"id":"51","name":"Cao Sao Vàng 10g","price":28000,"raw_vi":"**51. Cao Sao Vàng 10g**\n\n**Thành phần**\n\n**Thành phần cao sao\nvàng**\n\n- **Menthol (Tinh dầu bạc hà): Tạo cảm giác mát, làm      dịu đau, thông mũi.**\n- **Camphor (Long não): Kích thích tuần hoàn, giảm      đau cơ, đau đầu, làm ấm cơ thể.**\n- **Cajeput oil (Tinh dầu tràm): Kháng khuẩn nhẹ, hỗ      trợ giảm ho, giữ ấm.**\n- **Clove oil (Tinh dầu đinh hương): Giảm đau, sát      trùng, kháng viêm.**\n- **Cinnamon oil (Tinh dầu quế): Tăng lưu thông máu,      chống lạnh bụng, làm ấm.**\n\n**Công dụng**\n\n- **Hỗ trợ làm giảm triệu chứng cảm lạnh, đau đầu,      nghẹt mũi, ho nhẹ.**\n- **Giảm đau bụng, nhức mỏi cơ thể, đau khớp nhẹ do      thời tiết lạnh.**\n- **Hỗ trợ chống say tàu xe, làm dịu cảm giác buồn      nôn.**\n- **Giữ ấm cơ thể, đặc biệt trong mùa lạnh hoặc khi      dính mưa.**\n\n**Cách dùng**\n\n**Cách dùng cao sao vàng**\n\n- **Dùng ngoài da.**\n- **Thoa nhẹ một lượng nhỏ lên các vùng như trán,      thái dương, sống mũi, cổ, bụng hoặc gan bàn chân tùy vào mục đích sử dụng.**\n- **Khi bị say xe, có thể hít nhẹ mùi cao hoặc bôi      lên hai bên thái dương.**\n- **Có thể sử dụng nhiều lần trong ngày, nhưng nên      dùng lượng vừa đủ để tránh gây kích ứng da.**\n\n**Tác dụng phụ**\n\n**Tác dụng phụ cao sao\nvàng**\n\n- **Một số người có thể gặp phản ứng nhẹ như nóng      rát, đỏ da tại chỗ bôi.**\n- **Trường hợp rất hiếm có thể bị dị ứng với tinh dầu      (nổi mẩn, ngứa nhẹ).**\n\n**Lưu ý**\n\n- **Không bôi lên mắt, niêm mạc, vết thương hở hoặc      vùng da bị trầy xước.**\n- **Tránh xa tầm tay trẻ nhỏ.**\n- **Không sử dụng cho trẻ dưới 2 tuổi.**\n- **Phụ nữ mang thai, đang cho con bú cần tham khảo      ý kiến bác sĩ trước khi dùng.**\n- **Nếu có dấu hiệu kích ứng, nên ngưng sử dụng và rửa      sạch vùng da bôi.**\n\n**Bảo quản**\n\n- **Để nơi khô ráo, thoáng mát, tránh ánh sáng trực      tiếp và nhiệt độ cao.**\n- **Đóng kín nắp sau khi sử dụng để giữ chất lượng sản      phẩm.**\n- **Tránh để sản phẩm gần nguồn nhiệt hoặc môi trường      có độ ẩm cao.**\n- **Giá:28.000**","en":null,"ru":null,"zh":null},{"id":"52","name":". Cao Sao Vàng 20g","price":40000,"raw_vi":"**52. . Cao Sao Vàng 20g**\n\n**Thành phần**\n\n**Thành phần cao sao\nvàng**\n\n- **Menthol (Tinh dầu bạc hà): Tạo cảm giác mát, làm      dịu đau, thông mũi.**\n- **Camphor (Long não): Kích thích tuần hoàn, giảm      đau cơ, đau đầu, làm ấm cơ thể.**\n- **Cajeput oil (Tinh dầu tràm): Kháng khuẩn nhẹ, hỗ      trợ giảm ho, giữ ấm.**\n- **Clove oil (Tinh dầu đinh hương): Giảm đau, sát      trùng, kháng viêm.**\n- **Cinnamon oil (Tinh dầu quế): Tăng lưu thông máu,      chống lạnh bụng, làm ấm.**\n\n**Công dụng**\n\n- **Hỗ trợ làm giảm triệu chứng cảm lạnh, đau đầu,      nghẹt mũi, ho nhẹ.**\n- **Giảm đau bụng, nhức mỏi cơ thể, đau khớp nhẹ do      thời tiết lạnh.**\n- **Hỗ trợ chống say tàu xe, làm dịu cảm giác buồn      nôn.**\n- **Giữ ấm cơ thể, đặc biệt trong mùa lạnh hoặc khi      dính mưa.**\n\n**Cách dùng**\n\n**Cách dùng cao sao vàng**\n\n- **Dùng ngoài da.**\n- **Thoa nhẹ một lượng nhỏ lên các vùng như trán,      thái dương, sống mũi, cổ, bụng hoặc gan bàn chân tùy vào mục đích sử dụng.**\n- **Khi bị say xe, có thể hít nhẹ mùi cao hoặc bôi      lên hai bên thái dương.**\n- **Có thể sử dụng nhiều lần trong ngày, nhưng nên      dùng lượng vừa đủ để tránh gây kích ứng da.**\n\n**Tác dụng phụ**\n\n**Tác dụng phụ cao sao\nvàng**\n\n- **Một số người có thể gặp phản ứng nhẹ như nóng      rát, đỏ da tại chỗ bôi.**\n- **Trường hợp rất hiếm có thể bị dị ứng với tinh dầu      (nổi mẩn, ngứa nhẹ).**\n\n**Lưu ý**\n\n- **Không bôi lên mắt, niêm mạc, vết thương hở hoặc      vùng da bị trầy xước.**\n- **Tránh xa tầm tay trẻ nhỏ.**\n- **Không sử dụng cho trẻ dưới 2 tuổi.**\n- **Phụ nữ mang thai, đang cho con bú cần tham khảo      ý kiến bác sĩ trước khi dùng.**\n- **Nếu có dấu hiệu kích ứng, nên ngưng sử dụng và rửa      sạch vùng da bôi.**\n\n**Bảo quản**\n\n- **Để nơi khô ráo, thoáng mát, tránh ánh sáng trực      tiếp và nhiệt độ cao.**\n- **Đóng kín nắp sau khi sử dụng để giữ chất lượng sản      phẩm.**\n\n**Tránh để sản phẩm gần\nnguồn nhiệt hoặc môi trường có độ ẩm cao**\n\n**Giá:40.000**","en":null,"ru":null,"zh":null},{"id":"53","name":"Dầu gió xanh Thiên Thảo 12ml","price":29000,"raw_vi":"**53.** **Dầu gió xanh Thiên Thảo 12ml**\n\n**Công dụng**\n\n**Chỉ định**\n**\nDầu gió xanh Thiên Thảo dùng để chủ trị: Cảm, ho, sổ mũi, nhức đầu, say nắng,\ntrúng gió, say đi tàu xe, buồn nôn, đau bụng, sưng viêm, nhức mỏi, muỗi chích,\nkiến cắn, tê thấp tay chân.**\n**\nCách dùng**\n**\nThoa và xoa bóp chỗ đau, pha với nước ấm để xông, thoa bôi lên mũi để hít và ngửi.**\n**\nLiều dùng**\n**\nLiều dùng cụ thể tùy thuộc vào thể trạng và mức độ diễn tiến của bệnh. Để có liều\ndùng phù hợp, bạn cần tham khảo ý kiến bác sĩ hoặc chuyên viên y tế.**\n**\nLàm gì khi dùng quá liều?**\n**\nTrong trường hợp khẩn cấp, hãy gọi ngay cho Trung tâm cấp cứu 115 hoặc đến trạm\nY tế địa phương gần nhất.**\n**\nLàm gì khi quên 1 liều?**\n**\nBổ sung liều ngay khi nhớ ra. Tuy nhiên, nếu thời gian giãn cách với liều tiếp\ntheo quá ngắn thì bỏ qua liều đã quên và tiếp tục lịch dùng thuốc. Không dùng\nliều gấp đôi để bù cho liều đã bị bỏ lỡ.**\n**\nTác dụng phụ**\n**\nNếu xuất hiện triệu chứng bất thường khác, bạn nên ngưng sử dụng sản phẩm. Đồng\nthời, hãy liên lạc với bác sĩ để được hỗ trợ.**\n**\nHướng dẫn cách xử trí ADR**\n**\nThông báo ngay cho bác sĩ hoặc dược sĩ những phản ứng có hại gặp phải khi sử dụng.**\n\n**Lưu ý**\n\n**Trước khi sử dụng thuốc\nbạn cần đọc kỹ hướng dẫn sử dụng và tham khảo thông tin bên dưới.**\n**\nChống chỉ định**\n**\nMẫn cảm với một trong các thành phần của thuốc.**\n**\nThận trọng khi sử dụng**\n**\nĐể xa tầm tay trẻ em.**\n**\nNếu cơ thể mẫn cảm với Dầu gió xanh Thiên Thảo, hãy lập tức ngưng sử dụng và hỏi\ný kiến của thầy thuốc.**\n**\nKhả năng lái xe và vận hành máy móc**\n**\nChưa có báo cáo.**\n**\nThời kỳ mang thai**\n**\nChưa có báo cáo.**\n**\nThời kỳ cho con bú**\n**\nChưa có báo cáo.**\n**\nTương tác thuốc**\n**\nChưa có báo cáo.**\n\n**Thành phần**\n\n**Thông tin thành phần:** \n**\nMenthol 2.52g**\n**\nĐinh hương 0.24ml**\n**\nLong não 0.36ml**\n**\nMethyl salicylate 2.16g**\n**\nEucalytol 0.72ml**\n\n**Bảo quản**\n\n**Bảo quản nơi khô ráo,\ntránh ánh sáng, nhiệt độ dưới 30oC.\n**\n\n**Giá: 29.000**","en":null,"ru":null,"zh":null},{"id":"54","name":"Dầu gió Trường Sơn 6ml","price":20000,"raw_vi":"**54.** **Dầu gió Trường Sơn 6ml**\n\n**Công dụng**\n\n**Chỉ định**\n**\nDầu nóng Trường Sơn được chỉ định dùng trong các trường hợp: Cảm, ho, số mũi,\ntrúng gió, nhức đầu, say đi tàu xe, xoa bóp chống viêm cảm, muỗi chích, kiến cắn,\nbuồn nôn, đau bụng, nhức mỏi tay chân, đau khớp, trật gân.**\n**\n**\n**\nDược lực học**\n**\nChưa có thông tin.**\n**\n**\n**\nDược động học**\n**\nChưa có thông tin.**\n**\n**\n**\n**\n\n**Cách dùng**\n\n**Dùng ngoài da.**\n**\nThoa dầu và xoa bóp chỗ đau.**\n**\nPha với nước ấm để xông, thoa bôi lên mũi để hít và ngửi..**\n**\n**\n**\nLiều dùng**\n**\nXoa bóp nhiều lần trong ngày.**\n**\n**\n**\nLưu ý: Liều dùng trên chỉ mang tính chất tham khảo. Liều dùng cụ thể tùy thuộc\nvào thể trạng và mức độ diễn tiến của bệnh. Để có liều dùng phù hợp, bạn cần\ntham khảo ý kiến bác sĩ hoặc chuyên viên y tế.**\n**\nLàm gì khi dùng quá liều?**\n**\nChưa có thông tin.**\n**\n**\n**\nLàm gì khi quên 1 liều?**\n**\nThuốc dùng khi cần nên trường hợp dùng quên liều gần như không xảy ra.**\n**\n**\n**\n**\n\n**Tác dụng phụ**\n\n**Khi sử dụng Dầu nóng\nTrường Sơn, bạn có thể gặp các tác dụng không mong muốn (ADR).**\n**\n**\n**\nThường gặp, ADR >1/100**\n**\nChưa có báo cáo**\n**\n**\n**\nÍt gặp, 1/1000 < ADR < 1/100**\n**\nChưa có báo cáo.**\n**\n**\n**\nHướng dẫn cách xử trí ADR:**\n**\nNếu cơ thể mẫn cảm với Dầu Trường Sơn, hãy lập tức ngưng sử dụng và hỏi ý kiến\ncủa thầy thuốc.**\n**\n**\n**\n**\n\n**Lưu ý**\n\n**Trước khi sử dụng thuốc\nbạn cần đọc kỹ hướng dẫn sử dụng và tham khảo thông tin bên dưới.**\n**\n**\n**\nChống chỉ định**\n**\nDầu nóng Trường Sơn chống chỉ định dùng cho trẻ em dưới 3 tuổi.**\n**\n**\n**\nThận trọng khi sử dụng**\n**\nPhụ nữ có thai và phụ nữ cho con bú.**\n**\n**\n**\nKhả năng lái xe và vận hành máy móc**\n**\nChưa có báo cáo.**\n**\n**\n**\nThời kỳ mang thai và cho con bú**\n**\nThời kỳ mang thai**\n**\n**\n**\nCần thận trọng khi sử dụng.**\n**\n**\n**\nThời kỳ cho con bú**\n**\n**\n**\nCần thận trọng khi sử dụng.**\n**\nTương tác thuốc**\n**\nChưa có báo cáo.**\n**\nThành phần**\n\n**Menthol................................22**\n**\nBạc hà................................3**\n**\nĐinh hương................................0.2**\n**\nLong não...............................18**\n**\nEucalytol................................0.8**\n\n**Bảo quản**\n\n**Để nơi mát, tránh ánh\nsáng, nhiệt độ dưới 30⁰C.**\n\n**Giá:20.000**","en":null,"ru":null,"zh":null},{"id":"55","name":"Dầu Phật Linh Trường Sơn 1.5ml","price":15000,"raw_vi":"**55.** **Dầu Phật Linh Trường Sơn 1.5ml**\n\n**Công dụng**\n\n**Chỉ định**\n**\nDầu Phật Linh 1,5ml được chỉ định dùng trong các trường hợp sau:**\n**\n**\n**\n**\n\n- **Chuyên trị các bệnh: Cảm, ho, sổ mũi, nhức đầu,      say nắng, trúng gió, say tàu xe, buồn nôn, đau bụng, sưng viêm, nhức mỏi,      muỗi chích, kiến cắn, tê thấp tay chân.**\n- **Có tác dụng làm tan máu tụ, giảm đau trong, bong      gân và phong tê thấp.**\n\n**Dược lực học**\n**\n**\n**\n**\n\n- **Chưa có báo cáo về dược lực học của Dầu      Gió Phật Linh Trường Sơn.**\n\n**Dược động học**\n**\n**\n**\n**\n\n- **Chưa có báo cáo về dược động học của Dầu      Gió Phật Linh Trường Sơn.**\n\n**Cách dùng**\n\n- **Dầu Phật Linh 1,5ml chỉ khuyên dùng ngoài da,      thoa và bóp nhẹ lên chỗ đau, nên rửa sạch và lau khô vùng da bị đau trước      khi bôi dầu.**\n\n**Liều dùng**\n**\n**\n**\n**\n\n- **Dầu Phật Linh 1,5ml có thể sử dụng nhiều lần      trong ngày. Bạn nên dùng thuốc theo chỉ định của bác sĩ và kiểm tra kỹ      thông tin trên nhãn để được hướng dẫn cụ thể. Đặc biệt, không nên sử dụng      với liều lượng quá thấp, cao hoặc tự ý kéo dài so với thời gian bác sĩ đã      chỉ định.**\n\n**Làm gì khi dùng quá liều?**\n**\n**\n**\n**\n\n- **Tới nay chưa có báo cáo gì về quá liều. Trong      trường hợp dùng quá liều nghiêm trọng (do cố ý hoặc vô ý) cần điều trị triệu      chứng.**\n\n**Làm gì khi quên 1 liều?**\n**\n**\n**\n**\n\n- **Thuốc dùng khi cần nên trường hợp quên liều hầu      như không xảy ra.**\n\n**Tác dụng phụ**\n\n- **Chưa được xác định chắc chắn, hãy hỏi ý kiến của .\n\n·        \n**CHỐNG CHỈ ĐỊNH**\n\nBệnh nhân có tiền sử hoặc có nguy cơ bị sung huyết da, gây kích ứng với các thành phần của thuốc nên thận trong khi dùng.\n\n·        \n**THẬN TRỌNG**\n\nChỉ dùng ngoài. Để xa tầm tay trẻ em. Không dùng cho trẻ em dưới 3 tuổi. Phụ nữ có thai, đang cho con bú, trẻ em và những người nhạy cảm với Salicylic cần tư vấn trước khi sử dụng. Đối với trẻ em bị cảm lạnh, bị sốt do bệnh thủy đậu tránh không sử dụng các sản phẩm có chứa chất methyl salicylate.\n\n·        \n**PHỤ NỮ CÓ THAI VÀ ĐANG CHO CON BÚ**\n\nĐối với phụ nữ có thai và đang cho con bú cần tư vấn bác sỹ trước khi sử dụng.\n\n·        \n**TÁC ĐỘNG CỦA THUỐC LÊN KHẢ NĂNG LÁI XE VÀ VẬN HÀNH MÁY MÓC.**\n\nThuốc không ảnh hưởng đến khả năng lái xe và vận hành máy móc.\n\n·        \n**TÁC DỤNG KHÔNG MONG MUỐN CỦA THUỐC**\n\nThuốc có thể gây phản ứng dị ứng ở một vài trường hợp da nhạy cảm, nên bôi lên một vùng nhỏ trên da để thử trước. Nếu bị kích ứng nên ngừng dùng thuốc ngay và hỏi ý kiến bác sĩ.\n\nThông báo cho bác sĩ những tác dụng không mong muốn gặp phải khi sử dụng.\n\n·        \n**HẠN DÙNG**\n\n60 tháng kể từ ngày sản xuất.\n\n·        \n**BẢO QUẢN**\n\nBảo quản nơi khô mát, không quá 30oC\n\nĐọc kĩ hướng dẫn sử dụng trước khi dùng. Nếu cần thêm thông tin, xin hỏi ý kiến bác sĩ.\n\n·        \n**TIÊU CHUẨN CHẤT LƯỢNG**: Tiêu chuẩn cơ sở.\n\n·        \n**NHÀ SẢN XUẤT**\n\nHAW PAR HEALTHCARE LIMITED 2 Chia Ping Road, Haw Par Tiger Balm Building,\nSingapore 619968\n\nSố Đăng Ký Lưu Hành: Tiger Balm Oil*:* VN-19180-15\n\n·        \n**Giá: 120.000**","en":null,"ru":null,"zh":null},{"id":"60","name":"Dầu Cu Là Thiên Thảo 30g","price":50000,"raw_vi":"- **60.      Dầu Cu Là Thiên Thảo 30g**\n\n·        \n**Công dụng Dầu\nCù Là Phong Thấp Chỉ Thống Cao Thiên Thảo Trường Sơn giảm đau thần kinh tọa,\nphong thấp, đau khớp **\n\n·        \nHỗ trợ trong các trường hợp đau\nthần kinh tọa, phong thấp, đau khớp, tê thấp tay chân, nhức mỏi cơ bắp, đau\nnhức do lao động hoặc chơi thể thao g nhà vệ sinh, phòng tắm …**\n\n**Tạo bọt trên tay hoặc\nbằng túi tạo bọt xà bông rồi xoa lên da trong 3-5 phút. Sau đó tắm rửa lại bằng\nnước sạch và lau khô cơ thể.**\n\n**4. Lưu ý:** \n\n**-Màu sắc của sản phẩm\ncó thể đậm hơn hoặc nhạt hơn một chút xíu do quá trình làm xà bông hoàn toàn thủ\ncông, nhưng chất lượng luôn được đảm bảo tốt nhất.** \n\n**-Bảo quản: Để nơi khô\nráo, thoáng mát. Tránh ánh nắng trực tiếp.** \n\n**-Để xa tầm tay trẻ em.\nTránh tiếp xúc với mắt, nếu sản phẩm dính vào mắt, hãy rửa kỹ với nước.**\n\n** Giá\n60.000**","en":null,"ru":null,"zh":null},{"id":"70","name":"Xà bông hữu cơ sả chanh 135g","price":60000,"raw_vi":"**70.** **Xà bông\nhữu cơ sả chanh 135g**\n\n**Xà bông hữu cơ sả\nchanh, giảm mùi hôi cơ thể, làm sạch nan lông, chống viêm da, dị ứng da 135gr**\n\n**Xà bông hữu cơ từ tinh\nchất thảo mộc.**\n\n**GIẢM KHUẨN GÂY MỤN\nVIÊM, GIẢM RÔM SẢY**\n\n**CHỮA HĂM, GIẢM VIÊM\nDA DO DỊ ỨNG**\n\n**1. Thành phần: Dầu dừa,\ndầu oliu, tinh chất trầu không, bột than tre hoạt tính, tinh chất nghệ, gừng,\nvitamin B5, glycerin, nước cất, natri hydroxide, tinh dầu cam, hoa bưởi.**\n\n**Xà bông hữu cơ sả\nchanh 135g với thành phần đặc biệt là bột nghệ và tinh dầu sả chanh, bánh xà\nbông có màu vàng tự nhiên và mùi hương thơm mát dễ chịu. Ngoài tính chất làm sạch\nchung của xà bông thảo dược (làm sạch các chất bẩn, diệt khuẩn), xà bông sả\nchanh còn giúp bảo vệ bạn khỏi các loại côn trùng như muỗi, ruồi, bọ chét và\nlàm mát da hiệu quả, đặc biệt thích hợp sử dụng trong mùa hè. Hương thơm của sả\nchanh cũng giúp tâm trí tỉnh táo hơn, đánh thức trí não và giải toả căng thẳng\nsau khi tắm xong.**\n\n**2. Công dụng: Làm sạch\nda khỏi bụi bẩn, chất ô nhiễm môi trường, bã nhờn, mồ hôi, vẩy tế bào da chết,\ngiảm vi khuẩn như mụn viêm, rôm sảy, khử trùng, chữa hăm, viêm da, dị ứng da\nrất tốt.**\n\n**3. Hướng dẫn sử dụng:** \n\n**Dùng để tắm toàn thân,\nrửa tay, rửa mặt, tạo hương thơm trong nhà vệ sinh, phòng tắm …**\n\n**Tạo bọt trên tay hoặc\nbằ n phẩm chăm sóc da phổ biến, được chiết xuất từ cây lô hội (nha đam),\nmang lại nhiều lợi ích cho làn da nhờ thành phần giàu vitamin, khoáng chất và\ncác hợp chất tự nhiên. Dưới đây là mô tả chi tiết về sản phẩm:**\n\n**Công dụng chính:**\n\n**- Dưỡng ẩm: Gel nha\nđam có khả năng cấp ẩm sâu, giúp làm mềm và giữ ẩm cho da mà không gây nhờn\nrít.**\n\n**- Làm dịu da: Làm giảm\nkích ứng, mẩn đỏ và bỏng rát do cháy nắng hoặc da bị tổn thương.**\n\n**- Làm sáng da: Các dưỡng\nchất trong gel nha đam giúp làm đều màu da, cải thiện làn da xỉn màu và tăng độ\nsáng tự nhiên.**\n\n**- Chống viêm và kháng\nkhuẩn: Hỗ trợ điều trị mụn, giảm sưng viêm và ngăn ngừa vi khuẩn gây hại trên\nda.**\n\n**- Tái tạo tế bào da:\nKích thích quá trình tái tạo tế bào mới, giúp làm mờ vết thâm, sẹo và cải thiện\nkết cấu da.**\n\n**- Chống lão hóa: Giàu\nchất chống oxy hóa, giúp làm chậm quá trình lão hóa, giảm nếp nhăn và duy trì\nlàn da tươi trẻ.**\n\n**Cách sử dụng:**\n\n**1.Làm sạch da bằng sữa\nrửa mặt hoặc nước ấm.**\n\n**2.Lấy một lượng gel vừa\nđủ thoa đều lên da mặt hoặc cơ thể.**\n\n**3.Massage nhẹ nhàng\ntheo chuyển động tròn để gel thẩm thấu sâu vào da.**\n\n**4.Sử dụng 2 lần/ngày\n(sáng và tối) để đạt hiệu quả tốt nhất.**\n\n**5.Có thể dùng như mặt\nnạ ngủ hoặc kem dưỡng ẩm trước khi trang điểm.**\n\n**Gel nha đam dưỡng da\nlà một sản phẩm chăm sóc da đa năng, phù hợp với mọi loại da và mang lại nhiều\nlợi ích như dưỡng ẩm, làm dịu, làm sáng và chống lão hóa. Với thành phần tự\nnhiên từ nha đam, sản phẩm này không chỉ an toàn mà còn hiệu quả trong việc\nnuôi dưỡng làn da khỏe mạnh và tươi trẻ. Đây là lựa chọn lý tưởng cho những ai\nđang tìm kiếm một giải pháp chăm sóc da đơn giản nhưng hiệu quả.**\n","en":null,"ru":null,"zh":null},{"id":"81","name":"Gel nha đam dưỡng da cấp ẩm và làm dịu da FORY 150ML","price":60000,"raw_vi":"**81. Gel nha đam dưỡng da cấp ẩm và làm dịu\nda FORY 150ML**\n\n**el nha đam dưỡng da là\nmột sản phẩm chăm sóc da phổ biến, được chiết xuất từ cây lô hội (nh akao 400ml","price":150000,"raw_vi":"93\\. Dầu gội Chanh Sả Bạc Hà Thorakao 400ml\n\n**Dầu gội Chanh Sả Bạc\nHà Thorakao **– ngăn ngừa rụng\ntóc, giúp da đầu thông thoáng ngăn ngừa gàu trên da đầu.\n\nCông dụng dầu gội Chanh Sả\nBạc Hà:\n\n- Chiết xuất Chanh – Sả làm dịu da đầu, bảo vệ      chân tóc chắc, giảm thiểu rụng tóc.\n- Chiết xuất Bạc Hà giúp da đầu thông thoáng,      ngăn ngừa gàu trên da đầu.\n- Ngăn ngừa rụng tóc, cải thiện cho tóc yếu dễ      gãy rụng.\n\nThành phần dầu gội:\n\n- Aqua, Sodium laureth sulfate, Cocamidopropyl      betaine, Acrylates copolymer, Sodium lactate, Glycerin, Dimethicone,      Epilobium angustifolium flower/leaf/stem extract, Fragrance, Laureth-6,      Polyquaternium-58, Peg-40 hydrogenated castor oil, Hydrolyzed wheat protein,      Citric acid, Amodimethicone, Menthol, Methyl lactate, Disodium EDTA,      Laureth-23, Laureth-4, Polyquaternium-10, Propylene glycol, Citrus c.      Limon-peel extract, Cymbopogon citratus extract, Sodium hydroxide,      Bronopol, Phenoxyethanol, Sodium metabisulfite, Potassium sorbate, Sodium      benzoate, CI 19140, CI 42090.\n\nHướng dẫn sử dụng dầu\ngội Chanh Sả và Bạc Hà [Thorakao](https://thorakaocaugiay.com/)\n\n- Làm ướt tóc, lắc đều và lấy một lượng dầu      gội vừa đủ thoa lên tóc, mát-xa nhẹ nhàng trên da đầu, xả lại kỹ bằng nước      sạch\n","en":null,"ru":null,"zh":null},{"id":"94","name":"Dầu gội cao bồ kết Thorakao 250ml","price":55000,"raw_vi":"94\\. Dầu gội cao bồ kết Thorakao 250ml\n\n**Dầu gội cao bồ kết\nThorakao 250ml** – Với tinh dầu\nbồ kết được bổ sung sẽ giúp bạn luôn tự tin khi ra đường với tóc luôn khỏe đẹp,\nóng mượt mỗi ngày.\n\nY học cổ truyền Việt Nam\ntừng sử dụng chất SAPONIN có trong trái bồ kết để giúp cho tóc được bóng mượt,\nsạch gàu, đen tóc đồng thời kích thích tốt đến sự tăng trưởng của chân tóc.\n\nCông dụng cao bồ kết\nThorakao:\n\n***Dầu gội cao bồ kết\nThorakao 250ml*** đã kết hợp\nnhững công thức tiên tiến từ trái bồ kết thiên nhiên:\n\n- Giúp tóc mềm mượt ospermum parkii butter, Glyceryl stearate, Ceteareth-20,      Ceteareth-12, Fragrance, Propylene glycol, 5-bromo-5-nitro-1,3-dioxane.\n- Xem chi tiết trên bao bì sản phẩm.\n\nHướng dẫn sử dụng Kem\nthoa tay Thorakao:\n\n- Dùng kem thoa nhẹ, đều khắp da tay, cánh tay      để được bảo vệ một cách hữu hiệu\n","en":null,"ru":null,"zh":null},{"id":"97","name":"Serum giảm thâm quầng mắt Thorakao 10g","price":240000,"raw_vi":"97\\. Serum giảm thâm quầng mắt Thorakao 10g\n\n**Serum giảm thâm quầng\nmắt thorakao 10g** – Tự\ntin với đôi mắt thêm đẹp.\n\nVùng quanh mắt rất nhạy cảm\nvới tác động của môi trường như tia cực tím, khói bụi và căng thẳng. Serum\ngiảm thâm quầng mắt Thorakao với sự kết hợp chiết xuất từ: hoa Thiên Điểu, hoa\nCơm Cháy bổ sung thêm️ vitamin A thúc đẩy quá trình tái tạo tế bào và sinh\nsản collagen giúp cấu trúc da bền vững.Hơn nữa sản phẩm kích thích lưu thông\nmáu nuôi dưỡng vùng da mắt, giảm thâm quầng mắt, sưng bụp mí mắt và giảm nếp\nnhăn ở đuôi mắt\n\nSerum giảm thâm quầng mắt sẽ đem lại cho bạn sức sống tươi trẻ với đôi mắt rạng\nngời\n\nCông dụng Serum giảm thâm\nquầng mắt Thorakao 10g:\n\n- Giảm thâm quầng mắt.\n- Làm giảm bọng mỡ, sưng hút ở dưới mắt.\n- Làm mờ các đốm nâu, cải thiện tông màu da      vùng mắt.\n- Nuôi dưỡng và tăng cường collagen tự nhiên      cho da.\n- Giúp da săn chắc, giảm nếp nhăn đuôi mắt.\n\nThành phần Serum giảm\nthâm quầng mắt:\n\n- Aqua, Sodium acrylates copolymer, Macadamia      integrifolia seed oil, Phaseolus radiatus seed extract, Propanediol,      Lecithin, Fragrance, Retinyl palmitate, Strelitzia nicolai seed aril      extract, Butylene glycol, Glycine soja oil, Persea gratissima oil, Simmondsia      chinensis seed extract, Glycerin, Pentylene glycol, Sambucus nigra flower      extract, Trehalose, Cryptomeria japonica leaf extract, 1,2-hexanediol,      Beta-glucan, Bisabolol, Caprylyl glycol, Hordeum vulgare seed extract,      Sodium hyaluronate, Calendula officinalis extract, Chamomilla recutita      extract, Fucus vesiculosus extract, Triticum vulgare bran extract,      Ethylhexylglycerin, Chlorphenesin, Benzyl alcohol, Phenoxyethanol,      Salicylic acid, Sorbic acid.\n\nHướng dẫn sử dụng Serum\ngiảm thâm quầng mắt Thorakao 10g:\n\nSau khi rửa mặt sạch, nhẹ\nnhàng thoa vào bên dưới vùng mắt. Sử dụng ngày 2 lần buổi sáng và buổi tối.\n\nLưu ý: sản phẩm không\nthích hợp cho phụ nữ mang thai và cho con bú.\n\nNhanh tay đặt hàng và trải nghiệm làn da tuyệt vời mà sản phẩm mang lại nhé!\n","en":null,"ru":null,"zh":null},{"id":"98","name":"Serum dưỡng tóc Thorakao 75ml","price":370000,"raw_vi":"98\\. Serum dưỡng tóc Thorakao 75ml\n\n**Serum dưỡng tóc\nThorakao 75ml**– Sự kết hợp hoàn hảo\nTinh dầu Dừa với tinh dầu Bưởi và Dầu Olive\n\nTừ xa xưa người Việt Nam\nđã biết sử dụng Tinh Dầu Dừa như là một loại dưỡng chất thiên nhiên giúp tóc mềm\nmại theo thời gian. Ngày nay trên toàn thế giới cũng đã sử dụng Tinh Dầu Dừa để\nlàm các sản phẩm chăm sóc cho tóc và da. THORAKAO đã ứng dụng đặc tính tuyệt vời\nnày của Tinh Dầu Dừa và có sự sáng tạo, kết hợp với Tinh Dầu Bưởi và Dầu Olive\nđể giúp nuôi dưỡng tận gốc chân tóc làm tóc dễ dàng mọc trở lại, giảm rụng tóc,\ngiúp bạn có mái tóc óng mượt tươi trẻ tự nhiên.\n\nCông dụng Serum dưỡng\ntóc Thorakao\n\n- Giảm rụng tóc, giúp tóc mọc lại.\n- Nuôi dưỡng tóc từ gốc tới ngọn giúp tóc luôn      chắc khỏe suôn mượt.\n- Nuôi dưỡng phục hồi tóc.\n\nThành phần Serum [Thorakao](https://thorakaocaugiay.com/)\n\n- Cyclotetrasiloxane, Cocos nucifera fruit      extract, Citrus maxima rutaceae – peel extract, Citrus sinensis rutaceae –      peel extract, Dimethicone, Olea europaea fruit oil, Helianthus annuus seed      oil, Menthol, Cyclopentasiloxane.\n- Xem chi tiết trên bao bì sản phẩm.\n\nHướng dẫn sử dụng Serum\ndưỡng tóc Thorakao\n\n- Lắc đều dung dịch trong chai trước khi sử dụng.\n- Ấn van xịt đều lên tóc.\n- Sau đó, dùng tay massage nhẹ da đầu từ 3 – 5      phút để tạo điều kiện thuận lợi cho các hoạt chất hoạt động hữu hiệu.\n- Nên sử dụng hằng ngày để thấy hiệu quả tốt nhất.\n","en":null,"ru":null,"zh":null},{"id":"99","name":"Dầu gội hoa bưởi Thorakao 400ml","price":120000,"raw_vi":"99\\. Dầu gội hoa bưởi Thorakao 400ml\n\n**Dầu gội hoa bưởi\nThorakao 400ml **– Có đặc tính\nchống oxy hóa và làm sạch. Tuyệt vời cho da đầu nhờn, thúc đẩy sự phát triển\ntóc khỏe mạnh, và cũng có thể giúp làm giảm tình trạng da đầu ngứa.\n\nDầu gội đầu **hoa\nbưởi** THORAKAO được kết hợp từ tinh dầu hoa và vỏ bưởi. Đây là một\nphương pháp điều chế theo cổ truyền rất độc đáo tại Việt Nam. Dầu bưởi THORAKAO\nlàm tóc mềm mại óng mượt, làm đỡ khô da dầu, làm da đầu mềm mại mịn màng. Đặc\nbiệt nếu tóc bị rụng, tinh dầu bưởi có tác dụng thấm sâu vào da đầu, nuôi dưỡng\ntóc chắc khỏe tự nhiên. Với những đặc chế độc đáo từ dầu gội hoa bưởi THORAKAO\nsẽ giúp bạn có mái tóc như ý.\n\nVới hương thơm dịu mát rất\nphù hợp với thời tiết mùa hè oi bức như hiện nay ạ. Cùng với tác dụng kích\nthích mọc tóc, làm sạch da đầu mà đa số những anh chị em tóc mỏng đang khẩn thiết\ncải thiện mái tóc.\n\nCông dụng:\n\n- Làm sạch da đầu\n- Ngăn ngừa rụng tóc hiệu quả\n- Đem lại cho bạn mái tóc dày và óng mượt\n- Độ PH cân bằng, thích hợp cho mọi loại tóc.\n- Ngăn ngừa gàu hữu hiệu, do đó bạn sẽ không cảm      thấy khó chịu ngứa vì gàu.\n\nThành phần dầu gội bưởi\nThorakao\n\n- Xem chi tiết trên bao bì sản phẩm\n\nHướng dẫn sử dụng Dầu\ngội hoa bưởi Thorakao\n\n- Làm ướt tóc, cho một lượng dầu gội vừa đủ      thoa lên tóc, mát-xa nhẹ nhàng trên da đầu, xả lại kỹ bằng nước sạch.\n- Dầu gội kết hợp xả trong cùng 1 chai giúp tóc      mềm mượt hơn và không cần dùng đến dầu xả ngoài.\n","en":null,"ru":null,"zh":null},{"id":"100","name":"Kem Thâm Nám Thorakao Từ Ốc Sên 30gr","price":310000,"raw_vi":"100\\. **Kem Thâm Nám Thorakao Từ Ốc Sên 30gr**\n\n**Kem Hỗ Trợ Giảm\nThâm Nám Thorakao Từ Ốc Sên 30gr**\n\n**Tình trạng nám da, sạm\nmàu hay tàn nhang là vấn đề phổ biến khi da chịu ảnh hưởng từ ánh nắng, tuổi\ntác hoặc nội tiết tố. [Kem\nNám](https://www.guardian.com.vn/cham-soc-da-mat/kem-gel-xit-duong-da/kem-duong-sang-mo-tham.html) Ốc Sên [Thorakao ](https://www.guardian.com.vn/shopby/thorakao.html)được\nkết hợp từ dịch nhầy ốc sên và tinh chất thảo dược thiên nhiên, mang lại hiệu\nquả rõ rệt:**\n\n**– Làm sạch tế bào chết\nvà ngăn ngừa sự hình thành sắc tố melanin.**\n\n**– Mờ nám, mờ đốm nâu,\ntàn nhang và thâm do mụn để lại.**\n\n**– Dưỡng da sáng đều\nmàu, tăng cường độ ẩm.**\n\n**– Giúp da mềm mại, giảm\nlão hóa và phục hồi làn da yếu.**\n\n**CÔNG DỤNG CHÍNH:**\n\n**– Làm sạch tế bào chết\nvà ngăn ngừa sự hình thành sắc tố melanin.**\n\n**– Mờ nám, mờ đốm nâu,\ntàn nhang và thâm do mụn để lại.**\n\n**– Dưỡng da sáng đều\nmàu, tăng cường độ ẩm.**\n\n**– Giúp da mềm mại, giảm\nlão hóa và phục hồi làn da yếu.**\n\n**THÀNH PHẦN:**\n\n**Chiết xuất Dịch nhầy Ốc\nSên (Snail Secretion Filtrate): Giàu enzyme và acid glycolic – giúp tái tạo\nda, dưỡng ẩm sâu, thúc đẩy làm lành vết thâm nám và sẹo. Phối hợp cùng tinh chất\nthảo dược giúp tăng cường hiệu quả trị nám và làm đều màu da.**\n\n[**Giới\nThiệu**](https://www.guardian.com.vn/kem-ho-tro-giam-tham-nam-thorakao-tu-oc-sen-30gr.html?srsltid=AU7gw4Up5HzSiL2b0aaLUmBIn8HXslAEVaB5N97rZ7ekzAnzw-JZFvqbDP4#description)\n\n[**Công\nDụng**](https://www.guardian.com.vn/kem-ho-tro-giam-tham-nam-thorakao-tu-oc-sen-30gr.html?srsltid=AU7gw4Up5HzSiL2b0aaLUmBIn8HXslAEVaB5N97rZ7ekzAnzw-JZFvqbDP4#product.info.uses)\n\n[**Thành\nPhần**](https://www.guardian.com.vn/kem-ho-tro-giam-tham-nam-thorakao-tu-oc-sen-30gr.html?srsltid=AU7gw4Up5HzSiL2b0aaLUmBIn8HXslAEVaB5N97rZ7ekzAnzw-JZFvqbDP4#product.info.ingredient)\n\n[**Hướng\nDẫn Sử Dụng**](https://www.guardian.com.vn/kem-ho-tro-giam-tham-nam-thorakao-tu-oc-sen-30gr.html?srsltid=AU7gw4Up5HzSiL2b0aaLUmBIn8HXslAEVaB5N97rZ7ekzAnzw-JZFvqbDP4#product.info.instruction)\n\n**CÁCH DÙNG:**\n\n**Rửa mặt sạch và lau\nkhô. Lấy một lượng kem vừa đủ, chấm lên vùng nám hoặc thâm, tán nhẹ đều khắp mặt.\nSử dụng đều đặn sáng và tối mỗi ngày để đạt hiệ function esc(s){return String(s??'').replace(/[&<>\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function inline(s){
  let x=esc(s);
  x=x.replaceAll('\\','');
  x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  x=x.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return x;
}
function blockHtml(lines){
  const clean=lines.map(x=>x.trim()).filter(Boolean);
  if(!clean.length)return '';
  const isList=clean.every(x=>/^[-·]\\s+/.test(x));
  if(isList){
    return '<ul>'+clean.map(x=>'<li>'+inline(x.replace(/^[-·]\\s+/,''))+'</li>').join('')+'</ul>';
  }
  const isNumbered=clean.some(x=>/^\\d+[.)]\\s+/.test(x));
  if(isNumbered){
    return clean.map(x=>{
      const m=x.match(/^(\\d+[.)])\\s+(.*)$/);
      if(m)return '<div class="detail-line numbered"><span class="line-no">'+inline(m[1])+'</span><span>'+inline(m[2])+'</span></div>';
      return '<div class="detail-line">'+inline(x)+'</div>';
    }).join('');
  }
  return clean.map(x=>'<div class="detail-line">'+inline(x)+'</div>').join('');
}
function detailSections(raw){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const sections=[]; let title='Overview'; let body=[];
  const push=()=>{if(body.some(x=>x.trim()))sections.push({title,body:body.slice()});body=[];};
  for(const line of lines){
    const t=line.trim();
    if(!t){if(body.length && body[body.length-1]!=='') body.push('');continue;}
    const h=t.match(/^#{2,4}\s+(.+)$/);
    const boldOnly=t.match(/^[-·]?\s*\*\*([^*]+)\*\*\s*$/);
    const label=t.match(/^\*\*([^*]+):\*\*\s*$/);
    const bt=boldOnly?.[1]?.trim()||'';
    const boldHeading=!!boldOnly && !bt.includes(':') && (bt.length<=60 || /^[A-ZÀ-Ỹ\s0-9&+–—-]+$/.test(bt));
    if(h||label||boldHeading){
      push(); title=(h?h[1]:label?label[1]:bt).replace(/:$/,''); continue;
    }
    body.push(t);
  }
  push();
  return sections.filter(s=>s.body.some(x=>x.trim()));
}
function renderSections(raw){
  const sections=detailSections(raw);
  const intro='<div class="reading-intro"><div class="reading-mark">i</div><div><strong>PRODUCT DETAILS</strong><span>Information is organized into clear sections for quick international reading.</span></div></div>';
  const cards=sections.map((sec,i)=>{
    const groups=[];let cur=[];
    sec.body.forEach(line=>{if(!line.trim()){if(cur.length){groups.push(cur);cur=[]}}else cur.push(line)});
    if(cur.length)groups.push(cur);
    return '<article class="detail-card'+(i===0?' accent':'')+'"><h2><span class="section-no">'+String(i+1).padStart(2,'0')+'</span>'+inline(sec.title)+'</h2>'+groups.map(blockHtml).join('')+'</article>';
  }).join('');
  return intro+'<div class="detail-grid">'+cards+'</div>';
}
function getDetailRaw(){
  return product?.raw_vi?.replace(/^\s*[-·]?\s*\*?\*?Giá\s*:.*$/gmi,'').replace(/\n{3,}/g,'\n\n')||null;
}
let translationsReady=false,translationsPromise=null;
function loadTranslations(){
  if(translationsPromise)return translationsPromise;
  const sources=[
    'translations-19-61.json',
    'translations-62-70-full-complete.json',
    'translations-71-79-complete.json',
    'translations-80-88-complete.json',
    'translations-89-97-complete.json',
    'translations-98-106-complete.json',
    'translations-107-112-complete.json'
  ];
  translationsPromise=Promise.all(
    sources.map(src=>fetch(src,{cache:'no-store'}).then(r=>r.ok?r.json():({products:{}})).catch(()=>({products:{}})))
  ).then(all=>{
    const merged={products:{}};
    all.forEach(t=>Object.assign(merged.products,t.products||{}));
    Object.entries(merged.products||{}).forEach(([id,v])=>{
      const p=DATA.products.find(x=>x.id===id.padStart(2,'0'));
      if(p){p.en=v.en?.body||null;p.ru=v.ru?.body||null;p.zh=v.zh?.body||null;}
    });
    translationsReady=true;
  }).catch(()=>{translationsReady=true;});
  return translationsPromise;
}
function getProductId(){const q=new URLSearchParams(location.search).get('product');return(q||'').replace(/\\D/g,'').padStart(2,'0')}
function init(){
  const id=getProductId();
  product=DATA.products.find(p=>p.id===id);
  if(!product){
    document.getElementById('title').textContent='Không tìm thấy sản phẩm';
    document.getElementById('choices').innerHTML='<div class="error">Mã sản phẩm không hợp lệ.</div>';
    return;
  }
  document.getElementById('productCode').textContent='SP · '+id.replace(/^0+/,'');
  document.getElementById('placeholderCode').textContent='SP '+id.replace(/^0+/,'');
  document.getElementById('title').textContent=product.name;
  const image=document.getElementById('productImage'), ph=document.getElementById('productPlaceholder');
  if(images[id]){
    image.src=images[id];image.alt=product.name+' · Ảnh sản phẩm';image.classList.remove('hidden');ph.classList.add('hidden');if(!document.getElementById('imageNote')){const n=document.createElement('div');n.id='imageNote';n.className='image-note';n.textContent='Ảnh sản phẩm';document.querySelector('.image-wrap').appendChild(n);}
  }else{
    image.classList.add('hidden');ph.classList.remove('hidden');const n=document.getElementById('imageNote');if(n)n.remove();
  }
}
async function showLanguage(k){
  const result=document.getElementById('result');
  document.getElementById('choices').classList.add('hidden');
  result.classList.remove('hidden');
  if(k!=='vi' && !translationsReady){
    result.innerHTML='<div class="selected"><span>'+ui[k].label+'</span><span>'+ui[k].sub+'</span></div><div class="error">Đang tải bản dịch…</div>';
    await loadTranslations();
  }
  if(k==='vi'){
    const raw=getDetailRaw();
    result.innerHTML=raw?'<div class="selected"><span>'+ui.vi.label+'</span><span>'+ui.vi.sub+'</span></div>'+renderSections(raw)+'<a class="back" href="javascript:location.reload()">'+ui.vi.back+'</a>':'<div class="error">Không tìm thấy nội dung tiếng Việt.</div>';
  }else{
    const raw=product?.[k];
    result.innerHTML=raw?'<div class="selected"><span>'+ui[k].label+'</span><span>'+ui[k].sub+'</span></div>'+renderSections(raw)+'<a class="back" href="javascript:location.reload()">'+ui[k].back+'</a>':'<div class="error">'+(translationsReady?'Bản dịch ngôn ngữ này chưa được cập nhật cho sản phẩm này.':'Đang tải bản dịch…')+'</div>';
  }
}
init();
loadTranslations();
</script>
