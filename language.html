function esc(s){return String(s??'').replace(/[&<>\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function md(s){let x=esc(s);x=x.replace(/^#### (.+)$/gm,'<h3>$1</h3>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>');x=x.replace(/^\\- (.+)$/gm,'<li>$1</li>').replace(/^- (.+)$/gm,'<li>$1</li>');x=x.replace(/((?:<li>[\\s\\S]*?<\\/li>\\s*)+)/g,'<ul>$1</ul>');x=x.replace(/\\*\\*(.+?)\\*\\*/g,'<strong>$1</strong>');x=x.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');x=x.replace(/\\n{2,}/g,'</p><p>').replace(/\\n/g,'<br>');return '<p>'+x+'</p>'}
