<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Thắm Shop – Product information"><title>Thắm Shop – Chọn ngôn ngữ</title><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f7f7f3;color:#17244d}main{max-width:560px;margin:0 auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.brand{text-align:center;color:#176b3a;font-weight:700;font-size:23px;margin-bottom:5px}.sub{text-align:center;color:#666;margin-bottom:12px}.product-image{display:block;width:auto;max-width:86%;height:210px;object-fit:contain;margin:4px auto 12px;border-radius:12px}.image-note{text-align:center;font-size:12px;color:#888;margin:-4px 0 12px}.title{text-align:center;font-size:21px;line-height:1.35;margin:10px 0 22px;color:#176b3a}.lang{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:16px 18px;border:1px solid #dfe7df;border-radius:14px;background:#f8fbf7;color:#173d28;text-decoration:none;font-size:18px;font-weight:700;text-align:left;cursor:pointer}.lang small{display:block;font-size:13px;font-weight:400;color:#777;margin-top:5px}.content{margin-top:18px;line-height:1.65;color:#333}.content h3{color:#176b3a;border-bottom:1px solid #eee;padding-bottom:5px}.content p{margin:10px 0}.content ul{padding-left:22px}.selected{text-align:center;color:#176b3a;font-weight:700;font-size:18px;margin:12px 0 18px}.back{display:block;text-align:center;margin-top:20px;color:#176b3a;font-weight:700;text-decoration:none}.error{text-align:center;color:#a33;padding:15px}.hidden{display:none}</style></head><body><main><div class="brand">THẮM SHOP</div><div class="sub">Product information</div><img id="productImage" class="product-image" alt="Hình ảnh sản phẩm" loading="eager"><div id="imageNote" class="image-note">Hình ảnh minh họa sản phẩm</div><div id="title" class="title">Đang tải thông tin sản phẩm…</div><div id="choices"><button class="lang" onclick="showLanguage('vi')">🇻🇳 Tiếng Việt<small>Đọc thông tin sản phẩm bằng tiếng Việt</small></button><button class="lang" onclick="showLanguage('en')">🇬🇧 English<small>Read product information in English</small></button><button class="lang" onclick="showLanguage('ru')">🇷🇺 Русский<small>Информация о продукте на русском языке</small></button><button class="lang" onclick="showLanguage('zh')">🇨🇳 中文<small>用中文阅读产品信息</small></button></div><div id="result" class="content hidden"></div></main><script>let productDoc=null;const sectionNames={vi:['🇻🇳 TIẾNG VIỆT','TIẾNG VIỆT'],en:['🇬🇧 ENGLISH','ENGLISH'],ru:['🇷🇺 РУССКИЙ','РУССКИЙ'],zh:['🇨🇳 中文','中文']};const labels={vi:'🇻🇳 Tiếng Việt',en:'🇬🇧 English',ru:'🇷🇺 Русский',zh:'🇨🇳 中文'};const productImages={'01':'https://www.lottemart.vn/media/catalog/product/cache/75x75/0/0/0079656603248-1.jpg.webp','02':'https://medias.watsons.vn/publishing/WTCVN-218425-side-zoom.jpg?version=1778085125','03':'https://cdn.taw9eel.com/media/catalog/product/cache/1/image/519x/9df78eab33525d08d6e5fb8d27136e95/m/h/mhjr1681_1.jpg','04':'https://www.guardian.com.vn/media/catalog/product/cache/30b2b44eba57cd45fd3ef9287600968e/3/0/3020168.png','05':'https://www.herbiflix.com/cdn/shop/files/71p1rp0m4YL._AC_SL1500.jpg?v=1761847295&width=1200','06':'https://favo.id/cdn/shop/files/BANTUB1012_Banana-Boat-After-Sun-Care-Aloe-Gel---90-mL.jpg?v=1772778753','07':'https://media.home.bargains/product-images/b/9/3/9/b9391251b3da3df966135f6d92ed855c4edf39a1.png?fit=cover&x=676&y=676','08':'https://i5.walmartimages.com/seo/Banana-Boat-Sport-Ultra-SPF-65-Sunscreen-Spray-6oz_909f1ffd-d0c8-47f4-8aee-afd6369b5692.0247d3f44b739b2bf27d74ea6b1460.jpeg','09':'https://www.static-src.com/wcsstore/Indraprastha/images/catalog/full/109/MTA-68439565/banana_boat_banana_boat_ultra_protect_spf50_90ml_full01_dxnk58wk.jpg','10':'https://www.static-src.com/wcsstore/Indraprastha/images/catalog/full/109/MTA-68439565/banana_boat_banana_boat_ultra_protect_spf50_90ml_full01_dxnk58wk.jpg','11':'https://f.nooncdn.com/p/pzsku/Z925D97444CF0D3CC0A67Z/45/_/1771586667/7bddb801-9520-45b9-a6a4-607b07906dd3.jpg','12':'https://down-vn.img.susercontent.com/file/vn-11134207-7r98o-luxa8c3ttmhee6','13':'https://assets.beiersdorf.com/-/media/images/8/a/9/b/9c873ab9c46f4562909404cc005503c3-web_1010x1180_transparent_png.png?ctx=in&hash=f555756b9fc53623b3b2e365d4f654b85&mw=768','14':'https://mcgrocer.com/cdn/shop/files/nivea-sun-protect-dry-touch-sun-cream-spray-spf50-200ml-41391391768814.jpg?v=1744439833','15':'https://rokbucket.rokomari.io/ProductNew20190903/260X372/Nivea_Sun_Protect_Moisture_Pump_Spray_SP-Nivea-33d8c-493293.png','16':'https://f.nooncdn.com/p/pzsku/ZAE09F60C5B37B8074399Z/45/1765750701/4dbab885-f373-419b-8b23-22fa9f4fc70b.jpg?width=800','17':'https://www.bbassets.com/media/uploads/p/l/40008021_5-nivea-sun-lotion-spf-30-with-uva-uvb-protection-water-resistant-sunscreen-for-men-women.jpg','18':'https://media.farmaciatei.ro/gallery/48266/ulei-spray-pentru-plaja-cu-spf-6-tropical-bronze-200-ml-nivea-sun-9115.jpg'};async function init(){const p=new URLSearchParams(location.search).get('product');if(!/^\d{2}$/.test(p)){document.getElementById('title').textContent='Không tìm thấy sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Mã sản phẩm không hợp lệ.</div>';document.getElementById('productImage').classList.add('hidden');document.getElementById('imageNote').classList.add('hidden');return}if(productImages[p])document.getElementById('productImage').src=productImages[p];try{const res=await fetch('./product-'+p+'.html',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const html=await res.text();productDoc=new DOMParser().parseFromString(html,'text/html');const h1=productDoc.querySelector('h1');document.getElementById('title').textContent=h1?h1.textContent:'Thông tin sản phẩm';document.getElementById('productImage').alt=h1?h1.textContent:'Hình ảnh sản phẩm';}catch(e){document.getElementById('title').textContent='Không thể tải thông tin sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Vui lòng tải lại trang và thử lại.</div>';console.error(e)}}function showLanguage(key){if(!productDoc)return;const wanted=sectionNames[key];const heads=[...productDoc.querySelectorAll('h2')];let head=heads.find(h=>wanted.includes(h.textContent.trim()));if(!head){head=heads.find(h=>wanted.some(w=>h.textContent.trim().includes(w)))}const result=document.getElementById('result');if(!head){result.innerHTML='<div class="error">Không tìm thấy nội dung ngôn ngữ này.</div>';return}const box=document.createElement('div');const selected=document.createElement('div');selected.className='selected';selected.textContent=labels[key];box.appendChild(selected);let node=head.nextElementSibling;while(node&&node.tagName!=='H2'){box.appendChild(node.cloneNode(true));node=node.nextElementSibling}result.innerHTML='';result.appendChild(box);document.getElementById('choices').classList.add('hidden');document.getElementById('title').classList.add('hidden');document.getElementById('productImage').classList.add('hidden');document.getElementById('imageNote').classList.add('hidden');result.classList.remove('hidden');const back=document.createElement('a');back.className='back';back.href='javascript:location.reload()';back.textContent='← Chọn ngôn ngữ khác';result.appendChild(back);window.scrollTo({top:0,behavior:'smooth'})}init();</script></body></html>
