<script>
const DATA={"version":"2026-10-01.4","count":112,"policy":"QR detail: exact Vietnamese source with only price line removed. Physical label price remains unchanged.","products":[{"id":"01","name":"Kem Chống Nắng Thể Thao Banana Boat SPF50 90ml","price":null,"raw_vi":"**Kem Chống Nắng Thể Thao Banana Boat SPF50 90ml**  + **Thành phần chính và công dụng:**\n\n- Kem Chống Nắng Thể Thao Banana Boat SPF50 90ml là kem chống nắng được tăng cường thành phần chống nắng với SPF 50PA++ giúp bảo vệ làn da của bạn an toàn dưới ánh nắng mặt trời.\n- Sản phẩm tạo lớp màng siêu chống nắng với công nghệ AvoTriplex, bổ sung thêm thành phần lô hội, vitamin C, E và công thức không gây nhờn giúp da được giữ ẩm và chống nắng tốt hơn.\n- Khả năng chống nắng lên đến 7 tiếng rưỡi với chỉ số SPF 50PA++, ngăn chặn 98% tia UVB gây hại cho da, giúp bạn thoải mái vận động dưới nắng mà không lo da bị sạm, nám.\n- Kem không trôi khi gặp nước, gây dị ứng, bít lỗ chân lông nên rất an toàn.\n\n**Đối tượng sử dụng:**\nKem Chống Nắng Thể Thao Banana Boat SPF50 90ml dùng được cho mọi làn da.\n\n**Hướng dẫn sử dụng:**\nThoa đều toàn thân 20 phút trước khi tắm nắng. Thoa thêm sau khi bơi và ra nắng.\n\n#### Xuất xứ\n\nThái Lan\n\n#### Cách sử dụng\n\nThoa đều toàn thân 20 phút trước khi tắm nắng. Thoa thêm sau khi bơi và ra nắng.\n\n#### Thành phần\n\nXem trên bao bì sản phẩm\n\n#### Cách bảo quản\n\nĐể sản phẩm nơi khô ráo & thoáng mát. Để xa tầm tay trẻ em.","en":"**Banana Boat Sport Sunscreen SPF50 90ml** + **Key Ingredients and Benefits:**\n\n- Banana Boat Sport Sunscreen SPF50 90ml is a sunscreen enhanced with SPF 50PA++ protection to help protect your skin safely under sunlight.\n- The product forms a highly protective sunscreen film with AvoTriplex technology, supplemented with aloe vera, vitamin C, vitamin E and a non-greasy formula to help moisturize the skin and improve sun protection.\n- Sun protection can last up to 7.5 hours with SPF 50PA++, blocking 98% of harmful UVB rays, so you can comfortably exercise in the sun without worrying about darkening or pigmentation.\n- The cream does not wash off when exposed to water, is described in the supplied source as non-allergenic and does not clog pores, making it safe to use.\n\n**Suitable for:**\nBanana Boat Sport Sunscreen SPF50 90ml is suitable for all skin types.\n\n**Directions for use:**\nApply evenly over the entire body 20 minutes before sun exposure. Reapply after swimming and sun exposure.\n\n#### Origin\n\nThailand\n\n#### How to use\n\nApply evenly over the entire body 20 minutes before sun exposure. Reapply after swimming and sun exposure.\n\n#### Ingredients\n\nSee the product packaging.\n\n#### Storage\n\nStore the product in a dry, cool and well-ventilated place. Keep out of reach of children.","ru":"**Солнцезащитный крем Banana Boat Sport SPF50, 90 мл** + **Основные ингредиенты и свойства:**\n\n- Солнцезащитный крем Banana Boat Sport SPF50 90 мл усилен солнцезащитным фактором SPF 50PA++ и помогает защищать кожу под солнечными лучами.\n- Средство образует высокоэффективный защитный слой благодаря технологии AvoTriplex, содержит алоэ вера, витамин C и витамин E, а также нежирную формулу, которая помогает увлажнять кожу и усиливать защиту от солнца.\n- Защита от солнца может длиться до 7,5 часов при SPF 50PA++; средство блокирует 98% вредных UVB-лучей, позволяя комфортно заниматься активностями на солнце без опасений по поводу потемнения и пигментации кожи.\n- Согласно предоставленному источнику, крем не смывается при контакте с водой, не вызывает аллергии и не закупоривает поры.\n\n**Для кого подходит:**\nСолнцезащитный крем Banana Boat Sport SPF50 90 мл подходит для всех типов кожи.\n\n**Способ применения:**\nРавномерно нанесите на всё тело за 20 минут до пребывания на солнце. Повторно нанесите после плавания и пребывания на солнце.\n\n#### Происхождение\n\nТаиланд\n\n#### Как использовать\n\nРавномерно нанесите на всё тело за 20 минут до пребывания на солнце. Повторно нанесите после плавания и пребывания на солнце.\n\n#### Состав\n\nСм. на упаковке продукта.\n\n#### Условия хранения\n\nХранить в сухом, прохладном и хорошо проветриваемом месте. Беречь от детей.","zh":"**Banana Boat Sport SPF50 防晒霜 90ml** + **主要成分及功效：**\n\n- Banana Boat Sport SPF50 90ml 是一款增强防晒成分的防晒霜，SPF 50PA++，帮助在阳光下保护肌肤。\n- 产品采用 AvoTriplex 技术形成高效防晒保护膜，并添加芦荟、维生素C、维生素E及不油腻配方，帮助保持肌肤水分并提升防晒效果。\n- SPF 50PA++ 的防晒效果最长可达约7.5小时，可阻挡98%的有害UVB射线，让您在阳光下活动时减少对肌肤变黑和色素沉着的担忧。\n- 根据所提供的原始资料，本产品遇水不易脱落，并被描述为不易引起过敏、不堵塞毛孔。\n\n**适用人群：**\nBanana Boat Sport SPF50 90ml 适用于所有肤质。\n\n**使用方法：**\n在日晒前20分钟均匀涂抹于全身。游泳和日晒后重新涂抹。\n\n#### 原产地\n\n泰国\n\n#### 使用方式\n\n在日晒前20分钟均匀涂抹于全身。游泳和日晒后重新涂抹。\n\n#### 成分\n\n请参阅产品包装。\n\n#### 储存方法\n\n存放于干燥、阴凉且通风良好的地方。置于儿童接触不到的地方。"},{"id":"02","name":"Kem Chống Nắng Banana Boat Sport Ultra Sunscreen Lotion SPF80 PA++++ 90ml","price":null,"raw_vi":"**Kem Chống Nắng Banana Boat Sport Ultra Sunscreen Lotion SPF80 PA++++ 90ml**  + **Thành Phần Chính Và Công Dụng:**\n\\- Chỉ số SPF80 & PA++++ giúp chống tia UVA/UVB là sản phẩm hoàn hảo giúp bảo vệ da tối ưu khi bạn hoạt động ngoài trời.\n\\- Công thức đặc biệt với khả năng chống nước và mồ hôi cao, giúp bạn thoải mái vận động dưới nắng gắt mà không lo giảm hiệu quả.\n\\- Kết cấu kem siêu mỏng nhẹ, thấm nhanh, không gây bết dính hay nhờn rít, mang lại cảm giác dễ chịu suốt ngày dài.\n\\- Công thức bổ sung lô hội, vitamin C và E giúp dưỡng ẩm, làm dịu da và tăng cường hàng rào bảo vệ tự nhiên.\n\\- Mùi hương dịu nhẹ, dễ chịu, phù hợp với mọi loại da.\n\n**Hướng Dẫn Sử Dụng:**\nThoa đều toàn thân trước khi ra nắng 20 phút. Thoa thêm sau khi bơi và ra nắng.\n\n**Xuất Xứ Thương Hiệu:**\nMỹ\n\n#### Xuất xứ\nMỹ\n#### Cách sử dụng\nXem Hướng Dẫn Sử Dụng Trong Phần Thông Tin Chi Tiết Của Sản Phẩm.\n#### Thành phần\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n#### Cách bảo quản\nBảo Quản Nơi Khô Ráo Thoáng Mát","en":"**Banana Boat Sport Ultra Sunscreen Lotion SPF80 PA++++ 90ml** + **Key Ingredients and Benefits:**\n\n- SPF80 & PA++++ helps protect against UVA/UVB rays and is described as an excellent choice for optimal protection when you are active outdoors.\n- The special formula has high resistance to water and sweat, allowing you to stay active under strong sunlight without worrying about reduced protection.\n- The ultra-light texture absorbs quickly and does not feel sticky or greasy, providing a comfortable feeling throughout the day.\n- The formula is supplemented with aloe vera, vitamin C and vitamin E to help moisturize, soothe the skin and strengthen its natural protective barrier.\n- A gentle, pleasant fragrance is suitable for all skin types.\n\n**Directions for use:**\nApply evenly over the entire body 20 minutes before sun exposure. Reapply after swimming and sun exposure.\n\n**Brand origin:**\nUSA\n\n#### Origin\nUSA\n\n#### How to use\nSee the Directions for Use in the product's detailed information section.\n\n#### Ingredients\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n\n#### Storage\nStore in a dry, cool place.","ru":"**Солнцезащитный лосьон Banana Boat Sport Ultra SPF80 PA++++, 90 мл** + **Основные ингредиенты и свойства:**\n\n- SPF80 и PA++++ помогают защищать от UVA/UVB-лучей; согласно предоставленному источнику, средство обеспечивает оптимальную защиту во время активного отдыха на улице.\n- Специальная формула обладает высокой устойчивостью к воде и поту, позволяя комфортно заниматься активностями под ярким солнцем без опасений по поводу снижения защиты.\n- Очень лёгкая текстура быстро впитывается и не оставляет ощущения липкости или жирности, обеспечивая комфорт в течение дня.\n- Формула дополнена алоэ вера, витаминами C и E, которые помогают увлажнять и успокаивать кожу и поддерживать её естественный защитный барьер.\n- Мягкий приятный аромат подходит для всех типов кожи.\n\n**Способ применения:**\nРавномерно нанесите на всё тело за 20 минут до выхода на солнце. Повторно нанесите после купания и пребывания на солнце.\n\n**Страна происхождения бренда:**\nСША\n\n#### Происхождение\nСША\n\n#### Как использовать\nСм. раздел «Способ применения» в подробной информации о продукте.\n\n#### Состав\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n\n#### Условия хранения\nХранить в сухом, прохладном месте.","zh":"**Banana Boat Sport Ultra SPF80 PA++++ 防晒乳 90ml** + **主要成分及功效：**\n\n- SPF80 & PA++++ 有助于抵御 UVA/UVB 射线；根据所提供的原始资料，在户外活动时可提供良好的防晒保护。\n- 特殊配方具有较强的防水、防汗能力，让您在强烈阳光下活动时无需担心防护效果降低。\n- 超轻盈质地快速吸收，不会产生黏腻或油腻感，全天使用更加舒适。\n- 配方添加芦荟、维生素C和维生素E，帮助保湿、舒缓肌肤并增强肌肤天然保护屏障。\n- 温和宜人的香味，适合所有肤质。\n\n**使用方法：**\n出门日晒前20分钟均匀涂抹于全身。游泳或日晒后重新涂抹。\n\n**品牌原产地：**\n美国\n\n#### 原产地\n美国\n\n#### 使用方式\n请参阅产品详细信息中的使用说明。\n\n#### 成分\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n\n#### 储存方法\n存放于干燥、阴凉处。"},{"id":"03","name":"Xịt Chống Nắng Banana Boat Simply Protect Kids SPF50+ PA++++ 170g","price":null,"raw_vi":"**Xịt Chống Nắng Banana Boat Simply Protect Kids SPF50+ PA++++ 170g**  + **Xịt chống nắng Banana Boat Simply Protect Kids** là kem chống nắng dạng xịt dành cho trẻ em giúp bảo vệ da khỏi tia UV, giảm nguy cơ cháy nắng và phù hợp cho các hoạt động ngoài trời như đi biển, du lịch hay vui chơi dưới nắng gắt.\n\n- Lý tưởng khi đi biển, đi chơi, du lịch cùng gia đình\n- Phù hợp khi bé vui chơi, chạy nhảy hoặc tham gia hoạt động ngoài trời\n- Tiện lợi khi cần xịt lại nhanh trong ngày mà không làm gián đoạn hoạt động của bé\n\n**Thành phần nổi bật:**\n\n- Zinc Oxide: hỗ trợ bảo vệ da bé trước tác động của tia UV\n- Glycerin: giúp duy trì độ ẩm, cho da mềm mại hơn khi tiếp xúc nắng\n- Công thức không cồn, ít mùi: mang lại cảm giác dễ chịu, hạn chế gây khó chịu cho trẻ\n\n**Phù hợp cho:**\n\n- Trẻ em cần kem chống nắng đi biển hoặc hoạt động ngoài trời\n- Bé có làn da nhạy cảm cần sản phẩm nhẹ dịu, dễ sử dụng\n- Trẻ vận động nhiều, ra mồ hôi hoặc thường xuyên tiếp xúc nắng gắt\n- Phụ huynh tìm xịt chống nắng tiện lợi, không bết dính cho bé sử dụng hàng ngày\n\n**Cách sử dụng:** Xịt đều lên da trước khi ra nắng khoảng 15–30 phút. Giữ khoảng cách 10–15cm khi xịt. Xịt lại sau khi bơi, đổ mồ hôi nhiều hoặc sau thời gian dài ngoài nắng để duy trì hiệu quả bảo vệ. Tránh sử dụng khi có gió mạnh.\n\nThêm ngay vào routine chống nắng mỗi ngày để bảo vệ da bé luôn mát dịu và thoải mái. **Mua ngay xịt chống nắng Banana Boat Kids chính hãng tại Watsons hôm nay** để ba mẹ yên tâm cho bé vui chơi dưới nắng!\n\n#### Xuất xứ\nMỹ\n#### Cách sử dụng\nXit đều toàn thân 20 phút trước khi tắm nắng. Thoa thêm sau khi bơi và ra nắng.\n#### Thành phần\nAlcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n#### Cách bảo quản\nĐể sản phẩm nơi khô ráo & thoáng mát. Để xa tấm tay trẻ em.","en":"**Banana Boat Simply Protect Kids Sunscreen Spray SPF50+ PA++++ 170g** + **Banana Boat Simply Protect Kids Sunscreen Spray** is a spray sunscreen for children that helps protect skin from UV rays, reduce the risk of sunburn, and is suitable for outdoor activities such as the beach, travel or playing in strong sunlight.\n\n- Ideal for going to the beach, going out or travelling with the family\n- Suitable when children play, run or take part in outdoor activities\n- Convenient when a quick reapplication is needed during the day without interrupting the child's activity\n\n**Highlighted ingredients:**\n\n- Zinc Oxide: helps protect children's skin from the effects of UV rays\n- Glycerin: helps maintain moisture and keep skin softer when exposed to sunlight\n- Alcohol-free, low-fragrance formula: provides a comfortable feeling and helps limit discomfort for children\n\n**Suitable for:**\n\n- Children who need sunscreen for the beach or outdoor activities\n- Children with sensitive skin who need a gentle, easy-to-use product\n- Children who are very active, sweat or are frequently exposed to strong sunlight\n- Parents looking for a convenient, non-sticky sunscreen spray for daily use by their children\n\n**How to use:** Spray evenly onto the skin about 15–30 minutes before sun exposure. Hold the spray 10–15 cm away from the skin. Reapply after swimming, heavy sweating or prolonged exposure to the sun to maintain protection. Avoid use in strong wind.\n\nAdd Banana Boat Kids sunscreen spray to your daily sun-protection routine to keep children's skin feeling cool and comfortable. **Buy authentic Banana Boat Kids sunscreen spray at Watsons today** so parents can feel reassured while children enjoy playing in the sun!\n\n#### Origin\nUSA\n#### How to use\nSpray evenly over the entire body 20 minutes before sun exposure. Reapply after swimming and sun exposure.\n#### Ingredients\nAlcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n#### Storage\nStore the product in a dry, cool place. Keep out of reach of children.","ru":"**Солнцезащитный спрей Banana Boat Simply Protect Kids SPF50+ PA++++, 170 г** + **Солнцезащитный спрей Banana Boat Simply Protect Kids** предназначен для детей: он помогает защищать кожу от УФ-лучей, снижать риск солнечных ожогов и подходит для активного отдыха на улице, например на пляже, в путешествиях или при играх под ярким солнцем.\n\n- Идеален для пляжа, прогулок и путешествий всей семьёй\n- Подходит для игр, бега и других активностей детей на открытом воздухе\n- Удобен для быстрого повторного нанесения в течение дня без прерывания активности ребёнка\n\n**Основные компоненты:**\n\n- Zinc Oxide: помогает защищать кожу ребёнка от воздействия УФ-лучей\n- Glycerin: помогает поддерживать уровень влаги и сохранять кожу более мягкой при воздействии солнца\n- Формула без спирта, с небольшим количеством отдушки: обеспечивает комфортные ощущения и помогает уменьшить дискомфорт для детей\n\n**Подходит для:**\n\n- Детей, которым нужна солнцезащита для пляжа или активного отдыха\n- Детей с чувствительной кожей, которым требуется мягкое и удобное в использовании средство\n- Активных детей, которые потеют или часто находятся под ярким солнцем\n- Родителей, которые ищут удобный нелипкий солнцезащитный спрей для ежедневного использования детьми\n\n**Способ применения:** Равномерно распылите на кожу примерно за 15–30 минут до выхода на солнце. Держите распылитель на расстоянии 10–15 см от кожи. Повторно наносите после купания, сильного потоотделения или длительного пребывания на солнце для поддержания защиты. Не использовать при сильном ветре.\n\nДобавьте солнцезащитный спрей Banana Boat Kids в ежедневный уход, чтобы кожа ребёнка оставалась прохладной и комфортной. **Купите оригинальный солнцезащитный спрей Banana Boat Kids в Watsons сегодня**, чтобы дети могли спокойно играть на солнце!\n\n#### Происхождение\nСША\n#### Как использовать\nРавномерно распылить на всё тело за 20 минут до выхода на солнце. Повторно нанести после купания и пребывания на солнце.\n#### Состав\nAlcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n#### Условия хранения\nХранить в сухом, прохладном месте. Беречь от детей.","zh":"**Banana Boat Simply Protect Kids SPF50+ PA++++ 儿童防晒喷雾 170g** + **Banana Boat Simply Protect Kids 防晒喷雾** 是一款儿童防晒喷雾，可帮助保护肌肤免受紫外线影响、降低晒伤风险，适合海滩、旅行以及在强烈阳光下玩耍等户外活动。\n\n- 适合与家人一起去海滩、外出或旅行\n- 适合儿童玩耍、跑跳及参加户外活动\n- 白天需要快速补喷时十分方便，不会中断孩子的活动\n\n**主要成分：**\n\n- Zinc Oxide：帮助保护儿童肌肤免受紫外线影响\n- Glycerin：帮助维持肌肤水分，让肌肤在日晒时保持柔软\n- 无酒精、低香型配方：带来舒适感，减少儿童使用时的不适\n\n**适用人群：**\n\n- 需要用于海滩或户外活动的儿童\n- 肌肤敏感、需要温和且容易使用产品的儿童\n- 活动量大、容易出汗或经常暴露在强烈阳光下的儿童\n- 希望为孩子选择方便、不黏腻日常防晒喷雾的家长\n\n**使用方法：** 日晒前约15–30分钟均匀喷于肌肤。保持10–15厘米的喷涂距离。游泳、大量出汗或长时间日晒后重新喷涂，以维持防护效果。强风环境下避免使用。\n\n将 Banana Boat Kids 防晒喷雾加入每天的防晒护理，让孩子的肌肤保持清爽舒适。**今天即可在 Watsons 购买正品 Banana Boat Kids 防晒喷雾**，让家长更安心地陪伴孩子在阳光下玩耍！\n\n#### 原产地\n美国\n#### 使用方式\n日晒前20分钟均匀喷于全身。游泳或日晒后重新喷涂。\n#### 成分\nAlcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n#### 储存方法\n存放于干燥、阴凉处。置于儿童接触不到的地方。"},{"id":"04","name":"Xịt Chống Nắng Banana Boat Sport CoolZone SPF50+ PA++++ 170g","price":null,"raw_vi":"**Xịt Chống Nắng Banana Boat Sport CoolZone SPF50+ PA++++ 170g**  + **Xịt Chống Nắng Banana Boat Coolzone 120ml** là kem chống nắng dạng xịt giúp bảo vệ da khỏi tia UV, giảm nguy cơ cháy nắng và phù hợp cho hoạt động ngoài trời như đi biển, thể thao, trong điều kiện nắng gắt và tia UV cao.\n\n- **Phù hợp khi:** đi biển, du lịch, dã ngoại ngoài trời\n- **Phù hợp khi:** chơi thể thao, vận động nhiều, ra mồ hôi\n- **Phù hợp khi:** tiếp xúc nắng gắt trong thời gian dài\n\n**Thành phần nổi bật:**\n\n- **Lô hội (Aloe Vera):** Giúp làm dịu da và mang lại cảm giác dễ chịu\n- **Công thức không dầu (Oil-free):** Giúp da khô thoáng, hạn chế bết dính\n\n**Phù hợp với:**\n\n- Người thường xuyên vận động ngoài trời, chơi thể thao\n- Người đi biển, du lịch nắng gắt\n- Da dầu hoặc không thích cảm giác bết dính\n- Mọi loại da, kể cả da nhạy cảm .**Cách sử dụng:**\n  - Xịt lên da trước khi ra nắng khoảng 15–30 phút\n  - Giữ khoảng cách 10–15cm và xịt đều lên vùng da cần bảo vệ\n  - Tránh sử dụng trong điều kiện gió mạnh\n  - Xịt lại sau khi bơi, đổ mồ hôi nhiều hoặc sau thời gian dài ngoài nắng .Xuất xứ\n\n    Mỹ\n    #### Cách sử dụng\n    Xit đều toàn thân 20 phút trước khi tắm nắng. Thoa thêm sau khi bơi và ra nắng.\n    #### Thành phần\n    Alcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n    #### Cách bảo quản\n    Để sản phẩm nơi khô ráo & thoáng mát. Để xa tấm tay trẻ em.","en":"**Banana Boat Sport CoolZone Sunscreen Spray SPF50+ PA++++ 170g** + **Banana Boat Coolzone Sunscreen Spray 120ml** is a spray sunscreen that helps protect skin from UV rays, reduce the risk of sunburn, and is suitable for outdoor activities such as the beach and sports, including conditions with strong sunlight and high UV levels.\n\n- **Suitable for:** going to the beach, travelling and outdoor trips\n- **Suitable for:** playing sports, exercising and sweating\n- **Suitable for:** prolonged exposure to strong sunlight\n\n**Highlighted ingredients:**\n\n- **Aloe Vera:** helps soothe the skin and provides a comfortable feeling\n- **Oil-free formula:** helps keep skin dry and reduces stickiness\n\n**Suitable for:**\n\n- People who frequently exercise outdoors or play sports\n- People going to the beach or travelling in strong sunlight\n- Oily skin or people who dislike a sticky feeling\n- All skin types, including sensitive skin. **How to use:**\n  - Spray onto the skin about 15–30 minutes before sun exposure\n  - Hold 10–15 cm away and spray evenly over the areas that need protection\n  - Avoid use in strong wind\n  - Reapply after swimming, heavy sweating or prolonged exposure to the sun. **Origin**\n\n    USA\n    #### How to use\n    Spray evenly over the entire body 20 minutes before sun exposure. Reapply after swimming and sun exposure.\n    #### Ingredients\n    Alcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n    #### Storage\n    Store the product in a dry, cool place. Keep out of reach of children.","ru":"**Солнцезащитный спрей Banana Boat Sport CoolZone SPF50+ PA++++, 170 г** + **Солнцезащитный спрей Banana Boat Coolzone 120 мл** помогает защищать кожу от УФ-лучей, снижать риск солнечных ожогов и подходит для активного отдыха на улице, включая пляж и спорт, при сильном солнечном свете и высоком уровне УФ-излучения.\n\n- **Подходит для:** пляжа, путешествий и отдыха на открытом воздухе\n- **Подходит для:** занятий спортом, активного движения и ситуаций с повышенным потоотделением\n- **Подходит для:** длительного пребывания под сильным солнцем\n\n**Основные компоненты:**\n\n- **Алоэ вера:** помогает успокаивать кожу и создаёт комфортные ощущения\n- **Формула без масел:** помогает сохранять ощущение сухости и уменьшает липкость\n\n**Подходит для:**\n\n- Людей, которые часто занимаются спортом или активно двигаются на открытом воздухе\n- Людей, отдыхающих на пляже или путешествующих при ярком солнце\n- Жирной кожи или тех, кому не нравится ощущение липкости\n- Всех типов кожи, включая чувствительную. **Способ применения:**\n  - Распылить на кожу примерно за 15–30 минут до выхода на солнце\n  - Держать распылитель на расстоянии 10–15 см и равномерно распылить на нужные участки\n  - Не использовать при сильном ветре\n  - Повторно нанести после купания, сильного потоотделения или длительного пребывания на солнце. **Происхождение**\n\n    США\n    #### Как использовать\n    Равномерно распылить на всё тело за 20 минут до выхода на солнце. Повторно нанести после купания и пребывания на солнце.\n    #### Состав\n    Alcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n    #### Условия хранения\n    Хранить в сухом, прохладном месте. Беречь от детей.","zh":"**Banana Boat Sport CoolZone SPF50+ PA++++ 防晒喷雾 170g** + **Banana Boat Coolzone 防晒喷雾 120ml** 是一款防晒喷雾，可帮助保护肌肤免受紫外线影响、降低晒伤风险，适合海滩、运动等户外活动，以及强烈阳光和高紫外线环境。\n\n- **适合：** 去海滩、旅行及户外活动\n- **适合：** 运动、频繁活动及容易出汗的情况\n- **适合：** 长时间接触强烈阳光\n\n**主要成分：**\n\n- **芦荟（Aloe Vera）：** 帮助舒缓肌肤，带来舒适感\n- **无油配方（Oil-free）：** 帮助保持肌肤清爽，减少黏腻感\n\n**适用人群：**\n\n- 经常进行户外活动或运动的人群\n- 去海滩或在强烈阳光下旅行的人群\n- 油性肌肤或不喜欢黏腻感觉的人群\n- 所有肤质，包括敏感肌肤。**使用方法：**\n  - 日晒前约15–30分钟喷于肌肤\n  - 保持10–15厘米距离，均匀喷于需要保护的部位\n  - 强风环境下避免使用\n  - 游泳、大量出汗或长时间日晒后重新喷涂。**原产地**\n\n    美国\n    #### 使用方式\n    日晒前20分钟均匀喷于全身。游泳或日晒后重新喷涂。\n    #### 成分\n    Alcohol Denat, Isobutane, Isododecane, homosalete, ethylhexyl salicylate, Benzopheone-3, butyl Methoxydibenzoylmethane, Diisopropyl, Adipate, Octocrylene, Dimethicone, Parfum, Ascorbyl Palmitate, Aqua, panthenol, ..\n    #### 储存方法\n    存放于干燥、阴凉处。置于儿童接触不到的地方。"},{"id":"05","name":"Dầu Phơi Nắng Bảo Vệ Da Banana Boat SPF15 236ml","price":null,"raw_vi":"**Dầu Phơi Nắng Bảo Vệ Da Banana Boat SPF15 236ml**  + **Gel phơi nắng Banana Boat SPF15 236ml** giúp hỗ trợ bảo vệ da khỏi tác động ánh nắng ở mức vừa phải, đồng thời hỗ trợ quá trình lên tông da nâu tự nhiên, đều màu và mịn màng. Công thức hương trái cây dễ chịu mang lại cảm giác thư giãn khi sử dụng. Phù hợp cho người yêu thích tắm nắng và muốn có làn da nâu khỏe khoắn.\n\n**Thông số sản phẩm**\n- Thương hiệu: Banana Boat\n- Dòng sản phẩm: Gel phơi nắng (Tanning Gel)\n- Chỉ số chống nắng: SPF15\n- Dung tích: 236ml\n- Kết cấu: Gel, dễ thoa\n- Hương: Trái cây nhẹ nhàng\n- Loại da phù hợp: Mọi loại da\n- Công dụng chính: Hỗ trợ bảo vệ da & hỗ trợ lên tông da nâu . **Thông tin sản xuất**\n  - Thương hiệu Banana Boat nổi tiếng với các sản phẩm chăm sóc da khi đi biển, hoạt động ngoài trời\n  - Phát triển theo tiêu chuẩn chất lượng quốc tế\n  - Thiết kế phù hợp cho nhu cầu sử dụng tiện lợi khi du lịch, dã ngoại\n  **Hướng dẫn sử dụng**\n  1. Làm sạch và lau khô da trước khi sử dụng\n  2. Thoa đều gel lên vùng da cần phơi nắng\n  3. Sử dụng trước khi ra nắng khoảng 10–15 phút\n  4. Thoa lại sau khi bơi hoặc đổ mồ hôi nhiều\n  5. Dùng khi tham gia các hoạt động ngoài trời như đi biển, hồ bơi\n  **Lợi ích & hiệu quả**\n  - Hỗ trợ bảo vệ da với SPF15 khi tiếp xúc ánh nắng\n  - Giúp da lên tông nâu tự nhiên, đều màu hơn\n  - Tăng cảm giác da mịn và bóng khỏe\n  - Hương thơm trái cây tạo cảm giác dễ chịu khi sử dụng\n  - Phù hợp cho người muốn có làn da nâu “bronze glow” tự nhiên\n  **Lưu ý an toàn**\n  - SPF15 phù hợp mức tiếp xúc nắng vừa phải, không thay thế kem chống nắng SPF cao\n  - Tránh dùng trên da đang bị kích ứng hoặc tổn thương\n  - Ngưng sử dụng nếu xuất hiện dấu hiệu khó chịu\n  - Tránh tiếp xúc với mắt\n  - Bảo quản nơi khô ráo, tránh ánh nắng trực tiếp\n  - Nên kết hợp kem chống nắng SPF cao khi ở ngoài trời lâu. Xuất xứ\n\n    Mỹ\n    #### Cách sử dụng\n    Thoa đều toàn thân 20 phút trước khi tắm nắng. Thoa thêm sau khi bơi hoặc lau khô.\n    #### Thành phần\n    Paraffinum Liquidum, Homosalate, C12-15 Alkyl Benzoate, Ethylhexyl Salycilate, Butyk Methoxydibenzoylmethane,Octocrylen, Carprylyl Glycol, Diethyhexyl 2,6 Naphtjalate, Isopropyl Myrustate, Phenoxyethanol, Parfum, Cocos Nucifera Oil, Theobroma Cacao S","en":"**Banana Boat SPF15 Tanning Oil 236ml** + **Banana Boat SPF15 Tanning Gel 236ml** helps provide moderate protection from sunlight while supporting a natural, even and smooth tan. Its pleasant fruity fragrance provides a relaxing feeling during use. Suitable for people who enjoy sunbathing and want a healthy-looking tan.\n\n**Product specifications**\n- Brand: Banana Boat\n- Product line: Tanning Gel\n- Sun protection factor: SPF15\n- Volume: 236ml\n- Texture: Gel, easy to apply\n- Fragrance: Light fruity fragrance\n- Suitable skin type: All skin types\n- Main benefit: Helps protect skin and supports a natural tan\n\n**Manufacturing information**\n- Banana Boat is well known for skin-care products for beach and outdoor activities\n- Developed according to international quality standards\n- Designed for convenient use during travel and outdoor trips\n\n**Directions for use**\n1. Clean and dry the skin before use\n2. Apply the gel evenly to areas to be exposed to the sun\n3. Use about 10–15 minutes before sun exposure\n4. Reapply after swimming or heavy sweating\n5. Use during outdoor activities such as going to the beach or swimming pool\n\n**Benefits & effects**\n- Helps protect skin with SPF15 during sun exposure\n- Helps the skin develop a natural, more even tan\n- Helps the skin feel smooth and look healthy and glossy\n- Fruity fragrance creates a pleasant feeling during use\n- Suitable for people who want a natural “bronze glow”\n\n**Safety notes**\n- SPF15 is suitable for moderate sun exposure and does not replace a high-SPF sunscreen\n- Avoid use on irritated or damaged skin\n- Stop use if discomfort occurs\n- Avoid contact with eyes\n- Store in a dry place away from direct sunlight\n- A high-SPF sunscreen should be used together when staying outdoors for a long time\n\n#### Origin\nUSA\n#### How to use\nApply evenly over the entire body 20 minutes before sun exposure. Reapply after swimming or drying off.\n#### Ingredients\nParaffinum Liquidum, Homosalate, C12-15 Alkyl Benzoate, Ethylhexyl Salycilate, Butyk Methoxydibenzoylmethane,Octocrylen, Carprylyl Glycol, Diethyhexyl 2,6 Naphtjalate, Isopropyl Myrustate, Phenoxyethanol, Parfum, Cocos Nucifera Oil, Theobroma Cacao S","ru":"**Масло для загара Banana Boat SPF15 236 мл** + **Гель для загара Banana Boat SPF15 236 мл** помогает обеспечить умеренную защиту от воздействия солнечных лучей и поддерживает естественный, ровный и гладкий загар. Приятный фруктовый аромат создаёт ощущение расслабления во время использования. Подходит тем, кто любит загорать и хочет получить здоровый оттенок загара.\n\n**Характеристики продукта**\n- Бренд: Banana Boat\n- Линия продукта: Гель для загара\n- Солнцезащитный фактор: SPF15\n- Объём: 236 мл\n- Текстура: Гель, легко наносится\n- Аромат: Лёгкий фруктовый аромат\n- Подходящий тип кожи: Все типы кожи\n- Основное действие: Помогает защищать кожу и поддерживает естественный загар\n\n**Информация о производстве**\n- Banana Boat известен средствами по уходу за кожей для пляжа и активного отдыха\n- Разработано в соответствии с международными стандартами качества\n- Подходит для удобного использования во время путешествий и отдыха на природе\n\n**Способ применения**\n1. Очистите и высушите кожу перед использованием\n2. Равномерно нанесите гель на участки кожи, которые будут находиться на солнце\n3. Используйте примерно за 10–15 минут до выхода на солнце\n4. Повторно нанесите после плавания или сильного потоотделения\n5. Используйте во время активного отдыха, например на пляже или у бассейна\n\n**Преимущества и эффект**\n- Помогает защищать кожу с SPF15 при пребывании на солнце\n- Помогает получить естественный и более равномерный коричневый оттенок\n- Делает кожу более гладкой и визуально здоровой и сияющей\n- Фруктовый аромат создаёт приятное ощущение при использовании\n- Подходит тем, кто хочет получить естественный “bronze glow”\n\n**Меры безопасности**\n- SPF15 подходит для умеренного пребывания на солнце и не заменяет солнцезащитное средство с высоким SPF\n- Не наносить на раздражённую или повреждённую кожу\n- Прекратить использование при появлении неприятных ощущений\n- Избегать попадания в глаза\n- Хранить в сухом месте, защищённом от прямых солнечных лучей\n- При длительном пребывании на открытом воздухе рекомендуется использовать средство с высоким SPF\n\n#### Происхождение\nСША\n#### Как использовать\nРавномерно нанесите на всё тело за 20 минут до пребывания на солнце. Повторно нанесите после плавания или вытирания кожи.\n#### Состав\nParaffinum Liquidum, Homosalate, C12-15 Alkyl Benzoate, Ethylhexyl Salycilate, Butyk Methoxydibenzoylmethane,Octocrylen, Carprylyl Glycol, Diethyhexyl 2,6 Naphtjalate, Isopropyl Myrustate, Phenoxyethanol, Parfum, Cocos Nucifera Oil, Theobroma Cacao S","zh":"**Banana Boat SPF15 防晒美黑油 236ml** + **Banana Boat SPF15 美黑凝胶 236ml** 可在适度日晒时帮助保护肌肤，同时帮助形成自然、均匀且柔滑的棕色肤色。清新的水果香气让使用过程更加放松。适合喜欢日光浴并希望获得健康棕色肤色的人。\n\n**产品规格**\n- 品牌：Banana Boat\n- 产品系列：美黑凝胶\n- 防晒指数：SPF15\n- 容量：236ml\n- 质地：凝胶，易于涂抹\n- 香味：淡淡水果香\n- 适用肤质：所有肤质\n- 主要功效：帮助保护肌肤并支持自然美黑\n\n**生产信息**\n- Banana Boat 以海滩和户外活动护肤产品而知名\n- 按照国际质量标准开发\n- 设计便于旅行和户外活动时使用\n\n**使用方法**\n1. 使用前清洁并擦干肌肤\n2. 将凝胶均匀涂抹在需要日晒的部位\n3. 在日晒前约10–15分钟使用\n4. 游泳或大量出汗后重新涂抹\n5. 可在海滩、游泳池等户外活动时使用\n\n**功效与效果**\n- SPF15 有助于在日晒时保护肌肤\n- 帮助肌肤形成自然、更加均匀的棕色肤色\n- 使肌肤感觉更加柔滑并呈现健康光泽\n- 水果香气带来舒适的使用感\n- 适合希望获得自然“bronze glow”效果的人\n\n**安全注意事项**\n- SPF15 适合适度日晒，不能替代高SPF防晒霜\n- 避免用于正在受到刺激或受损的肌肤\n- 如出现不适，请停止使用\n- 避免接触眼睛\n- 存放于干燥处，避免阳光直射\n- 长时间户外活动时建议同时使用高SPF防晒产品\n\n#### 原产地\n美国\n#### 使用方式\n日晒前20分钟均匀涂抹于全身。游泳或擦干身体后重新涂抹。\n#### 成分\nParaffinum Liquidum, Homosalate, C12-15 Alkyl Benzoate, Ethylhexyl Salycilate, Butyk Methoxydibenzoylmethane,Octocrylen, Carprylyl Glycol, Diethyhexyl 2,6 Naphtjalate, Isopropyl Myrustate, Phenoxyethanol, Parfum, Cocos Nucifera Oil, Theobroma Cacao S"},{"id":"06","name":"Gel Dưỡng Da Lô Hội Banana Boat 90ml","price":null,"raw_vi":"- **Gel Dưỡng Da Lô Hội Banana Boat 90ml**  + **Gel Dưỡng Da Lô Hội Banana Boat 90ml - Làm Dịu Mát Da Tức Thì**\n\nGel Dưỡng Da Lô Hội Banana Boat 90ml với chiết xuất lô hội nguyên chất giúp làm dịu, làm mát và dưỡng ẩm cho da, đặc biệt sau khi tiếp xúc với nắng. Kết cấu gel nhẹ, thấm nhanh, không nhờn rít, mang lại làn da mềm mại và tươi mát mỗi ngày. **Công dụng nổi bật:**\n- Giúp làm dịu và làm mát da tức thì\n- Hỗ trợ dưỡng ẩm, phục hồi da khô\n- Mang lại cảm giác mát lạnh, sảng khoái\n- Giúp da mềm mại, tươi sáng hơn\n**Điểm nổi bật của sản phẩm:**\n- Chiết xuất lô hội nguyên chất: Làm dịu và dưỡng ẩm da\n- Kết cấu gel nhẹ: Thấm nhanh, không nhờn rít\n- Phù hợp mọi loại da: An toàn, dịu nhẹ\n- Có thể dùng cho mặt và toàn thân\n**Trải nghiệm sử dụng:**\n\nGel trong suốt, mát lạnh khi thoa lên da. Thấm nhanh không để lại cảm giác nhờn. Sau khi dùng, da mát dịu, mềm mại và được dưỡng ẩm đầy đủ.\n**Hướng dẫn sử dụng:**\n- Thoa đều lên mặt, cổ và toàn thân\n- Sử dụng sáng và tối mỗi ngày\n- Thoa thêm khi cần dưỡng ẩm. **Kết quả mong đợi:**\n  - Da mát dịu, hết nóng rát\n  - Da mềm mại, được dưỡng ẩm\n  - Tự tin với làn da tươi sáng\n  Thêm Gel Lô Hội Banana Boat vào routine chăm sóc da để có làn da mát dịu và mềm mại!\n  #### Xuất xứ\n  Mỹ\n  #### Cách sử dụng\n  Thoa đều lên mặt, cổ và toàn thân mỗi sáng tối.\n  #### Thành phần\n  Xem trên bao bì sản phẩm\n  #### Cách bảo quản\n  Nơi Khô Mát, Tránh Ánh Nắng Trực Tiếp","en":"**Banana Boat Aloe Vera Gel 90ml** + **Banana Boat Aloe Vera Gel 90ml – Instant Cooling & Soothing**\n\nBanana Boat Aloe Vera Gel 90ml with pure aloe vera extract helps soothe, cool and moisturize the skin, especially after sun exposure. Its lightweight gel texture absorbs quickly without greasiness, leaving skin soft and refreshed every day. **Key benefits:**\n- Helps immediately soothe and cool the skin\n- Helps moisturize and restore dry skin\n- Provides a cool, refreshing feeling\n- Helps skin feel softer and look brighter\n\n**Product highlights:**\n- Pure aloe vera extract: Soothes and moisturizes skin\n- Lightweight gel texture: Absorbs quickly, without greasiness\n- Suitable for all skin types: Gentle and mild\n- Can be used on the face and entire body\n\n**User experience:**\nThe clear gel feels cool when applied. It absorbs quickly without leaving a greasy feeling. After use, skin feels cool, soft and moisturized.\n\n**Directions for use:**\n- Apply evenly to the face, neck and entire body\n- Use every morning and evening\n- Reapply whenever additional moisture is needed\n\n**Expected results:**\n- Skin feels cool and soothed\n- Skin feels soft and moisturized\n- Skin looks fresh and healthy\nAdd Banana Boat Aloe Vera Gel to your daily skin-care routine for cool, soft and moisturized skin!\n\n#### Origin\nUSA\n#### How to use\nApply evenly to the face, neck and entire body every morning and evening.\n#### Ingredients\nSee the product packaging\n#### Storage\nStore in a cool, dry place away from direct sunlight","ru":"**Гель с алоэ вера Banana Boat 90 мл** + **Гель с алоэ вера Banana Boat 90 мл — мгновенное охлаждение и успокоение кожи**\n\nГель Banana Boat Aloe Vera Gel 90 мл с чистым экстрактом алоэ вера помогает успокаивать, охлаждать и увлажнять кожу, особенно после пребывания на солнце. Лёгкая гелевая текстура быстро впитывается и не оставляет жирности. **Основные преимущества:**\n- Помогает мгновенно успокоить и охладить кожу\n- Помогает увлажнять и восстанавливать сухую кожу\n- Даёт прохладное и освежающее ощущение\n- Помогает сделать кожу мягче и свежее\n\n**Особенности продукта:**\n- Чистый экстракт алоэ вера: успокаивает и увлажняет кожу\n- Лёгкая гелевая текстура: быстро впитывается без жирности\n- Подходит для всех типов кожи: мягкая формула\n- Можно использовать на лице и всём теле\n\n**Ощущения при использовании:**\nПрозрачный гель даёт прохладное ощущение при нанесении. Быстро впитывается и не оставляет жирности. После использования кожа ощущается прохладной, мягкой и увлажнённой.\n\n**Способ применения:**\n- Равномерно наносить на лицо, шею и всё тело\n- Использовать утром и вечером каждый день\n- Наносить повторно при необходимости увлажнения\n\n**Ожидаемый результат:**\n- Кожа ощущается прохладной и успокоенной\n- Кожа мягкая и увлажнённая\n- Кожа выглядит свежей и здоровой\nДобавьте гель Banana Boat Aloe Vera Gel в ежедневный уход за кожей!\n\n#### Происхождение\nСША\n#### Как использовать\nРавномерно наносить на лицо, шею и всё тело утром и вечером.\n#### Состав\nСм. на упаковке продукта\n#### Условия хранения\nХранить в прохладном сухом месте вдали от прямых солнечных лучей","zh":"**Banana Boat 芦荟护肤凝胶 90ml** + **Banana Boat 芦荟护肤凝胶 90ml——即时舒缓清凉**\n\nBanana Boat 芦荟凝胶90ml含纯芦荟提取物，有助于舒缓、降温和滋润肌肤，尤其适合日晒后使用。轻盈凝胶质地快速吸收，不油腻。**主要功效：**\n- 帮助即时舒缓并冷却肌肤\n- 帮助补水并改善干燥肌肤\n- 带来清凉舒爽感\n- 帮助肌肤柔软并显得更加清新\n\n**产品特点：**\n- 纯芦荟提取物：舒缓并滋润肌肤\n- 轻盈凝胶质地：快速吸收，不油腻\n- 适合所有肤质：温和柔润\n- 可用于面部及全身\n\n**使用感受：**\n透明凝胶涂抹时带来清凉感，快速吸收，不留下油腻感。使用后肌肤感觉清凉、柔软并得到滋润。\n\n**使用方法：**\n- 均匀涂抹于面部、颈部及全身\n- 每天早晚使用\n- 需要补充水分时可再次使用\n\n**预期效果：**\n- 肌肤感觉清凉舒缓\n- 肌肤柔软并得到滋润\n- 肌肤看起来清新健康\n将 Banana Boat 芦荟凝胶加入日常护肤步骤！\n\n#### 原产地\n美国\n#### 使用方式\n每天早晚均匀涂抹于面部、颈部和全身。\n#### 成分\n请参阅产品包装\n#### 储存方法\n存放于阴凉干燥处，避免阳光直射"},{"id":"07","name":"Gel Dưỡng Da Lô Hội Banana Boat 230g","price":null,"raw_vi":"- **Gel Dưỡng Da Lô Hội Banana Boat 230g** + **Gel nha đam Banana Boat** là gel dưỡng sau nắng giúp làm dịu da cháy nắng nhẹ, giảm cảm giác nóng rát và cấp ẩm cho da khô, thiếu nước.\n  - Phù hợp khi da bị nóng rát, khô căng sau khi tiếp xúc ánh nắng\n  - Hỗ trợ làm dịu nhanh sau khi đi biển, du lịch hoặc hoạt động ngoài trời\n  - Giữ da mềm mại, dễ chịu hơn trong điều kiện thời tiết nóng\n  **Thành phần nổi bật:**\n  - Lô hội (Aloe Vera): hỗ trợ làm dịu da, cấp nước nhanh và mang lại cảm giác mát dịu\n  - Glycerin: giúp duy trì độ ẩm, hạn chế tình trạng da khô căng\n  **Phù hợp cho:**\n  - Da khô, da thiếu ẩm\n  - Da sau khi đi nắng, da bị nóng rát hoặc cháy nắng nhẹ\n  - Người cần gel nha đam dưỡng nhẹ, không bết dính, dùng hàng ngày. **Cách sử dụng: **Thoa đều lên da sau khi làm sạch. Có thể sử dụng nhiều lần trong ngày, đặc biệt sau khi tiếp xúc ánh nắng hoặc khi da cảm thấy khô, nóng.  .Xuất xứ\n\n    Mỹ\n    #### Cách sử dụng\n    Thoa đều lên mặt, cổ và toàn thân mỗi sáng tối.\n    #### Thành phần\n    Xem trên bao bì sản phẩm\n    #### Cách bảo quản\n    Để sản phẩm nơi khô ráo & thoáng mát. Để xa tấm tay trẻ em.","en":"**Banana Boat Aloe Vera Gel 230g** + **Banana Boat Aloe Vera Gel** is an after-sun gel that helps soothe mildly sunburned skin, reduce hot or burning sensations and moisturize dry, dehydrated skin.\n- Suitable when skin feels hot, tight or dry after sun exposure\n- Helps soothe skin after the beach, travel or outdoor activities\n- Helps keep skin soft and comfortable in hot weather\n\n**Highlighted ingredients:**\n- Aloe Vera: Helps soothe skin, provide hydration and a cooling feeling\n- Glycerin: Helps maintain moisture and reduce dryness and tightness\n\n**Suitable for:**\n- Dry or dehydrated skin\n- Skin after sun exposure, with hot sensation or mild sunburn\n- People who need a light, non-sticky aloe vera gel for daily use\n\n**How to use:** Apply evenly to clean skin. It can be used several times a day, especially after sun exposure or whenever skin feels dry or hot.\n\n#### Origin\nUSA\n#### How to use\nApply evenly to the face, neck and entire body every morning and evening.\n#### Ingredients\nSee the product packaging\n#### Storage\nStore in a dry, cool place. Keep out of reach of children.","ru":"**Гель с алоэ вера Banana Boat 230 г** + **Гель алоэ вера Banana Boat** — гель после загара, который помогает успокоить кожу после лёгкого солнечного ожога, уменьшить ощущение жара и увлажнить сухую, обезвоженную кожу.\n- Подходит, когда после солнца кожа горячая, сухая или стянутая\n- Помогает успокоить кожу после пляжа, путешествий или активного отдыха\n- Помогает сохранять кожу мягкой и комфортной в жаркую погоду\n\n**Основные компоненты:**\n- Алоэ вера: помогает успокоить кожу, увлажнить её и создать ощущение прохлады\n- Глицерин: помогает удерживать влагу и уменьшать сухость и стянутость\n\n**Подходит для:**\n- Сухой и обезвоженной кожи\n- Кожи после пребывания на солнце, при ощущении жара или лёгком солнечном ожоге\n- Тех, кому нужен лёгкий нелипкий гель с алоэ вера для ежедневного использования\n\n**Способ применения:** Равномерно наносить на очищенную кожу. Можно использовать несколько раз в день, особенно после пребывания на солнце или когда кожа ощущается сухой и горячей.\n\n#### Происхождение\nСША\n#### Как использовать\nРавномерно наносить на лицо, шею и всё тело утром и вечером.\n#### Состав\nСм. на упаковке продукта\n#### Условия хранения\nХранить в сухом прохладном месте. Беречь от детей.","zh":"**Banana Boat 芦荟护肤凝胶 230g** + **Banana Boat 芦荟凝胶** 是一款日晒后护理凝胶，有助于舒缓轻微晒伤肌肤，减轻灼热感，并为干燥缺水肌肤补充水分。\n- 适合日晒后肌肤感觉灼热、干燥或紧绷时使用\n- 有助于海滩、旅行或户外活动后的肌肤舒缓\n- 在炎热天气中帮助保持肌肤柔软舒适\n\n**主要成分：**\n- 芦荟：帮助舒缓肌肤、快速补水并带来清凉感\n- 甘油：帮助维持肌肤水分，减少干燥紧绷\n\n**适用人群：**\n- 干燥、缺水肌肤\n- 日晒后肌肤、感觉灼热或轻微晒伤肌肤\n- 需要轻盈、不黏腻芦荟凝胶日常使用的人群\n\n**使用方法：** 清洁肌肤后均匀涂抹。每天可多次使用，尤其适合日晒后或肌肤感觉干燥、发热时使用。\n\n#### 原产地\n美国\n#### 使用方式\n每天早晚均匀涂抹于面部、颈部和全身。\n#### 成分\n请参阅产品包装\n#### 储存方法\n存放于干燥阴凉处。置于儿童接触不到的地方。"},{"id":"08","name":"Xịt Chống Nắng Banana Boat Sport Ultra Sunscreen Continuous Spray SPF65 PA++++ 170g","price":null,"raw_vi":"- **Xịt Chống Nắng Banana Boat Sport Ultra Sunscreen Continuous Spray SPF65 PA++++ 170g**  + **Xịt Chống Nắng Banana Boat Sport Ultra Sunscreen Continuous Spray SPF65 PA++++ 170g**\n\n**Thành Phần Chính Và Công Dụng:**\n\\- Chỉ số SPF65 & PA++++ giúp chống tia UVA/UVB là sản phẩm hoàn hảo giúp bảo vệ da tối ưu khi bạn hoạt động ngoài trời\n\\- Thành phần độc đáo không chứa dầu và các chất phụ liệu, hình thành màng chắn chống lại tác hại của tia UVA và UVB hiệu quả.\n\\- Sản phẩm có khả năng chống nắng lâu trôi vượt trội với mồ hôi và nước lên đến 80 phút.\n\\- Công thức nhẹ, không nhờn, thẩm thấu nhanh chóng.\n\\- Hương thơm tươi mát, dễ chịu.\n\\- Thiết kế dạng xịt tiện lợi, trong suốt.\n\n**Hướng Dẫn Sử Dụng:**\nLắc kỹ trước khi dùng, xịt đều toàn thân trước khi ra nắng 20 phút. Thoa thêm sau khi bơi và ra nắng.\n\n**Xuất Xứ Thương Hiệu:**\nMỹ\n#### Xuất xứ\nMỹ\n#### Cách sử dụng\nXem Hướng Dẫn Sử Dụng Trong Phần Thông Tin Chi Tiết Của Sản Phẩm.\n#### Thành phần\nAlcohol Denat., Isobutane, Caprylic/Capric Triglyceride, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Diethylhexyl Butamido Triazone, Butyloctyl Salicylate, Isododecane, Butyl Methoxydibenzoylmethane, Isopropyl Myristate, Diisobutyl Adipate, …\n#### Cách bảo quản\nBảo Quản Nơi Khô Ráo Thoáng Mát","en":"**Banana Boat Sport Ultra Sunscreen Continuous Spray SPF65 PA++++ 170g** + **Banana Boat Sport Ultra Sunscreen Continuous Spray SPF65 PA++++ 170g**\n\n**Key Ingredients and Benefits:**\n- SPF65 & PA++++ helps protect against UVA/UVB rays during outdoor activity\n- Unique oil-free formula forms a barrier against UVA and UVB damage\n- Protection against sweat and water lasts up to 80 minutes\n- Lightweight, non-greasy formula absorbs quickly\n- Fresh, pleasant fragrance\n- Convenient transparent spray design\n\n**Directions for use:**\nShake well before use. Spray evenly over the entire body 20 minutes before sun exposure. Reapply after swimming and sun exposure.\n\n**Brand origin:** USA\n#### Origin\nUSA\n#### How to use\nSee the Directions for Use in the product's detailed information section.\n#### Ingredients\nAlcohol Denat., Isobutane, Caprylic/Capric Triglyceride, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Diethylhexyl Butamido Triazone, Butyloctyl Salicylate, Isododecane, Butyl Methoxydibenzoylmethane, Isopropyl Myristate, Diisobutyl Adipate, …\n#### Storage\nStore in a dry, cool place.","ru":"**Солнцезащитный спрей Banana Boat Sport Ultra Continuous SPF65 PA++++ 170 г** + **Солнцезащитный спрей Banana Boat Sport Ultra Continuous SPF65 PA++++ 170 г**\n\n**Основные компоненты и свойства:**\n- SPF65 и PA++++ помогают защищать от UVA/UVB-лучей при активном отдыхе\n- Уникальная формула без масел создаёт защитный барьер от UVA и UVB\n- Защита от пота и воды сохраняется до 80 минут\n- Лёгкая формула без жирности быстро впитывается\n- Свежий приятный аромат\n- Удобный прозрачный формат спрея\n\n**Способ применения:**\nХорошо встряхнуть перед использованием. Равномерно распылить на всё тело за 20 минут до выхода на солнце. Повторно нанести после плавания и пребывания на солнце.\n\n**Страна происхождения бренда:** США\n#### Происхождение\nСША\n#### Как использовать\nСм. подробные указания по применению в информации о продукте.\n#### Состав\nAlcohol Denat., Isobutane, Caprylic/Capric Triglyceride, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Diethylhexyl Butamido Triazone, Butyloctyl Salicylate, Isododecane, Butyl Methoxydibenzoylmethane, Isopropyl Myristate, Diisobutyl Adipate, …\n#### Условия хранения\nХранить в сухом прохладном месте.","zh":"**Banana Boat Sport Ultra SPF65 PA++++ 连续防晒喷雾 170g** + **Banana Boat Sport Ultra SPF65 PA++++ 连续防晒喷雾 170g**\n\n**主要成分及功效：**\n- SPF65 & PA++++ 有助于抵御 UVA/UVB 射线，适合户外活动\n- 独特无油配方形成防护膜，有助于抵御 UVA 和 UVB 的影响\n- 对汗水和水的防护可持续长达80分钟\n- 质地轻盈、不油腻，快速吸收\n- 清新舒适的香味\n- 透明喷雾设计，使用方便\n\n**使用方法：**\n使用前充分摇匀。日晒前20分钟均匀喷于全身。游泳或日晒后重新涂抹。\n\n**品牌原产地：** 美国\n#### 原产地\n美国\n#### 使用方式\n请参阅产品详细信息中的使用说明。\n#### 成分\nAlcohol Denat., Isobutane, Caprylic/Capric Triglyceride, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Diethylhexyl Butamido Triazone, Butyloctyl Salicylate, Isododecane, Butyl Methoxydibenzoylmethane, Isopropyl Myristate, Diisobutyl Adipate, …\n#### 储存方法\n存放于干燥阴凉处。"},{"id":"09","name":"Banana Boat Ultra Protect SPF 50 90ml","price":null,"raw_vi":"- Banana Boat Ultra Protect SPF 50 **là dòng sản phẩm chống nắng phổ rộng dùng cho cả mặt và toàn thân, giúp bảo vệ da tối ưu trước tác hại của tia UVA và UVB**.\n\n**Thông tin chi tiết sản phẩm**\n- **Thương hiệu / Xuất xứ:** Banana Boat (Mỹ).\n- **Dạng sản phẩm:** Có 2 dạng phổ biến gồm dạng tuýp kem/sữa chống nắng (thường là 90ml) và dạng chai xịt khoáng chống nắng (170g).\n- **Chỉ số chống nắng:** SPF 50, PA+++ đến PA++++ (ngăn chặn khoảng 98% tia UVB).\n- **Thành phần chính:** Octocrylene, Avobenzone, Homosalate, Oxybenzone, kết hợp các thành phần dưỡng ẩm như Vitamin C, Vitamin E, Glycerin và chiết xuất Lô hội (Aloe vera).\n- **Công nghệ nổi bật:** Công nghệ AvoTriplex giúp màng lọc chống nắng bền vững hơn dưới ánh nắng, kết hợp khả năng chống nước và mồ hôi tốt.\n**Đặc điểm và công dụng**\n- **Chống nắng hiệu quả:** Ngăn ngừa sạm da, nám, lão hóa sớm và cháy nắng khi hoạt động ngoài trời.\n- **Kết cấu:** Thẩm thấu nhanh, không chứa dầu nặng, ít gây nhờn rít và không làm bít tắc lỗ chân lông.\n- **Khả năng kháng nước:** Phù hợp cho các hoạt động ngoài trời, đi bơi hoặc đi biển nhờ khả năng chống nước tốt trong nhiều giờ.","en":"**Banana Boat Ultra Protect SPF 50** is a broad-spectrum sunscreen product for both face and body, helping protect skin from UVA and UVB rays.\n\n**Product details**\n- **Brand / Origin:** Banana Boat (USA).\n- **Product forms:** Two common forms include sunscreen lotion/cream in a tube (usually 90ml) and sunscreen spray (170g).\n- **Sun protection:** SPF 50, PA+++ to PA++++ (blocking about 98% of UVB rays).\n- **Key ingredients:** Octocrylene, Avobenzone, Homosalate, Oxybenzone, together with Vitamin C, Vitamin E, Glycerin and Aloe vera extract.\n- **Highlighted technology:** AvoTriplex technology helps make the sunscreen filter film more stable under sunlight, together with good water and sweat resistance.\n\n**Features and benefits**\n- **Sun protection:** Helps prevent darkening, pigmentation, premature aging and sunburn during outdoor activities.\n- **Texture:** Absorbs quickly, does not contain heavy oil, feels less greasy and is described as not clogging pores.\n- **Water resistance:** Suitable for outdoor activities, swimming or beach trips due to good water resistance for several hours.","ru":"**Banana Boat Ultra Protect SPF 50** — солнцезащитное средство широкого спектра для лица и тела, помогающее защищать кожу от воздействия UVA и UVB.\n\n**Подробная информация о продукте**\n- **Бренд / происхождение:** Banana Boat (США).\n- **Формы продукта:** Две распространённые формы — солнцезащитный крем/лосьон в тюбике (обычно 90 мл) и солнцезащитный спрей (170 г).\n- **Солнцезащитный фактор:** SPF 50, PA+++–PA++++ (блокирует около 98% UVB-лучей).\n- **Основные компоненты:** Octocrylene, Avobenzone, Homosalate, Oxybenzone, а также Vitamin C, Vitamin E, Glycerin и экстракт Aloe vera.\n- **Технология:** AvoTriplex помогает сделать защитную плёнку более стабильной под воздействием солнца, а также обеспечивает хорошую устойчивость к воде и поту.\n\n**Особенности и свойства**\n- **Защита от солнца:** Помогает предотвращать потемнение кожи, пигментацию, преждевременное старение и солнечные ожоги при активном отдыхе.\n- **Текстура:** Быстро впитывается, не содержит тяжёлой маслянистой основы, меньше ощущается как жирная и согласно источнику не закупоривает поры.\n- **Водостойкость:** Подходит для активного отдыха, плавания и поездок на пляж благодаря хорошей водостойкости в течение нескольких часов.","zh":"**Banana Boat Ultra Protect SPF 50** 是一款适用于面部和全身的广谱防晒产品，有助于保护肌肤免受 UVA 和 UVB 射线的影响。\n\n**产品详细信息**\n- **品牌 / 原产地：** Banana Boat（美国）。\n- **产品形式：** 常见有两种形式，包括管装防晒霜/乳液（通常90ml）和防晒喷雾（170g）。\n- **防晒指数：** SPF 50，PA+++ 至 PA++++（可阻挡约98%的UVB射线）。\n- **主要成分：** Octocrylene、Avobenzone、Homosalate、Oxybenzone，以及维生素C、维生素E、甘油和芦荟提取物。\n- **突出技术：** AvoTriplex 技术帮助防晒过滤膜在阳光下更加稳定，并具有较好的防水、防汗能力。\n\n**特点与功效**\n- **防晒效果：** 户外活动时帮助预防肤色变深、色斑、过早老化和晒伤。\n- **质地：** 快速吸收，不含厚重油脂，较少产生油腻感，并且根据原始资料不会堵塞毛孔。\n- **防水能力：** 由于具有较好的持续防水能力，适合户外活动、游泳和海滩活动。"},{"id":"10","name":"KEM CHỐNG NẮNG BANANA BOAT ULTRA PROTECT SPF50 90ML","price":null,"raw_vi":"- KEM CHỐNG NẮNG BANANA BOAT ULTRA PROTECT SPF50 90ML + **THÔNG TIN SẢN PHẨM KEM CHỐNG NẮNG BANANA BOAT ULTRA PROTECT SPF50 90ML:**\n\n**Kem chống nắng Banana Boat Ultra Protect SPF50 PA++++ (90ml)** là dòng kem chống nắng phổ rộng dùng hằng ngày cho cả mặt và toàn thân, nổi bật với khả năng dưỡng ẩm sâu và bảo vệ da tối ưu dưới nắng gắt. Sản phẩm ứng dụng **công nghệ AvoTriplex độc quyền** giúp ổn định màng lọc chống nắng, ngăn chặn đến 98% tia UVB gây cháy nắng và bảo vệ da khỏi tia UVA gây lão hóa, sạm nám.  **THÀNH PHẦN VÀ CÔNG DỤNG CỦA KEM CHỐNG NẮNG BANANA BOAT ULTRA PROTECT SPF50 90ML:**\n\n**Thành phần:**\n- **Công nghệ AvoTriplex**: Tạo lớp màng siêu chống nắng, giúp lớp bảo vệ không bị biến tính hay phân hủy nhanh dưới ánh nắng mặt trời.\n- **Chiết xuất lô hội (Nha đam)**: Giúp làm dịu mát da tức thì, giảm cảm giác bỏng rát khi tiếp xúc với nắng gắt.\n- **Vitamin C & E**: Cung cấp chất chống oxy hóa, dưỡng ẩm nhẹ nhàng và bảo vệ da khỏi các gốc tự do gây lão hóa sớm.\n- **Kháng nước bền bỉ**: Khả năng bảo vệ da duy trì liên tục lên đến 80 phút khi bơi lội hoặc đổ mồ hôi nhiều, rất thích hợp cho các hoạt động thể thao ngoài trời.\n**Công dụng:**\n- **Bảo vệ toàn diện**: Chống tia UVA/UVB tối ưu, ngăn ngừa tình trạng da bị cháy nắng, sạm nám hoặc tàn nhang.\n- **Kháng nước và mồ hôi**: Khả năng chống trôi hiệu quả lên đến 80 phút, thích hợp khi đi bơi hoặc chơi thể thao.\n- **Kết cấu mỏng nhẹ**: Chất kem dạng sữa/lotion thấm nhanh, không gây nhờn rít, bết dính và không làm bít tắc lỗ chân lông.\n**HƯỚNG DẪN SỬ DỤNG KEM CHỐNG NẮNG BANANA BOAT ULTRA PROTECT SPF50 90ML:**\n- Thoa kem đều khắp vùng da cần bảo vệ trước khi ra nắng từ **15 đến 20 phút**.\n- Thoa lại sau mỗi **2 tiếng** nếu bạn liên tục vận động ngoài trời, đổ mồ hôi nhiều hoặc sau khi bơi xong.","en":"**PRODUCT INFORMATION – BANANA BOAT ULTRA PROTECT SPF50 90ML**\n\n**Banana Boat Ultra Protect SPF50 PA++++ (90ml)** is a broad-spectrum sunscreen for daily use on the face and body, notable for moisturizing and protection under strong sunlight. The product uses **AvoTriplex technology** to stabilize the sunscreen filter system, block up to 98% of UVB rays that cause sunburn and protect against UVA rays associated with premature aging and pigmentation.\n\n**INGREDIENTS AND BENEFITS OF BANANA BOAT ULTRA PROTECT SPF50 90ML:**\n\n**Ingredients:**\n- **AvoTriplex technology:** Creates a highly protective sunscreen film and helps the protective layer resist rapid change or breakdown under sunlight.\n- **Aloe vera extract:** Helps cool and soothe skin and reduce burning sensations under strong sunlight.\n- **Vitamin C & E:** Provide antioxidants, light moisturization and protection from free radicals associated with premature aging.\n- **Long-lasting water resistance:** Protection can remain for up to 80 minutes during swimming or heavy sweating, suitable for outdoor sports.\n\n**Benefits:**\n- **Comprehensive protection:** UVA/UVB protection to help prevent sunburn, darkening, pigmentation or freckles.\n- **Water and sweat resistance:** Effective resistance to washing off for up to 80 minutes, suitable for swimming and sports.\n- **Lightweight texture:** Milk/lotion-like texture absorbs quickly without greasy or sticky feeling and is described as not clogging pores.\n\n**DIRECTIONS FOR USE – BANANA BOAT ULTRA PROTECT SPF50 90ML:**\n- Apply evenly to the areas requiring protection **15–20 minutes** before sun exposure.\n- Reapply every **2 hours** during continuous outdoor activity, heavy sweating or after swimming.","ru":"**ИНФОРМАЦИЯ О ПРОДУКТЕ — BANANA BOAT ULTRA PROTECT SPF50 90ML**\n\n**Banana Boat Ultra Protect SPF50 PA++++ (90 мл)** — солнцезащитное средство широкого спектра для ежедневного использования на лице и теле, с увлажняющим действием и защитой при ярком солнце. Продукт использует **технологию AvoTriplex**, которая помогает стабилизировать систему солнцезащитных фильтров, блокировать до 98% UVB-лучей, вызывающих солнечные ожоги, и защищать от UVA-лучей, связанных с преждевременным старением и пигментацией.\n\n**СОСТАВ И СВОЙСТВА BANANA BOAT ULTRA PROTECT SPF50 90ML:**\n\n**Состав:**\n- **Технология AvoTriplex:** Создаёт высокоэффективный защитный слой и помогает ему сохранять свойства под воздействием солнца.\n- **Экстракт алоэ вера:** Помогает охлаждать и успокаивать кожу, уменьшая ощущение жжения при сильном солнце.\n- **Витамины C и E:** Обеспечивают антиоксидантную защиту, лёгкое увлажнение и защиту от свободных радикалов.\n- **Стойкость к воде:** Защита сохраняется до 80 минут при плавании или сильном потоотделении, что подходит для спорта на открытом воздухе.\n\n**Свойства:**\n- **Комплексная защита:** Защита от UVA/UVB помогает предотвращать солнечные ожоги, потемнение, пигментацию и веснушки.\n- **Устойчивость к воде и поту:** Помогает сохранять защиту до 80 минут, подходит для плавания и спорта.\n- **Лёгкая текстура:** Текстура молочка/лосьона быстро впитывается без ощущения жирности и липкости; согласно источнику не закупоривает поры.\n\n**СПОСОБ ПРИМЕНЕНИЯ — BANANA BOAT ULTRA PROTECT SPF50 90ML:**\n- Равномерно нанесите на защищаемые участки за **15–20 минут** до выхода на солнце.\n- Повторяйте нанесение каждые **2 часа** при длительной активности на улице, сильном потоотделении или после плавания.","zh":"**产品信息——BANANA BOAT ULTRA PROTECT SPF50 90ML**\n\n**Banana Boat Ultra Protect SPF50 PA++++（90ml）** 是一款适合面部和全身日常使用的广谱防晒产品，强调保湿及强日照下的肌肤保护。产品采用 **AvoTriplex 技术**，帮助稳定防晒过滤系统，可阻挡最高约98%的UVB射线并帮助抵御与肌肤老化、色素沉着相关的UVA射线。\n\n**BANANA BOAT ULTRA PROTECT SPF50 90ML 的成分与功效：**\n\n**成分：**\n- **AvoTriplex 技术：** 形成高效防晒保护膜，并帮助保护层在阳光下保持稳定。\n- **芦荟提取物：** 帮助即时舒缓、降温，减轻强烈日晒时的灼热感。\n- **维生素C和E：** 提供抗氧化作用、轻度滋润，并帮助抵御与肌肤早期老化相关的自由基。\n- **持久防水：** 游泳或大量出汗时防护可持续最长80分钟，适合户外运动。\n\n**功效：**\n- **全面防护：** UVA/UVB防护，有助于预防晒伤、肤色变深、色素沉着和雀斑。\n- **防水防汗：** 防护可持续最长80分钟，适合游泳和运动。\n- **轻盈质地：** 乳液质地快速吸收，不产生油腻或黏腻感，并根据原始资料不会堵塞毛孔。\n\n**使用方法——BANANA BOAT ULTRA PROTECT SPF50 90ML：**\n- 日晒前 **15–20分钟** 均匀涂抹于需要保护的肌肤。\n- 如果持续户外活动、大量出汗或游泳后，每 **2小时** 重新涂抹。"},{"id":"11","name":"Kem Chống Nắng Banana Boat Sport Ultra Sunscreen Lotion SPF100 PA++++ 90ml","price":null,"raw_vi":"- **Kem Chống Nắng Banana Boat Sport Ultra Sunscreen Lotion SPF100 PA++++ 90ml**  + Mô tả\n\n**Kem Chống Nắng Banana Boat Sport Ultra Sunscreen Lotion SPF80 PA++++ 90ml**\n\n**Thành Phần Chính Và Công Dụng:**\n\\- Chỉ số SPF80 & PA++++ giúp chống tia UVA/UVB là sản phẩm hoàn hảo giúp bảo vệ da tối ưu khi bạn hoạt động ngoài trời.\n\\- Công thức đặc biệt với khả năng chống nước và mồ hôi cao, giúp bạn thoải mái vận động dưới nắng gắt mà không lo giảm hiệu quả.\n\\- Kết cấu kem siêu mỏng nhẹ, thấm nhanh, không gây bết dính hay nhờn rít, mang lại cảm giác dễ chịu suốt ngày dài.\n\\- Công thức bổ sung lô hội, vitamin C và E giúp dưỡng ẩm, làm dịu da và tăng cường hàng rào bảo vệ tự nhiên.\n\\- Mùi hương dịu nhẹ, dễ chịu, phù hợp với mọi loại da.\n\n**Hướng Dẫn Sử Dụng:**\nThoa đều toàn thân trước khi ra nắng 20 phút. Thoa thêm sau khi bơi và ra nắng.\n\n**Xuất Xứ Thương Hiệu:**\nMỹ\n#### Xuất xứ\nMỹ\n#### Cách sử dụng\nXem Hướng Dẫn Sử Dụng Trong Phần Thông Tin Chi Tiết Của Sản Phẩm.\n#### Thành phần\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n#### Cách bảo quản\nBảo Quản Nơi Khô Ráo Thoáng Mát","en":"**Banana Boat Sport Ultra Sunscreen Lotion SPF100 PA++++ 90ml** + Description\n\n**Banana Boat Sport Ultra Sunscreen Lotion SPF80 PA++++ 90ml**\n\n**Key Ingredients and Benefits:**\n- SPF80 & PA++++ helps protect against UVA/UVB rays and is described as providing optimal protection during outdoor activity.\n- Special formula with high water and sweat resistance for activity under strong sunlight.\n- Ultra-light texture absorbs quickly without stickiness or greasy feeling.\n- Aloe vera, vitamin C and E help moisturize, soothe and support the natural protective barrier.\n- Gentle, pleasant fragrance suitable for all skin types.\n\n**Directions for use:**\nApply evenly over the entire body 20 minutes before sun exposure. Reapply after swimming and sun exposure.\n\n**Brand origin:** USA\n#### Origin\nUSA\n#### How to use\nSee the Directions for Use in the product's detailed information section.\n#### Ingredients\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n#### Storage\nStore in a dry, cool place.","ru":"**Солнцезащитный лосьон Banana Boat Sport Ultra SPF100 PA++++, 90 мл** + Описание\n\n**Солнцезащитный лосьон Banana Boat Sport Ultra SPF80 PA++++, 90 мл**\n\n**Основные компоненты и свойства:**\n- SPF80 и PA++++ помогают защищать от UVA/UVB и обеспечивать защиту при активном отдыхе на улице.\n- Специальная формула обладает высокой устойчивостью к воде и поту.\n- Очень лёгкая текстура быстро впитывается без липкости и жирности.\n- Алоэ вера, витамины C и E помогают увлажнять, успокаивать кожу и поддерживать естественный защитный барьер.\n- Мягкий приятный аромат подходит для всех типов кожи.\n\n**Способ применения:**\nРавномерно наносить на всё тело за 20 минут до выхода на солнце. Повторно наносить после плавания и пребывания на солнце.\n\n**Страна происхождения бренда:** США\n#### Происхождение\nСША\n#### Как использовать\nСм. раздел «Способ применения» в подробной информации о продукте.\n#### Состав\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n#### Условия хранения\nХранить в сухом прохладном месте.","zh":"**Banana Boat Sport Ultra SPF100 PA++++ 防晒乳 90ml** + 描述\n\n**Banana Boat Sport Ultra SPF80 PA++++ 防晒乳 90ml**\n\n**主要成分及功效：**\n- SPF80 & PA++++ 有助于抵御 UVA/UVB 射线，并用于户外活动时的防护。\n- 特殊配方具有较强的防水、防汗能力。\n- 超轻盈质地快速吸收，不黏腻、不油腻。\n- 芦荟、维生素C和E帮助滋润、舒缓肌肤并支持天然保护屏障。\n- 温和舒适的香味，适合所有肤质。\n\n**使用方法：**\n日晒前20分钟均匀涂抹于全身。游泳或日晒后重新涂抹。\n\n**品牌原产地：** 美国\n#### 原产地\n美国\n#### 使用方式\n请参阅产品详细信息中的使用说明。\n#### 成分\nAqua, Octocrylene, Diisopropyl Adipate, Butyloctyl Salicylate, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Diethylhexyl Butamido Triazone, Hydroxyethyl Acrylate/Sodium Acryloyldimethyl Taurate Copolymer, Glycerin, Acrylates/C12-22 Alkyl …\n#### 储存方法\n存放于干燥阴凉处。"},{"id":"12","name":"Kem Chống Nắng Neutrogena Ultra Sheer Dry Touch Khô Thoáng SPF 50 PA+++ 88ml","price":null,"raw_vi":"- **Kem Chống Nắng Neutrogena Ultra Sheer Dry Touch Khô Thoáng SPF 50 PA+++ 88ml**  +Mô tả\n\n**Kem Chống Nắng Neutrogena Ultra Sheer Dry Touch Khô Thoáng SPF 50 PA+++ 88ml**\n\nKem Chống Nắng Neutrogena Ultra Sheer Dry Touch Khô Thoáng SPF 50 PA+++ 88ml với công thức đặc biệt bảo vệ da tránh tia UV dưới ánh nắng gắt của mùa hè. Da bạn sẽ không bị bóng nhờn, ngược lại, sẽ có cảm giác khô ráo và nhẹ nhàng. Sản phẩm còn tích hợp Butylene Glycol dưỡng ẩm và làm đẹp da, Vitamin A, C, E nuôi dưỡng làn da. Công thức Heliopex này tăng độ bền vững trước ánh nắng, giúp chống nắng được lâu hơn. **Thành phần chính và công dụng:**\n- Công nghệ Helioplex ™ đảm bảo rằng khả năng chống nắng không bị phá vỡ, ngăn chặn hiệu quả các tia UVA và UVB gây hại.\n- Công nghệ Dry-Touch giúp làn da của bạn không bị bóng và không bị tắc nghẽn. Neutrogena® Ultra Sheer Dry-Touch Sunscreen bảo vệ tính toàn vẹn của hàng rào bảo vệ da của bạn bằng cách bảo vệ nó khỏi tác hại do tia UV gây ra, giúp làn da của bạn luôn tươi trẻ.\n- Chất kem mỏng nhẹ, dễ thẩm thấu, mùi hương dễ chịu, tươi mát, thích hợp với mọi loại da, kể cả da nhạy cảm.**Đối tượng sử dụng:**\nKem Chống Nắng Neutrogena Ultra Sheer Dry Touch Khô Thoáng SPF 50 PA+++ 88ml phù hợp sử dụng cho mọi loại da.\n\n**Hướng dẫn sử dụng:**\n- Thoa đều lên cơ thể từ 15-30 phút trước khi ra nắng. Lặp lại để duy trì lớp bảo vệ.\n- Chỉ sử dụng ngoài da. Tránh tiếp xúc với mắt. Nếu lỡ vào mắt, rửa sạch với nước. Giữ ngoài tầm tay trẻ em.\n**Xuất xứ thương hiệu:**\nMỹ\n#### Xuất xứ\nHàn Quốc\n#### Cách sử dụng\nXem Hướng Dẫn Sử Dụng Trong Phần Thông Tin Chi Tiết Của Sản Phẩm.\n#### Thành phần\nWater, Homosalate, Benzophenone-3, Ethylhexyl Salicylate, Octocrylene, Butyl Methoxydibenzoylmethane, Silica, Styrene/Acrylates Copolymer, Potassium Cetyl Phosphate, Beeswax, Glyceryl Stearate, PEG-100 Stearate, Dimethicone, Caprylyl Methicone\n#### Cách bảo quản\nĐể Nơi Khô Ráo , Thoáng Mát, Tránh Ánh Nắng Trực Tiếp","en":"**Neutrogena Ultra Sheer Dry Touch Sunscreen SPF50 PA+++ 88ml** + Description\n\n**Neutrogena Ultra Sheer Dry Touch Sunscreen SPF50 PA+++ 88ml** uses a special formula to protect skin from UV rays under strong summer sunlight. It avoids a shiny, greasy feeling and leaves skin feeling dry and light. The product also contains Butylene Glycol for moisturization and skin care, and Vitamins A, C and E. The Helioplex formula improves stability under sunlight and helps extend sun protection. **Key ingredients and benefits:**\n- Helioplex™ technology helps maintain sunscreen performance and effectively blocks harmful UVA and UVB rays.\n- Dry-Touch technology helps prevent a shiny feeling and clogging. Neutrogena® Ultra Sheer Dry-Touch Sunscreen helps protect the skin barrier from UV damage.\n- Lightweight, easy-to-absorb texture with a pleasant fresh fragrance, suitable for all skin types including sensitive skin.\n\n**Suitable for:**\nSuitable for all skin types.\n\n**Directions for use:**\n- Apply evenly to the body 15–30 minutes before sun exposure. Reapply to maintain protection.\n- For external use only. Avoid contact with eyes. If product gets into eyes, rinse with water. Keep out of reach of children.\n\n**Brand origin:** USA\n#### Origin\nKorea\n#### How to use\nSee the Directions for Use in the product's detailed information section.\n#### Ingredients\nWater, Homosalate, Benzophenone-3, Ethylhexyl Salicylate, Octocrylene, Butyl Methoxydibenzoylmethane, Silica, Styrene/Acrylates Copolymer, Potassium Cetyl Phosphate, Beeswax, Glyceryl Stearate, PEG-100 Stearate, Dimethicone, Caprylyl Methicone\n#### Storage\nStore in a dry, cool place away from direct sunlight.","ru":"**Солнцезащитный крем Neutrogena Ultra Sheer Dry Touch SPF50 PA+++ 88 мл** + Описание\n\n**Neutrogena Ultra Sheer Dry Touch SPF50 PA+++ 88 мл** использует специальную формулу для защиты кожи от УФ-лучей при ярком летнем солнце. Она не оставляет блестящего жирного ощущения и создаёт сухое и лёгкое ощущение. Содержит Butylene Glycol для увлажнения и ухода, а также витамины A, C и E. Формула Helioplex повышает стабильность под воздействием солнца. **Основные компоненты и свойства:**\n- Технология Helioplex™ помогает сохранять эффективность защиты и блокировать вредные UVA- и UVB-лучи.\n- Технология Dry-Touch помогает избежать блеска и ощущения закупоренности. Neutrogena® Ultra Sheer Dry-Touch помогает защищать кожный барьер от УФ-воздействия.\n- Лёгкая, быстро впитывающаяся текстура с приятным свежим ароматом, подходит для всех типов кожи, включая чувствительную.\n\n**Подходит для:**\nПодходит для всех типов кожи.\n\n**Способ применения:**\n- Равномерно наносить на тело за 15–30 минут до выхода на солнце. Повторять нанесение для поддержания защиты.\n- Только для наружного применения. Избегать контакта с глазами. При попадании в глаза промыть водой. Беречь от детей.\n\n**Страна происхождения бренда:** США\n#### Происхождение\nЮжная Корея\n#### Как использовать\nСм. раздел «Способ применения» в подробной информации о продукте.\n#### Состав\nWater, Homosalate, Benzophenone-3, Ethylhexyl Salicylate, Octocrylene, Butyl Methoxydibenzoylmethane, Silica, Styrene/Acrylates Copolymer, Potassium Cetyl Phosphate, Beeswax, Glyceryl Stearate, PEG-100 Stearate, Dimethicone, Caprylyl Methicone\n#### Условия хранения\nХранить в сухом прохладном месте, избегая прямых солнечных лучей.","zh":"**Neutrogena Ultra Sheer Dry Touch 清爽不油腻防晒霜 SPF50 PA+++ 88ml** + 产品说明\n\n**Neutrogena Ultra Sheer Dry Touch 清爽不油腻防晒霜 SPF50 PA+++ 88ml** 采用特殊配方，帮助保护肌肤免受夏季强烈阳光中的UV射线影响。使用后不会产生明显油光和油腻感，而是保持干爽轻盈。含有用于保湿和护肤的 Butylene Glycol，以及维生素A、C、E。Helioplex 配方有助于提高阳光下的稳定性并延长防晒效果。**主要成分及功效：**\n- Helioplex™ 技术有助于保持防晒性能，有效阻挡有害 UVA 和 UVB 射线。\n- Dry-Touch 技术帮助减少油光和堵塞感，保护肌肤屏障免受UV影响。\n- 质地轻盈易吸收，带有清新舒适的香味，适合所有肤质，包括敏感肌。\n\n**适用人群：**\n适合所有肤质。\n\n**使用方法：**\n- 日晒前15–30分钟均匀涂抹于身体。根据需要重新涂抹以维持保护。\n- 仅供外用。避免接触眼睛。如不慎入眼，请用清水冲洗。置于儿童接触不到的地方。\n\n**品牌原产地：** 美国\n#### 原产地\n韩国\n#### 使用方式\n请参阅产品详细信息中的使用说明。\n#### 成分\nWater, Homosalate, Benzophenone-3, Ethylhexyl Salicylate, Octocrylene, Butyl Methoxydibenzoylmethane, Silica, Styrene/Acrylates Copolymer, Potassium Cetyl Phosphate, Beeswax, Glyceryl Stearate, PEG-100 Stearate, Dimethicone, Caprylyl Methicone\n#### 储存方法\n存放于干燥阴凉处，避免阳光直射。"},{"id":"13","name":"Sữa Chống Nắng Toàn Thân Nivea Sun Protect&Moisture SPF30 UVA/UVB Body Lotion 125ml","price":null,"raw_vi":"- **Sữa Chống Nắng Toàn Thân Nivea Sun Protect&Moisture SPF30 UVA/UVB Body Lotion 125ml**  + Mô tả\n\n**Sữa Chống Nắng Toàn Thân Nivea Sun Protect&Moisture SPF30 UVA/UVB Body Lotion 125ml**\n\n**Sữa chống nắng toàn thân Nivea Sun Protect&Moisture SPF30** giúp bảo vệ da khỏi tia UVA và UVB, đồng thời dưỡng ẩm cho da mềm mại suốt cả ngày. Với kết cấu dạng lotion nhẹ nhàng, sản phẩm thấm nhanh và không gây bết dính trên da.\n\nNhiều người thường bỏ qua bước chống nắng cho body vì sợ nhờn rít, bí da hoặc mất thời gian. Sữa chống nắng dạng lotion giúp bạn bảo vệ da toàn thân một cách nhanh chóng, dễ dàng và thoải mái mỗi ngày.\n\n**Lý do nên chọn sản phẩm này:**\n- SPF30 giúp bảo vệ da khỏi tia UVA và UVB trong sinh hoạt hằng ngày\n- Kết cấu dạng lotion mỏng nhẹ, thấm nhanh vào da\n- Dưỡng ẩm cho da mềm mại, không khô căng\n- Không gây bết dính hay nhờn rít trên da\n- Dung tích 125ml tiện lợi cho sử dụng hằng ngày\n**Lợi ích nổi bật:**\n- Giúp bảo vệ da toàn thân khi tiếp xúc ánh nắng\n- Da mềm mại, ẩm mượt sau khi sử dụng\n- Không gây cảm giác nhờn rít khó chịu\n- Màu da đều hơn, tươi tắn hơn\n- Dễ dàng thoa cho toàn bộ cơ thể\n**Kết cấu và cảm giác khi dùng:**\nLotion có kết cấu mỏng nhẹ, dễ tán và thấm nhanh vào da. Sau khi sử dụng, da cảm giác mềm mại, ẩm mượt mà không bết dính. Sản phẩm thấm nhanh, không gây cảm giác nặng hoặc bí da.\n**Phù hợp với:**\n- Mọi loại da\n- Da cần dưỡng ẩm khi chống nắng\n- Người cần chống nắng cho toàn thân\n- Routine chống nắng hằng ngày\n**Hướng dẫn sử dụng:**\n- Thoa đều khắp cơ thể trước khi ra nắng 20 phút\n- Tập trung vào vùng da dễ tiếp xúc ánh nắng\n- Bôi lại sau khi bơi, đổ mồ hôi hoặc lau khô người\n- Sử dụng hằng ngày để duy trì hiệu quả bảo vệ. **Xuất xứ thương hiệu:**\n\nĐức\n#### Xuất xứ\nThái Lan\n#### Cách sử dụng\nXem Hướng Dẫn Sử Dụng Trong Phần Thông Tin Chi Tiết Của Sản Phẩm.\n#### Thành phần\nAqua, Isopropyl Palmitate, C12-15 Alkyl Benzoate, Glycerin, Alcohol Denat., Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, Dibutyl Adipate, Ethylhexyl Triazone, Copernicia Cerifera Cera, Glyceryl Stearate Se, …\n#### Cách bảo quản\nNơi Khô Ráo, Thoáng Mát, Tránh Ánh Nắng Trực Tiếp. Để Xa Tầm Tay Trẻ Em. Đậy Nắp Sau Khi Sử Dụng.","en":"**Nivea Sun Protect&Moisture SPF30 UVA/UVB Body Lotion 125ml** + Description\n\n**Nivea Sun Protect&Moisture SPF30 UVA/UVB Body Lotion 125ml** helps protect skin from UVA and UVB rays while moisturizing the skin throughout the day. Its lightweight lotion texture absorbs quickly and does not feel sticky.\n\nMany people skip body sunscreen because they worry about greasiness, heaviness or time. This lotion helps protect the whole body quickly, easily and comfortably every day.\n\n**Reasons to choose this product:**\n- SPF30 helps protect skin from UVA and UVB during daily activities\n- Lightweight lotion texture, absorbs quickly\n- Moisturizes skin and helps prevent dryness\n- Does not leave a sticky or greasy feeling\n- 125ml volume is convenient for daily use\n\n**Key benefits:**\n- Helps protect the whole body from sunlight\n- Leaves skin soft and moisturized\n- Does not create an uncomfortable greasy feeling\n- Helps skin look more even and fresh\n- Easy to apply over the whole body\n\n**Texture and feel:**\nThe lotion is lightweight, easy to spread and absorbs quickly. After use, skin feels soft and moisturized without stickiness. It does not feel heavy or suffocating.\n\n**Suitable for:**\n- All skin types\n- Skin needing moisturization while using sunscreen\n- People needing whole-body sun protection\n- Daily sun-protection routines\n\n**Directions for use:**\n- Apply evenly over the body 20 minutes before sun exposure\n- Focus on areas easily exposed to sunlight\n- Reapply after swimming, sweating or drying the body\n- Use daily to maintain protection\n\n**Brand origin:** Germany\n#### Origin\nThailand\n#### How to use\nSee the Directions for Use in the product's detailed information section.\n#### Ingredients\nAqua, Isopropyl Palmitate, C12-15 Alkyl Benzoate, Glycerin, Alcohol Denat., Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, Dibutyl Adipate, Ethylhexyl Triazone, Copernicia Cerifera Cera, Glyceryl Stearate Se, …\n#### Storage\nStore in a dry, cool place away from direct sunlight. Keep out of reach of children. Close the cap after use.","ru":"**Лосьон для тела Nivea Sun Protect&Moisture SPF30 UVA/UVB 125 мл** + Описание\n\n**Лосьон для тела Nivea Sun Protect&Moisture SPF30 UVA/UVB 125 мл** помогает защищать кожу от UVA- и UVB-лучей и одновременно увлажняет её в течение дня. Лёгкая текстура быстро впитывается и не оставляет липкости.\n\nМногие пропускают защиту тела от солнца из-за опасений по поводу жирности, тяжести или длительности нанесения. Лосьон позволяет быстро, легко и комфортно защищать всё тело каждый день.\n\n**Почему выбирают этот продукт:**\n- SPF30 помогает защищать кожу от UVA/UVB при повседневной активности\n- Лёгкая текстура быстро впитывается\n- Увлажняет кожу и помогает предотвращать сухость\n- Не оставляет липкого или жирного ощущения\n- Объём 125 мл удобен для ежедневного использования\n\n**Основные преимущества:**\n- Помогает защищать кожу всего тела от солнца\n- Делает кожу мягкой и увлажнённой\n- Не оставляет неприятного жирного ощущения\n- Помогает коже выглядеть более ровной и свежей\n- Легко наносится на всё тело\n\n**Текстура и ощущения:**\nЛосьон лёгкий, легко распределяется и быстро впитывается. После нанесения кожа мягкая и увлажнённая без липкости. Не ощущается тяжёлым или плотным.\n\n**Подходит для:**\n- Всех типов кожи\n- Кожи, которой необходимо увлажнение при использовании солнцезащиты\n- Людей, которым нужна защита всего тела\n- Ежедневного ухода с солнцезащитой\n\n**Способ применения:**\n- Равномерно наносить на всё тело за 20 минут до выхода на солнце\n- Уделять внимание участкам, которые легко подвергаются воздействию солнца\n- Повторно наносить после плавания, потоотделения или вытирания тела\n- Использовать ежедневно для поддержания защиты\n\n**Страна происхождения бренда:** Германия\n#### Происхождение\nТаиланд\n#### Как использовать\nСм. раздел «Способ применения» в подробной информации о продукте.\n#### Состав\nAqua, Isopropyl Palmitate, C12-15 Alkyl Benzoate, Glycerin, Alcohol Denat., Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, Dibutyl Adipate, Ethylhexyl Triazone, Copernicia Cerifera Cera, Glyceryl Stearate Se, …\n#### Условия хранения\nХранить в сухом прохладном месте, избегая прямых солнечных лучей. Беречь от детей. Закрывать крышку после использования.","zh":"**Nivea Sun Protect&Moisture SPF30 UVA/UVB 全身防晒乳 125ml** + 产品说明\n\n**Nivea Sun Protect&Moisture SPF30 UVA/UVB 全身防晒乳 125ml** 有助于抵御 UVA 和 UVB 射线，同时全天滋润肌肤。轻盈乳液质地快速吸收，不产生黏腻感。\n\n许多人因为担心油腻、厚重或使用时间长而忽略身体防晒。这款乳液可以帮助快速、轻松且舒适地进行全身日常防晒。\n\n**选择该产品的理由：**\n- SPF30 有助于日常活动中抵御 UVA 和 UVB\n- 轻盈乳液质地，快速吸收\n- 滋润肌肤，帮助减少干燥\n- 不产生黏腻或油腻感\n- 125ml容量，方便日常使用\n\n**主要功效：**\n- 帮助保护全身肌肤免受阳光影响\n- 使用后肌肤柔软滋润\n- 不产生令人不适的油腻感\n- 帮助肤色看起来更加均匀、清新\n- 容易涂抹于全身\n\n**质地与使用感受：**\n乳液质地轻盈，容易推开并快速吸收。使用后肌肤柔软、滋润，不黏腻，不会感觉厚重或闷。\n\n**适用人群：**\n- 所有肤质\n- 需要在防晒同时补充水分的肌肤\n- 需要全身防晒的人群\n- 日常防晒护理\n\n**使用方法：**\n- 日晒前20分钟均匀涂抹于全身\n- 重点涂抹容易接触阳光的部位\n- 游泳、出汗或擦干身体后重新涂抹\n- 每天使用以维持防护\n\n**品牌原产地：** 德国\n#### 原产地\n泰国\n#### 使用方式\n请参阅产品详细信息中的使用说明。\n#### 成分\nAqua, Isopropyl Palmitate, C12-15 Alkyl Benzoate, Glycerin, Alcohol Denat., Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Butyl Methoxydibenzoylmethane, Dibutyl Adipate, Ethylhexyl Triazone, Copernicia Cerifera Cera, Glyceryl Stearate Se, …\n#### 储存方法\n存放于干燥阴凉处，避免阳光直射。置于儿童接触不到的地方。使用后盖好盖子。"},{"id":"14","name":"Kem chống nắng dạng xịt khô NIVEA SUN \"Bảo vệ và nhẹ nhàng\" SPF 50","price":null,"raw_vi":"Kem chống nắng dạng xịt khô NIVEA SUN \"Bảo vệ và nhẹ nhàng\" SPF 50\n\nHãy thử kem chống nắng dạng xịt khô NIVEA Sun's Protection & Lightness SPF 50:\n- Bảo vệ tối đa khỏi tia UVA/UVB trong dòng sản phẩm NIVEA\n- Khả năng chống nước vượt trội – bảo vệ da ngay cả khi bơi lội trong thời gian dài\n- Công thức tươi mát, nhẹ nhàng và không nhờn rít, thẩm thấu tức thì mà không gây bết dính\n- Mang lại cảm giác mát lạnh nhẹ cho da\n- Công thức trong suốt không để lại vệt trắng trên da\n- Dạng xịt dễ sử dụng ở mọi tư thế và mọi góc độ.\n- Thân thiện với đại dương: công thức không chứa các bộ lọc tia UV Octinoxate, Oxybenzone.\n- Hãy tin tưởng vào khả năng chống nắng của bạn với thương hiệu NIVEA.\n\nHợp chất:\nCồn biến tính (29,27% thể tích), Butan, Isobutan, Propan, C12-15 Alkyl Benzoat, Homosalat, Octocrylene, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylat, Dibutyl Adipat, Propylheptyl Caprylat, Glycerin, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Acrylates/Octylacrylamide Copolymer, Diethylamino Hydroxybenzoyl Hexyl Benzoat, Ethylhexyl Triazone, Tocopherol, Nước, Linalool, Limonene, Benzyl Alcohol, Benzyl Salicylat, Alpha-Isomethyl Ionone, Citronellol, Coumarin, Geraniol, Methyl Benzoat, Hexyl Cinnamal, Hương liệu.\n\nHướng dẫn:\nThoa đều lên da 20-30 phút trước khi tiếp xúc với ánh nắng mặt trời và để sản phẩm thẩm thấu hoàn toàn trước khi mặc quần áo. Không xịt lên mặt hoặc mắt. Thoa lại thường xuyên, đặc biệt sau khi bơi và lau khô người. Tránh tiếp xúc quá nhiều với ánh nắng mặt trời trong thời gian nắng gắt.\n\nphù hợp cho mọi loại da","en":"**NIVEA SUN Protection & Lightness Dry Touch Sunscreen Spray SPF50**\n\nTry NIVEA Sun's Protection & Lightness SPF 50 dry-touch sunscreen spray:\n- Maximum UVA/UVB protection in the NIVEA range\n- Excellent water resistance – protects skin even during prolonged swimming\n- Fresh, light and non-greasy formula that absorbs immediately without stickiness\n- Gives a gentle cooling feeling on the skin\n- Transparent formula leaves no white marks on the skin\n- Spray format is easy to use in different positions and from different angles\n- Ocean-friendly: formula does not contain the UV filters Octinoxate, Oxybenzone\n- Trust NIVEA sun protection\n\n**Compound:**\nAlcohol denat. (29.27% by volume), Butane, Isobutane, Propane, C12-15 Alkyl Benzoate, Homosalate, Octocrylene, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Dibutyl Adipate, Propylheptyl Caprylate, Glycerin, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Acrylates/Octylacrylamide Copolymer, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Ethylhexyl Triazone, Tocopherol, Water, Linalool, Limonene, Benzyl Alcohol, Benzyl Salicylate, Alpha-Isomethyl Ionone, Citronellol, Coumarin, Geraniol, Methyl Benzoate, Hexyl Cinnamal, Fragrance.\n\n**Directions:**\nApply evenly to the skin 20–30 minutes before exposure to sunlight and allow the product to absorb completely before dressing. Do not spray onto the face or eyes. Reapply regularly, especially after swimming and drying the body. Avoid excessive exposure to sunlight during periods of strong sunshine.\n\nSuitable for all skin types","ru":"**Солнцезащитный спрей NIVEA SUN Protection & Lightness SPF50 с сухим эффектом**\n\nПопробуйте солнцезащитный спрей NIVEA Sun Protection & Lightness SPF 50 с сухим эффектом:\n- Максимальная защита от UVA/UVB в линейке NIVEA\n- Высокая водостойкость — защищает кожу даже при длительном плавании\n- Свежая, лёгкая и нежирная формула, которая быстро впитывается без липкости\n- Даёт лёгкое ощущение прохлады на коже\n- Прозрачная формула не оставляет белых следов\n- Формат спрея удобен для использования в разных положениях и под разными углами\n- Безопасность для океана: формула не содержит УФ-фильтры Octinoxate и Oxybenzone\n- Доверяйте защите NIVEA от солнца\n\n**Состав:**\nAlcohol denat. (29,27% по объёму), Butane, Isobutane, Propane, C12-15 Alkyl Benzoate, Homosalate, Octocrylene, Butyl Methoxydibenzoylmethane, Ethylhexyl Salicylate, Dibutyl Adipate, Propylheptyl Caprylate, Glycerin, Bis-Ethylhexyloxyphenol Methoxyphenyl Triazine, Acrylates/Octylacrylamide Copolymer, Diethylamino Hydroxybenzoyl Hexyl Benzoate, Ethylhexyl Triazone, Tocopherol, Water, Linalool, Limonene, Benzyl Alcohol, Benzyl Salicylate, Alpha-Iso
