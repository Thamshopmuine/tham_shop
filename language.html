<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f2b"><meta name="description" content="Thắm Shop – Product information"><title>Thắm Shop – Product Information</title><style>:root{--green:#173f2b;--gold:#b18a45;--ink:#202522;--muted:#68716b;--line:#e5e9e5;--soft:#f5f8f5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f3f6f3,#fff 42%);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}main{width:min(680px,calc(100% - 28px));margin:28px auto 40px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 40px rgba(23,63,43,.08);overflow:hidden}.head{padding:24px 24px 18px;text-align:center;border-bottom:1px solid var(--line)}.brand{font-size:13px;letter-spacing:3px;font-weight:800;color:var(--green)}.sub{margin-top:7px;color:var(--muted);font-size:13px}.hero{padding:20px 24px 10px;text-align:center}.product-image{display:block;width:auto;max-width:78%;height:230px;object-fit:contain;margin:0 auto 14px}.title{font-size:22px;line-height:1.35;font-weight:800;color:var(--green);margin:0 auto;max-width:600px}.choices{padding:12px 24px 26px}.lang{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--green);font-size:17px;font-weight:800;text-align:left;cursor:pointer;transition:.18s}.lang:hover{border-color:#c9d6ca;background:var(--soft);transform:translateY(-1px)}.lang small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:4px}.content{padding:0 26px 28px;line-height:1.72}.selected{text-align:center;color:var(--green);font-weight:800;font-size:15px;letter-spacing:.4px;padding:17px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}.content h3{font-size:15px;color:var(--green);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}.content p{margin:9px 0}.content ul{margin:8px 0;padding-left:22px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.fact{padding:12px 13px;background:var(--soft);border-radius:13px}.fact b{display:block;color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px}.fact span{font-size:14px}.ingredients{font-family:Arial,Helvetica,sans-serif;font-size:13px;background:#fafbfa;border:1px solid var(--line);padding:13px 14px;border-radius:12px;word-break:break-word}.note{margin-top:18px;padding:12px 14px;border-left:3px solid var(--gold);background:#fbf9f4;color:#5f543e;font-size:13px}.back{display:block;text-align:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--green);font-weight:800;text-decoration:none}.error{text-align:center;color:#9a3434;padding:28px 10px}.hidden{display:none}@media(max-width:520px){main{margin-top:12px;border-radius:18px}.head{padding:20px}.hero{padding:16px 18px 8px}.choices{padding:8px 18px 20px}.content{padding:0 18px 22px}.product-image{height:205px;max-width:86%}.title{font-size:20px}.facts{grid-template-columns:1fr}.lang{font-size:16px}}</style></head><body><main><header class="head"><div class="brand">THẮM SHOP</div><div class="sub">Product information</div></header><section class="hero"><img id="productImage" class="product-image" alt="Product image" loading="eager"><h1 id="title" class="title">Loading product information…</h1></section><section id="choices" class="choices"><button class="lang" onclick="showLanguage('vi')">🇻🇳 <span>Tiếng Việt<small>Thông tin sản phẩm bằng tiếng Việt</small></span></button><button class="lang" onclick="showLanguage('en')">🇬🇧 <span>English<small>Product information in English</small></span></button><button class="lang" onclick="showLanguage('ru')">🇷🇺 <span>Русский<small>Информация о продукте на русском языке</small></span></button><button class="lang" onclick="showLanguage('zh')">🇨🇳 <span>中文<small>产品信息（中文）</small></span></button></section><section id="result" class="content hidden"></section></main><script>let product=null;const images={'01':'https://www.lottemart.vn/media/catalog/product/cache/75x75/0/0/0079656603248-1.jpg.webp','02':'https://medias.watsons.vn/publishing/WTCVN-218425-side-zoom.jpg?version=1778085125','03':'https://cdn.taw9eel.com/media/catalog/product/cache/1/image/519x/9df78eab33525d08d6e5fb8d27136e95/m/h/mhjr1681_1.jpg','04':'https://www.guardian.com.vn/media/catalog/product/cache/30b2b44eba57cd45fd3ef9287600968e/3/0/3020168.png','05':'https://www.herbiflix.com/cdn/shop/files/71p1rp0m4YL._AC_SL1500.jpg?v=1761847295&width=1200','06':'https://favo.id/cdn/shop/files/BANTUB1012_Banana-Boat-After-Sun-Care-Aloe-Gel---90-mL.jpg?v=1772778753','07':'https://media.home.bargains/product-images/b/9/3/9/b9391251b3da3df966135f6d92ed855c4edf39a1.png?fit=cover&x=676&y=676','08':'https://i5.walmartimages.com/seo/Banana-Boat-Sport-Ultra-SPF-65-Sunscreen-Spray-6oz_909f1ffd-d0c8-47f4-8aee-afd6369b5692.0247d3f44b739b2bf27d74ea6b1460.jpeg','09':'https://www.static-src.com/wcsstore/Indraprastha/images/catalog/full/109/MTA-68439565/banana_boat_banana_boat_ultra_protect_spf50_90ml_full01_dxnk58wk.jpg','10':'https://www.static-src.com/wcsstore/Indraprastha/images/catalog/full/109/MTA-68439565/banana_boat_banana_boat_ultra_protect_spf50_90ml_full01_dxnk58wk.jpg','11':'https://f.nooncdn.com/p/pzsku/Z925D97444CF0D3CC0A67Z/45/_/1771586667/7bddb801-9520-45b9-a6a4-607b07906dd3.jpg','12':'https://down-vn.img.susercontent.com/file/vn-11134207-7r98o-luxa8c3ttmhee6','13':'https://assets.beiersdorf.com/-/media/images/8/a/9/b/9c873ab9c46f4562909404cc005503c3-web_1010x1180_transparent_png.png?ctx=in&hash=f555756b9fc53623b3b2e365d4f654b85&mw=768','14':'https://mcgrocer.com/cdn/shop/files/nivea-sun-protect-dry-touch-sun-cream-spray-spf50-200ml-41391391768814.jpg?v=1744439833','15':'https://rokbucket.rokomari.io/ProductNew20190903/260X372/Nivea_Sun_Protect_Moisture_Pump_Spray_SP-Nivea-33d8c-493293.png','16':'https://f.nooncdn.com/p/pzsku/ZAE09F60C5B37B8074399Z/45/1765750701/4dbab885-f373-419b-8b23-22fa9f4fc70b.jpg?width=800','17':'https://www.bbassets.com/media/uploads/p/l/40008021_5-nivea-sun-lotion-spf-30-with-uva-uvb-protection-water-resistant-sunscreen-for-men-women.jpg','18':'https://media.farmaciatei.ro/gallery/48266/ulei-spray-pentru-plaja-cu-spf-6-tropical-bronze-200-ml-nivea-sun-9115.jpg'};const labels={vi:'🇻🇳 TIẾNG VIỆT',en:'🇬🇧 ENGLISH',ru:'🇷🇺 РУССКИЙ',zh:'🇨🇳 中文'};function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function render(k){const d=product[k];if(!d)return '<div class="error">Không tìm thấy nội dung ngôn ngữ này.</div>';let html='<div class="selected">'+labels[k]+'</div><div class="facts">';if(d.origin)html+='<div class="fact"><b>Origin</b><span>'+esc(d.origin)+'</span></div>';if(d.skin_type)html+='<div class="fact"><b>Skin type</b><span>'+esc(d.skin_type)+'</span></div>';html+='</div><h3>Product information</h3><p>'+esc(d.description)+'</p>';if(d.directions)html+='<h3>Directions</h3><p>'+esc(d.directions)+'</p>';if(d.ingredients)html+='<h3>Ingredients</h3><div class="ingredients">'+esc(d.ingredients)+'</div>';if(d.storage)html+='<h3>Storage</h3><p>'+esc(d.storage)+'</p>';return html}async function init(){let raw=new URLSearchParams(location.search).get('product')||'';raw=raw.padStart(2,'0');if(!/^\d{2}$/.test(raw)||+raw<1||+raw>18){document.getElementById('title').textContent='Không tìm thấy sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Mã sản phẩm không hợp lệ.</div>';document.getElementById('productImage').classList.add('hidden');return}try{const r=await fetch('./products-master.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const doc=await r.json();product=doc.products.find(x=>x.id===raw);if(!product)throw Error('Product not found');document.getElementById('productImage').src=images[raw]||'';document.getElementById('productImage').alt=product.vi.name;document.getElementById('title').textContent=product.vi.name}catch(e){document.getElementById('title').textContent='Không thể tải thông tin sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Vui lòng tải lại trang và thử lại.</div>';console.error(e)}}function showLanguage(k){if(!product)return;const result=document.getElementById('result');result.innerHTML=render(k)+'<a class="back" href="javascript:location.reload()">← Chọn ngôn ngữ khác</a>';document.getElementById('choices').classList.add('hidden');document.getElementById('title').classList.add('hidden');document.getElementById('productImage').classList.add('hidden');result.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}init();</script></body></html>
