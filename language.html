<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thắm Shop – Chọn ngôn ngữ</title><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f7f7f3;color:#17244d}main{max-width:560px;margin:0 auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.brand{text-align:center;color:#176b3a;font-weight:700;font-size:22px;margin-bottom:6px}.sub{text-align:center;color:#666;margin-bottom:20px}h1{text-align:center;font-size:23px;line-height:1.35;margin:10px 0 24px;color:#176b3a}.lang{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:16px 18px;border:1px solid #dfe7df;border-radius:14px;background:#f8fbf7;color:#173d28;text-decoration:none;font-size:18px;font-weight:700;text-align:left;cursor:pointer}.lang span{display:block;font-size:13px;font-weight:400;color:#777;margin-top:4px}.lang:hover{background:#eef6eb}.note{text-align:center;font-size:13px;color:#777;margin-top:18px}.hidden{display:none}.error{color:#a33;text-align:center}</style></head><body><main><div class="brand">THẮM SHOP</div><div class="sub">Product information</div><h1 id="productTitle">Đang tải thông tin sản phẩm…</h1><div id="buttons"><button class="lang" data-lang="vi">🇻🇳 Tiếng Việt<span>Đọc thông tin sản phẩm bằng tiếng Việt</span></button><button class="lang" data-lang="en">🇬🇧 English<span>Read product information in English</span></button><button class="lang" data-lang="ru">🇷🇺 Русский<span>Информация о продукте на русском языке</span></button><button class="lang" data-lang="zh">🇨🇳 中文<span>用中文阅读产品信息</span></button></div><div id="content" class="hidden"></div><div class="note" id="note">Vui lòng chọn ngôn ngữ của bạn</div></main><script>(async()=>{const p=new URLSearchParams(location.search).get('product');if(!/^\d{2}$/.test(p)){document.getElementById('productTitle').textContent='Không tìm thấy sản phẩm';return}const url='./product-'+p+'.html';let doc;try{const res=await fetch(url);if(!res.ok)throw new Error();doc=new DOMParser().parseFromString(await res.text(),'text/html');const h=doc.querySelector('h1');if(h)document.getElementById('productTitle').textContent=h.textContent}catch(e){document.getElementById('productTitle').textContent='Không thể tải thông tin sản phẩm';document.getElementById('buttons').innerHTML='<div class="error">Vui lòng thử lại sau.</div>';return}document.querySelectorAll('.lang').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.lang;const labels={vi:'🇻🇳 Tiếng Việt',en:'🇬🇧 English',ru:'🇷🇺 Русский',zh:'🇨🇳 中文'};const map={vi:'🇻🇳 TIẾNG VIỆT',en:'🇬🇧 ENGLISH',ru:'🇷🇺 РУССКИЙ',zh:'🇨🇳 中文'};const target=map[key];const heads=[...doc.querySelectorAll('h2')];const head=heads.find(x=>x.textContent.trim()===target);const out=document.getElementById('content');out.innerHTML='';if(head){let n=head.nextElementSibling;while(n&&!((n.tagName==='H2'))){out.appendChild(n.cloneNode(true));n=n.nextElementSibling}}document.getElementById('buttons').classList.add('hidden');document.getElementById('productTitle').insertAdjacentHTML('afterend','<div style="text-align:center;font-weight:700;color:#176b3a;margin-bottom:14px">'+labels[key]+'</div>');document.getElementById('content').classList.remove('hidden');document.getElementById('note').innerHTML='<button onclick="location.reload()" style="border:0;background:none;color:#176b3a;font-weight:700;cursor:pointer">← Chọn ngôn ngữ khác</button>'})})})();</script></body></html>
