<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Thắm Shop – Product information"><title>Thắm Shop – Chọn ngôn ngữ</title><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f7f7f3;color:#17244d}main{max-width:560px;margin:0 auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.brand{text-align:center;color:#176b3a;font-weight:700;font-size:23px;margin-bottom:5px}.sub{text-align:center;color:#666;margin-bottom:18px}.title{text-align:center;font-size:21px;line-height:1.35;margin:10px 0 22px;color:#176b3a}.lang{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:16px 18px;border:1px solid #dfe7df;border-radius:14px;background:#f8fbf7;color:#173d28;text-decoration:none;font-size:18px;font-weight:700;text-align:left;cursor:pointer}.lang small{display:block;font-size:13px;font-weight:400;color:#777;margin-top:5px}.content{margin-top:18px;line-height:1.65;color:#333}.content h3{color:#176b3a;border-bottom:1px solid #eee;padding-bottom:5px}.content p{margin:10px 0}.content ul{padding-left:22px}.selected{text-align:center;color:#176b3a;font-weight:700;font-size:18px;margin:12px 0 18px}.back{display:block;text-align:center;margin-top:20px;color:#176b3a;font-weight:700;text-decoration:none}.error{text-align:center;color:#a33;padding:15px}.hidden{display:none}</style></head><body><main><div class="brand">THẮM SHOP</div><div class="sub">Product information</div><div id="title" class="title">Đang tải thông tin sản phẩm…</div><div id="choices"><button class="lang" onclick="showLanguage('vi')">🇻🇳 Tiếng Việt<small>Đọc thông tin sản phẩm bằng tiếng Việt</small></button><button class="lang" onclick="showLanguage('en')">🇬🇧 English<small>Read product information in English</small></button><button class="lang" onclick="showLanguage('ru')">🇷🇺 Русский<small>Информация о продукте на русском языке</small></button><button class="lang" onclick="showLanguage('zh')">🇨🇳 中文<small>用中文阅读产品信息</small></button></div><div id="result" class="content hidden"></div></main><script>let productDoc=null;const sectionNames={vi:['🇻🇳 TIẾNG VIỆT','TIẾNG VIỆT'],en:['🇬🇧 ENGLISH','ENGLISH'],ru:['🇷🇺 РУССКИЙ','РУССКИЙ'],zh:['🇨🇳 中文','中文']};const labels={vi:'🇻🇳 Tiếng Việt',en:'🇬🇧 English',ru:'🇷🇺 Русский',zh:'🇨🇳 中文'};async function init(){const p=new URLSearchParams(location.search).get('product');if(!/^\d{2}$/.test(p)){document.getElementById('title').textContent='Không tìm thấy sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Mã sản phẩm không hợp lệ.</div>';return}try{const res=await fetch('./product-'+p+'.html',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const html=await res.text();productDoc=new DOMParser().parseFromString(html,'text/html');const h1=productDoc.querySelector('h1');document.getElementById('title').textContent=h1?h1.textContent:'Thông tin sản phẩm';}catch(e){document.getElementById('title').textContent='Không thể tải thông tin sản phẩm';document.getElementById('choices').innerHTML='<div class="error">Vui lòng tải lại trang và thử lại.</div>';console.error(e)}}function showLanguage(key){if(!productDoc)return;const wanted=sectionNames[key];const heads=[...productDoc.querySelectorAll('h2')];let head=heads.find(h=>wanted.includes(h.textContent.trim()));if(!head){head=heads.find(h=>wanted.some(w=>h.textContent.trim().includes(w)))}const result=document.getElementById('result');if(!head){result.innerHTML='<div class="error">Không tìm thấy nội dung ngôn ngữ này.</div>';return}const box=document.createElement('div');const selected=document.createElement('div');selected.className='selected';selected.textContent=labels[key];box.appendChild(selected);let node=head.nextElementSibling;while(node&&node.tagName!=='H2'){box.appendChild(node.cloneNode(true));node=node.nextElementSibling}result.innerHTML='';result.appendChild(box);document.getElementById('choices').classList.add('hidden');document.getElementById('title').classList.add('hidden');result.classList.remove('hidden');const back=document.createElement('a');back.className='back';back.href='javascript:location.reload()';back.textContent='← Chọn ngôn ngữ khác';result.appendChild(back);window.scrollTo({top:0,behavior:'smooth'})}init();</script></body></html>
